# ============================================================
#  ربطُ مشروع الصفحات بقاعدته
# ============================================================
#  ‎functions/‎ في جذر المرفوع تصير نقاطًا على النطاق نفسِه (‎/api/…‎) — فلا
#  خادمَ ثانٍ ولا نطاقَ ثانٍ ولا ‎CORS‎ يُضبط.
#
#  والاسمُ ‎DB‎ لا ‎academia‎: هو الاسمُ الذي تُنادى به القاعدةُ في الشيفرة
#  (‎env.DB‎)، ويبقى واحدًا ولو تعدّدت القواعدُ أو تبدّلت أسماؤها.

name = "academia-kfupm"
compatibility_date = "2026-08-27"
pages_build_output_dir = ".stage"

[[d1_databases]]
binding = "DB"
database_name = "academia"
database_id = "aff98173-7af1-4e20-8b45-4c7fd36d2d4d"
