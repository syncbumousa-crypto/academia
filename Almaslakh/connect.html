<!doctype html>
<!-- ===== صفحةُ الموافقة على ربط مساعدٍ ذكيّ (ROADMAP-MCP) =====
     يصلها المستخدمُ من Claude أو ChatGPT عبر ‎/api/mcp/oauth/authorize‎. تقرأ جلستَه من متصفّحه (رمزُ الموقع نفسُه)،
     فيوافق ⇐ ‎/oauth/approve‎ يصنع رمزَ التفويض ويردّ عنوانَ العودة إلى المساعد. وSupabase لا يقدّم HTML من نطاقه، فسكنت هنا. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ربط المسلخ</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/mark/mark-light.svg?v=mark2">
<script>try { var t = localStorage.getItem('ac.theme'); if (!t) t = (JSON.parse(localStorage.getItem('academia2:v1') || '{}') || {}).theme; if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
<style>
@font-face { font-family: 'IBM Plex Sans Arabic'; font-weight: 400; src: url(../assets/fonts/IBMPlexSansArabic-Regular.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Sans Arabic'; font-weight: 700; src: url(../assets/fonts/IBMPlexSansArabic-Bold.woff2) format('woff2'); font-display: swap; }
:root { --bg: #eef2f2; --card: #fff; --fg: #14233f; --dim: #5d6b82; --line: #d7dee8; --teal: #2c5e65; --soft: #f2f5f5; --no: #c0564b; }
html[data-theme="dark"] { --bg: #0f171a; --card: #172226; --fg: #e7ecee; --dim: #9aa9af; --line: #2a4249; --teal: #3b6c73; --soft: #1b2529; --no: #e08377; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.7 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; padding: 24px 16px; }
.card { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px 22px; box-shadow: 0 18px 40px -26px rgba(13, 42, 72, .35); text-align: center; }
.pair { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
.pair .ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--soft); }
.pair .ic img, .pair .ic svg { width: 30px; height: 30px; }
.pair .dots { color: var(--dim); letter-spacing: 3px; }
.cl { color: #D97757; } .gp { color: var(--fg); }
h1 { font-size: 18px; margin: 0 0 6px; }
.sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
ul { text-align: start; margin: 0 0 18px; padding: 12px 16px 12px 12px; list-style: none; background: var(--soft); border-radius: 14px; font-size: 13px; }
ul li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
ul li b { color: var(--teal); flex: none; }
html[data-theme="dark"] ul li b { color: #7fc0c7; }
.btns { display: flex; gap: 8px; }
button, .lnk { flex: 1; font: inherit; font-weight: 700; border-radius: 12px; padding: 10px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); text-decoration: none; display: inline-block; }
button.go { background: var(--teal); color: #fff; border-color: transparent; }
button:disabled { opacity: .55; cursor: default; }
.host { font-size: 11.5px; color: var(--dim); margin-top: 12px; direction: ltr; }
.err { color: var(--no); font-size: 13px; margin: 0 0 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="pair"><span class="ic" id="ai"></span><span class="dots">• • •</span><span class="ic"><img src="../assets/icons/mark/mark-petrol.svg?v=mark1" alt=""></span></div>
  <h1 id="h">…</h1>
  <p class="sub" id="sub"></p>
  <ul id="can" hidden>
    <li><b>✓</b><span data-t="c1"></span></li>
    <li><b>✓</b><span data-t="c2"></span></li>
    <li><b>✓</b><span data-t="c3"></span></li>
    <li><b>✗</b><span data-t="c4"></span></li>
  </ul>
  <p class="err" id="err" hidden></p>
  <div class="btns" id="btns" hidden><button type="button" class="go" id="ok"></button><button type="button" id="no"></button></div>
  <div class="btns" id="login" hidden><a class="lnk" href="./" target="_blank" rel="noopener" id="lg"></a><button type="button" id="re"></button></div>
  <p class="host" id="host"></p>
</main>

  var lang = 'ar'; try { lang = (JSON.parse(localStorage.getItem('academia2:v1') || '{}') || {}).lang === 'en' ? 'en' : 'ar'; } catch (e) {}

  } : {
    h: function (n) { return 'ربط ' + n + ' بالمسلخ'; }, sub: 'بيقدر يشتغل في حسابك كذا:', c1: 'يدوّر على المواد ويقرأ مساهماتك',
    c2: 'يضيف بطاقات ملخص وبنوك أسئلة كمسودة', c3: 'أنت تراجع المسودة وتنشرها بنفسك', c4: 'ما يقدر يحذف أو ينشر أو يلمس مساهمات غيرك',

  };
  if (lang === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), P = {};
  ['client_id', 'redirect_uri', 'state', 'code_challenge', 'scope', 'resource'].forEach(function (k) { if (q.get(k)) P[k] = q.get(k); });
  var tok = function () { try { return localStorage.getItem('academia2:tok:user') || ''; } catch (e) { return ''; } };
