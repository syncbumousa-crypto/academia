<!doctype html>
<!-- ‎spellcheck="false"‎ على الجذر: المتصفّح يقرأ ما تكتب فيرسم تحته خطًّا أحمر للإملاء
     وأزرقَ مزدوجًا للنحو، ويُظلّل المنطقةَ بالأزرق عند المرور. وهو في نصٍّ عربيٍّ عِلمِيٍّ
     ضوضاءُ لا فائدةَ فيها. والسِّمةُ تُورَّث، فوضعُها هنا يُطفئه في كل حقلٍ في الموقع —
     القائمِ منها والذي يولد بعدُ -->
<html lang="ar" dir="rtl" data-theme="light" spellcheck="false" data-glass="liquid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديميا</title>

  <!-- ===== أيقونةُ اللسان =====
       ثلاثةُ مقاساتٍ مصرَّحة، ولكلٍّ قصُّه: ‎١٦‎ مقصوصةٌ إلى ‎٧٢٪‎ لأنّ هامشَ
       الأيقونة يأكل ثلثَ بكسلاتها في ذلك الحجم فتذوب العلامات، و‎٣٢‎ فما فوق
       كما رُسمت. والمتصفّحُ ينتقي الأقربَ إلى ما يطلب، فيُعطى مضبوطًا لا مُصغَّرًا.
       و‎favicon.ico‎ في الجذر لمن لا يقرأ الوسمَ ويطلبه بالعادة. -->
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">

  <link rel="stylesheet" href="../shared/styles.css?v=1">

  <!-- نظامُ الزجاج: الورقةُ نفسُها الّتي يلبسها الجذر. ولا قيمةَ لونٍ فيها
       — القيمُ تحتُ في ‎<style>‎ الصفحة، فهي الّتي تُفرّق الموقعين. -->
  <link rel="stylesheet" href="../shared/glass.css?v=1">

  <!-- ===== مبدِّلُ المجتمع =====
       موضعُ هذي القواعد ههنا لا في ‎shared/styles.css‎ ريثما يُسوّى الفرقُ بين
       المنشور والمستودع (الورقةُ إحدى الملفّات المتفرّقة بينهما، فتعديلُ الأقدم
       يمحو الأحدث). ومتى استوَيا نُقل هذا البابُ إلى موضعه. -->
  <style>
    /* ============================================================
       م٢ · قيمُ المسلخ — تيلٌ في الصبغة لا في الحبر
       ============================================================
       البوّابةُ واحدةٌ في الموقعين: تباينُ النصّ على الزجاج ≥ ‎4.5:1‎ على
       أسوأ خلفيّةٍ تمرّ تحته. وحُسب للمسلخ على سبع خلفيّات، فظهر الثمن:
       لو بقي نصُّ الصفوف تيلًا (‎#2c5e65‎) لَلزم الزجاجَ **٨٦٪** تعتيمًا في
       الفاتح و**٩٢٪** في الداكن — جدارٌ عليه إشاعةُ شفافيّة لا زجاج.
       فانتقل التيلُ من الحبر إلى الصبغة: اللوحُ تيليٌّ يُرى من أوّل نظرة،
       والنصُّ حبرٌ — فنزل الحدُّ إلى **٥٨٪** و**٦٥٪**. وهما أقلُّ تعتيمٍ
       يَعبُر، محسوبًا لا مُجرَّبًا. والتفصيلُ في ‎ROADMAP-SIDEBAR-MASLAKH.md‎.
       ============================================================ */
    :root {
      --pnl-pad: clamp(16px, 3vw, 32px);
      --glass:      #e7eff0;
      --glass-mix:  58%;
      --glass-ink:  #14233f;
      --glass-edge: rgba(255,255,255,.85);
      --glass-cast: rgba(13,42,72,.13);
    }
    html[data-theme="dark"] {
      --glass:      #17313a;
      --glass-mix:  65%;
      --glass-ink:  #ffffff;
      --glass-edge: rgba(255,255,255,.10);
      --glass-cast: rgba(0,0,0,.34);
    }

    /* ===== وأين يبقى التيلُ إذن =====
       حيث يُقرأ **رمزًا لا متنًا**: الصفُّ النشِط، والعلامة، والمقبض،
       وزرُّ الانضمام. والنشِطُ لوحةٌ تيليّةٌ **شفّافة** لا مستطيلٌ مصمت:
       المصمتُ داخل الزجاج يَكسره — يقول للعين «هذا ليس شفّافًا» فيُبطل
       ما تحته. فالتيلُ يُرى واللوحُ يبقى زجاجًا. */
    .sidebar .tabs button.is-active {
      background: color-mix(in srgb, var(--c-kfupm) 78%, transparent);
      color: #fff;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-kfupm) 90%, transparent); }
    html[data-theme="dark"] .sidebar .tabs button.is-active {
      background: color-mix(in srgb, var(--c-kfupm) 86%, transparent); }
    /* وحبرُ الصفوف في الجلد الداكن: في الأمّ قاعدةٌ أعلى تخصيصًا
       ‎html[data-theme="dark"] :is(.langbar,.tabs,.themebar) button:not(.is-active)‎
       تُلبسها تيلًا شاحبًا ‎#7fb3bb‎ — وذاك الحبرُ يطلب ٩٢٪ تعتيمًا. قِيس
       فوُجد غالبًا، فيُردُّ بمثل تخصيصه. */
    html[data-theme="dark"] .sidebar :is(.langbar, .tabs, .themebar) button:not(.is-active),
    html[data-theme="dark"] .sidebar .side-ctl button:not(.is-active),
    html[data-theme="dark"] .sidebar .side-logo { color: var(--glass-ink); }

    .side-mark { color: var(--c-kfupm); }
    html[data-theme="dark"] .side-mark { color: var(--brand-tx); }
    .side-handle { color: var(--c-kfupm); }
    .sidebar .side-acct .side-join { background: var(--c-kfupm); color: #fff; }
    .sidebar .side-acct .side-join:hover { background: var(--c-kfupm); color: #fff; opacity: .88; }

    /* ============================================================
       م٠ · لقمتان قبل الزجاج — ‎ROADMAP-SIDEBAR-MASLAKH.md‎
       ============================================================
       أ· رفعُ «الاختبارات» و«إحصائياتي».
          في المشترك ‎.sidebar .tabs--me { margin-top: auto }‎، والفضلةُ كلُّها
          تُجمع عند أوّل هامشٍ تلقائيّ، فكانت المجموعةُ الثانيةُ تهبط إلى
          القاع و**٢١٨ بكسلًا** من الفراغ تفصلها عن «الركن». فيُنقل الهامشُ
          إلى ما بعدها: حاملٌ واحدٌ للفضلة، لكنّه الآن شريطُ التحكّم.
          وهو العلاجُ نفسُه المطبَّقُ في الجذر.
       ب· استواءُ الارتفاع. كانت ٤٦ و٤٧: الصفُّ الذي يحمل ‎border-top‎ يزيد
          بكسلًا لأنّ الارتفاعَ محسوبٌ من الحَشْو لا مكتوبًا. فيُكتب صريحًا،
          فيطوي الحدَّ داخلَه ولا يزيد. ============================== */
    .sidebar .tabs--me { margin-top: 0; }
    .sidebar .tabs--me + .side-ctl { margin-top: auto; }
    .sidebar .tabs button { min-height: 46px; padding-block: 0; }

    /* الشعارُ والمبدِّلُ أخوان: فُرجةٌ بينهما أضيقُ من فُرجة الشريط (‎gap:14px‎) */
    .side-head { display: flex; flex-direction: column; gap: 5px; }

    /* الشعارُ والاسمُ قُفلٌ واحد: الرمزُ يتقدّم الاسمَ في القراءتين كلتيهما.
       والشريطُ يبقى في مجرى العربيّة ولو صارت الصفحةُ إنجليزيّة — قِيسَ فلم
       ينقلب الصفُّ من نفسه، فيُقلب صراحةً بقاعدةِ ‎data-lang‎ تحتُ.
       والرمزُ أخٌ لـ‎.side-logo‎ لا ابنٌ لها: المحرّكُ يكتب فيها بـ‎textContent‎
       عند تبديل اللغة، فما بداخلها يُمحى. */
    .side-brand { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .side-mark  { width: 27px; height: auto; flex: none; display: block;
                  color: var(--c-kfupm); }
    html[data-theme="dark"] .side-mark { color: var(--brand-tx); }
    html[data-lang="en"]    .side-brand { flex-direction: row-reverse; }
    .side-mark-a { display: flex; flex: none; color: inherit; text-decoration: none;
                   border-radius: 8px; transition: opacity .15s; }
    .side-mark-a:hover { opacity: .7; }
    .side-mark-a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .side-com  { display: flex; flex-direction: column; gap: 5px; }

    .sc-now {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      width: fit-content; margin: 0 auto; padding: 1px 9px;
      border: 0; border-radius: 9px; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 700; line-height: 1.7;
      color: var(--c-ink-soft);
      transition: color .15s, background .15s;
    }
    .sc-car { width: 12px; height: 12px; flex: none; transition: transform .18s; }
    .sc-now[aria-expanded="true"] .sc-car { transform: rotate(180deg); }

    /* ===== م٦ · المبدِّلُ كتلةٌ لا صندوق =====
       كان جوفُه سطحًا مصمتًا (‎--surface‎) بحدٍّ قائمٍ داخلَ الزجاج. والمصمتُ
       داخل الزجاج يَكسره: يقول للعين «هذا ليس شفّافًا» فيُبطل ما تحته.
       فصار بلغة اللوح نفسِها: لوحةٌ من حبره، وخطٌّ شعريٌّ تحت الترويسة
       حين تُفتح — وهو شكلُ «كتلة الركن» في الجذر حرفًا بحرف. */
    .side-com { border-radius: var(--row-r, 14px);
                transition: background .2s ease, box-shadow .2s ease; }
    .side-com:has(.sc-menu:not([hidden])) {
      background: var(--plate);
      box-shadow: inset 0 0 0 1px var(--plate-edge);
      padding-bottom: 4px; gap: 0; }
    .sc-now { border-radius: 10px; width: 100%; padding: 4px 9px; }
    .sc-now:hover { color: var(--glass-ink); background: var(--plate); }
    .side-com:has(.sc-menu:not([hidden])) .sc-now {
      box-shadow: inset 0 -1px 0 var(--plate-edge); border-radius: 10px 10px 0 0; }
    .sc-menu { border: 0; background: transparent; padding: 4px; }
    .sc-item { border-radius: 9px; color: var(--glass-ink); opacity: .82; }
    .sc-item:hover { background: var(--plate); color: var(--glass-ink); opacity: 1; }
    .sc-item.is-on { background: var(--plate-hi); color: var(--glass-ink); opacity: 1;
                     box-shadow: inset 0 0 0 1px var(--plate-edge); font-weight: 700; }
    /* وفي السكّة لا أسماءَ ولا كتلة */
    body.side-rail .side-com:has(.sc-menu:not([hidden])) {
      background: transparent; box-shadow: none; padding-bottom: 0; }
    body.side-rail .sc-now .sc-nm { display: none; }

    /* القائمةُ تتمدّد في مجرى الشريط ولا تطفو فوقه: الشريطُ ‎overflow-y:auto‎
       فالطافي يُقصّ عند حافّته، والمتمدّدُ يدفع ما تحته ولا يُقصّ أبدًا */
    .sc-menu {
      display: flex; flex-direction: column; gap: 2px;
      padding: 4px; border: 0; border-radius: 12px;
      background: transparent;   /* م٦: لا سطحَ مصمتًا داخل الزجاج */
    }
    .sc-menu[hidden] { display: none; }   /* ‎display:flex‎ يغلب ‎[hidden]‎ لولا هذا */

    .sc-item {
      border: 0; border-radius: 8px; background: transparent; cursor: pointer;
      padding: 5px 10px; text-align: center;
      font-family: inherit; font-size: 12.5px; color: var(--c-ink-soft);
      transition: color .15s, background .15s;
    }
    /* م٦: وحبرُهما حبرُ اللوح لا التيل — التيلُ ‎#2c5e65‎ على لوحةٍ شفّافةٍ
       في جلدٍ داكنٍ داكنٌ على داكن. والهويّةُ في اللوحة لا في الكلمة. */
    .sc-item:hover  { color: var(--glass-ink); background: var(--plate); opacity: 1; }
    .sc-item.is-on  { color: var(--glass-ink); font-weight: 700; opacity: 1;
                      background: var(--plate-hi);
                      box-shadow: inset 0 0 0 1px var(--plate-edge); }
    .sc-dash        { letter-spacing: .12em; }
    a.sc-item { display: block; text-decoration: none; }
  </style>
</head>
<body>

<!-- ===== م٣ · انكسارُ الحافّة =====
     خريطةُ إزاحةٍ تُقرأ قناتاها: الحمراءُ تُزيح أفقيًّا، والخضراءُ رأسيًّا.
     فجعلتُ الخضراءَ ثابتةً (لا إزاحةَ رأسيّة)، والحمراءَ ١٢٨ في الوسط (أي
     صفرًا) وتندفع إلى طرفيها — فينحني ما خلفَ الزجاج عند حافّتيه ويستوي
     في وسطه، كشريحةِ زجاجٍ مشطوفةِ الحرفين. وهي مضمَّنةٌ هنا لا ملفًّا:
     مرشّحٌ ينتظر طلبَ شبكةٍ يُرى بعد أن تُرسم الصفحة. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="lg-edge" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='rgb(255,128,0)'/%3E%3Cstop offset='0.16' stop-color='rgb(128,128,0)'/%3E%3Cstop offset='0.84' stop-color='rgb(128,128,0)'/%3E%3Cstop offset='1' stop-color='rgb(0,128,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='8' fill='url(%23g)'/%3E%3C/svg%3E" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="26"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>


  <!-- الشريط الجانبي: التابان (زرّان تحت بعض) فوق، والتحكم بالمظهر واللغة أسفله.
       يمين مع العربية · يسار مع الإنجليزية (عبر html[data-lang]) -->
  <aside class="sidebar" id="sidebar">
    <!-- شعار الموقع: أعلى الشريط الجانبي (يمين) بخط الهوية KFUPM Display -->
    <!-- ===== الشعارُ ومبدِّلُ المجتمع =====
         ‎.side-logo‎ يبقى كما هو ولا يُلَفّ المبدِّلُ داخله: المحرّكُ يكتب فيه
         اسمَ الموقع عند تبديل اللغة (‎lg.textContent = t.siteName‎)، و‎textContent‎
         يمحو ما تحته. فهما أخوان في ‎.side-head‎.
         والخياراتُ معروضةٌ ولا تَفعل شيئًا بعدُ — تُوصَل يومَ تُبنى المجتمعات. -->
    <div class="side-head">
      <div class="side-brand">
        <!-- «لُب» — قلبٌ بثلاثة رؤوس: ثلاثُ دوائرَ متداخلةٍ وإسفينٌ يمسُّها.
             الصندوقُ هو مدى الشكل نفسِه بلا حَشْو، فيُقاس بالاسم لا بالفراغ. -->
        <a class="side-mark-a" href="https://syncbumousa-crypto.github.io/lobe/"
           target="_blank" rel="noopener" title="لُب" aria-label="لُب">
          <svg class="side-mark" viewBox="-155 57.49 310 244.51" fill="currentColor"
               xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z"/>
          </svg>
        </a>
        <div class="side-logo">أكاديميا</div>
      </div>

      <div class="side-com" id="side-com">
        <!-- السهمُ أوّلَ العنصرين فيقع يمينَ النصّ في العربيّة، وينقلب مع اللغة -->
        <button class="sc-now" id="sc-now" type="button" aria-expanded="false" aria-controls="sc-menu">
          <svg class="sc-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <span class="sc-nm">المسلخ</span>
        </button>

        <div class="sc-menu" id="sc-menu" hidden>
          <!-- الأوّلُ: أكاديميا نفسُها، بلا مجتمع -->
          <a class="sc-item sc-dash" href="../platform/index.html" title="أكاديميا — بلا مجتمع">—</a>
          <button class="sc-item is-on" type="button">المسلخ</button>
          <button class="sc-item" type="button">المدرج</button>
          <button class="sc-item" type="button">القدرات</button>
          <button class="sc-item" type="button">الآيلتس</button>
        </div>
      </div>
    </div>

    <nav class="tabs">
      <button type="button" data-tab="market" class="is-active">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="tab-tx">المكتبة</span>
      </button>
      <button type="button" data-tab="library">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="tab-tx">الركن</span>
      </button>
    </nav>

    <!-- ===== وما يخصُّك أنت: مجموعةٌ ثانيةٌ في قاع الشريط =====
         الأوليان أبوابُ **المحتوى** (مكتبةُ الموقع وركنُك فيه)، وهاتان سجلّاك أنت —
         لا تُتصفَّح بل يُرجع إليهما. فتُفصلان بفراغٍ يدفعهما إلى القاع فوق شريط
         التحكّم، فلا تُقرأ الأربعةُ صفًّا واحدًا وهي جنسان. -->
    <nav class="tabs tabs--me">
      <!-- الاختبارات الماضية: ورقةٌ عليها صحّ — «امتحانٌ فُرغ منه» لا ساعةٌ ولا رسمٌ
           بيانيّ، فالمقصودُ الأوراقُ التي مرّت لا الزمنُ ولا الأرقام -->
      <button type="button" data-tab="past">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14.5l2 2 4-4"/></svg>
        <span class="tab-tx">الاختبارات</span>
      </button>
      <!-- الإحصائيات: أعمدةٌ صاعدة — «ما جمعتَه» لا «ما فعلتَه»، فلا تلتبس بورقة صحّ -->
      <button type="button" data-tab="stats">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span class="tab-tx">إحصائياتي</span>
      </button>
    </nav>

    <div class="side-ctl">
      <!-- تاريخ اليوم (فوق) ثم الوقت (تحته) بتوقيت السعودية — فوق زرّي المظهر -->
      <div class="sb-date"><span id="today-date"></span></div>

  <div class="mmodal" id="card-modal" hidden>

         ابنٌ للنافذة لا للمسرح، وإلّا تقيّد بعرضه. زرُّ سحبه أيقونةٌ وحدها متدلّيةٌ من حافّته -->
    <div class="cd-dw" id="cd-drawer">

        <div class="cd-types" id="cd-types" role="group" aria-label="نوع البطاقة"></div>
      </div>
      <!-- ===== صفُّ الحافّة: المِقبضُ ثمّ ألسنةُ المطويّات إلى يساره =====
           الصفُّ متوسّطٌ في عرض الشاشة، فكلّما نزل لسانٌ **يسارَ** المِقبض انزاح المِقبضُ
           يمينًا وبقي الكلُّ متوسّطًا — لا يُدفع من مكانه بل يقتسم الوسطَ مع ما جاوره -->
      <div class="cd-dwrow">
        <button type="button" class="cd-dw__handle" id="cd-handle" aria-expanded="false"></button>
        <div class="cd-mins" id="cd-mins"></div>
        <!-- الموازن: فراغٌ خاوٍ في ذيل الصفّ عرضُه (عرض «+» + الفُرجة). الصفُّ يقتسم وسطَه
             معه فينزاح، فيستقرّ مركزُ **الألسنة** على مركز الشاشة ويقف «+» على طرفها —
             فلا ترقص الألسنةُ كلّما فُتحت نافذةٌ أو طُويت. وهو فراغٌ لا ‎transform‎:
             المتحوَّلُ يصير جذرَ خلفيّةٍ فيموت الضبابُ في أبنائه -->
        <i class="cd-bal"></i>
      </div>
    </div>

    <!-- لكلّ نافذةٍ طبقتُها: صفيحةٌ مطلقةٌ تملأ الشاشة وتتوسّط ما فيها. ولولاها لَاصطفّت
         النوافذُ جنبًا إلى جنبٍ في صفّ النافذة الأمّ المرن بدل أن تتراكب — فتوسيطُ
         الواحدة يستقيم في صفٍّ، وتوسيطُ اثنتين في **الموضع نفسِه** لا يستقيم إلّا بطبقتين.
         والصفيحةُ لا تلتقط المؤشّر (‎pointer-events:none‎) وإلّا حجبت العتمةَ التي تُغلق بها -->
    <div class="cd-layer">
    <!-- ثلاثة أسطحٍ مستقلّة على مسرحٍ واحد: منتقي النوع · البطاقة · الوجهة.
         لا شريطَ أدواتٍ ثابت — فقاعةُ التحديد تنوب عنه، فتبقى البطاقة بطاقةً -->
    <div class="cd-stage">
      <div class="mmodal__card mmodal__card--md" id="cd-card">
        <!-- الترويسة العليا: من صنعها · نسختها · من عندها الآن · زياراتها.
             وأزرارُ النافذة (✕ · تكبير · نافذة مستقلّة) بُنيت داخلها في ‎renderCardDlg‎
             لا هنا: لتقع على خطّ ما فيها من أيقونات بمحاذاةٍ واحدة مهما تبدّل ارتفاعُه -->
        <div class="cd-meta" id="cd-meta"></div>

        <!-- كل حقل ونتوؤه: الأيقونة لسانٌ بارز فوق مستطيل النصّ لا تسمية عائمة فوقه -->
        <div class="cd-body">
          <div class="cd-field">
            <p class="cd-flab" id="cd-front-lab"></p>
            <!-- مِسطرةُ التقريب: تقرأ ما تفعله أصابعُك وتُعدَّل منها. وترتيبُها في السطر
                 ترتيبُ الكتابة: «‎−‎» أوّلًا فتقع يمينَ الرقم، و«‎+‎» آخرًا فتقع يسارَه.
                 وهي أختُ الحقل لا ابنتُه، فلا يبلغها التقريبُ ولا تصغر معه -->
            <span class="cd-zbar">
              <button type="button" class="cd-zb" data-zs="-1">−</button>
              <b class="cd-zval">100%</b>
              <button type="button" class="cd-zb" data-zs="1">+</button>
            </span>
            <div class="cd-in" id="cd-front" contenteditable="true"></div>
          </div>
          <div class="cd-field">
            <p class="cd-flab" id="cd-back-lab"></p>
            <div class="cd-in" id="cd-back" contenteditable="true"></div>
          </div>
        </div>

        <!-- الترويسة السفليّة: وجهةُ البطاقة وزرُّ نشرها — الزرُّ يمينًا والمسارُ يسارًا،
             تصلهما شَرَطاتٌ تمرّ خلف مستطيل المسار. وكان الرصيفُ سطحًا مستقلًّا تحت النافذة
             يصله خيطٌ رأسيّ، فصار الكلُّ جسمًا واحدًا -->
        <div class="cd-foot" id="cd-foot"></div>
      </div>

      <!-- مقابضُ التوسيع الثمانية: أطرافٌ على حوافّ المسرح لا على البطاقة — المسرحُ هو
           الصندوقُ الذي يُقاس ويُوسَّع، والبطاقةُ تملؤه. و‎ex/ey‎ الطرفُ المشدود:
           ‎-1‎ يسارٌ أو أعلى · ‎+1‎ يمينٌ أو أسفل — بالجهات المرئيّة لا المنطقيّة،
           فمؤشّرُ التوسيع نفسُه مرئيٌّ لا ينقلب بانقلاب الكتابة -->
      <i class="cd-rz cd-rz--t" data-ey="-1"></i>
      <i class="cd-rz cd-rz--b" data-ey="1"></i>
      <i class="cd-rz cd-rz--l" data-ex="-1"></i>
      <i class="cd-rz cd-rz--r" data-ex="1"></i>
      <i class="cd-rz cd-rz--tl" data-ex="-1" data-ey="-1"></i>
      <i class="cd-rz cd-rz--tr" data-ex="1" data-ey="-1"></i>
      <i class="cd-rz cd-rz--bl" data-ex="-1" data-ey="1"></i>
      <i class="cd-rz cd-rz--br" data-ex="1" data-ey="1"></i>
    </div>
    </div>
    <!-- فقاعة التنسيق: تُلحق بالمسرح لا بالبطاقة كي لا يمحوها إعادةُ الرسم -->
    <div class="cd-bub" id="cd-bub" hidden></div>
  </div>

  <!-- ===== نافذة «الدورة» — مُشغّلُ رزمة الشروح =====
       ترويستُها غلافُ الدورة يمينًا واسمُها يساره. وجوفُها نصفان: المستطيلُ الكبير فيه
       الشرحُ الجاري، ويساره شجرةُ الدورة بمجلداتها كمسارٍ يُنتقل فيه. -->
  <div class="mmodal" id="vw-modal" hidden>
    <div class="mmodal__card mmodal__card--course vw-card">
      <div class="mmodal__head vw-head">
        <!-- والغلافُ حاملُ توكناتٍ كذلك: هو خارج ‎.vw-body‎ فلا يبلغه حاملُها،
             و‎.x3-art‎ تقرأ ‎--u-*‎ — فيلبس ‎vw-tok‎ ويذوب بها -->
        <span class="vw-art vw-tok" id="vw-art"></span>
        <h3 class="mmodal__title" id="vw-title"></h3>
        <button class="mmodal__close" id="vw-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <!-- حاملُ التوكنات: يذوب بـ‎display: contents‎ فلا يُغيّر تخطيطَ الشبكة -->
      <div class="vw-body"><span class="vw-tok">
        <div class="vw-main" id="vw-main"></div>
        <aside class="vw-side" id="vw-side"></aside>
      </span></div>
    </div>
  </div>

  <!-- ===== نافذة «استورد من المكتبة» =====
       بابان أوّلًا (الشروح · البطائق والملخصات)، ثمّ مساهماتُ القسم المختار **بواجهة
       المكتبة نفسِها**: ‎#cm-ui‎ يُنقل إلى جوفها كما يُنقل إلى رفّ الموارد، فلا يُبنى
       عارضٌ ثانٍ ولا تُنسخ دالّةُ عرضٍ واحدة. وبابُ الرجوع في ترويستها يردّك إلى البابين -->
  <div class="mmodal" id="jri-modal" hidden>
    <div class="mmodal__card mmodal__card--course jri-card">
      <div class="mmodal__head">
        <button class="jri-back" id="jri-back" type="button" hidden></button>
        <h3 class="mmodal__title" id="jri-title"></h3>
        <button class="mmodal__close" id="jri-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="jri-body" id="jri-body"></div>
      <!-- الرصيف: خبرُ ما حدَّدتَ، ثمّ وجهتُه في رحلتك، ثمّ فعلُ الاستيراد.
           وهو قائمٌ من أوّل فتحةٍ — قبل الدخول من أيّ باب — ليُعرف أنّ للنافذة مقصدًا -->
      <div class="jri-dock" id="jri-dock"></div>
    </div>
  </div>

  <!-- نافذة إعدادات الترم (الاسم + التواريخ + حذف) — نفس ثيم الجامعة -->
  <div class="mmodal" id="date-modal" hidden>
    <div class="mmodal__card mmodal__card--sm">
      <div class="mmodal__head">
        <h3 class="mmodal__title" id="dm-title">إعدادات الترم</h3>
        <button class="mmodal__close" id="dm-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="dm-body">
        <label class="dm-field">
          <span id="dm-name-label">اسم الترم</span>
          <input type="text" id="dm-name">
        </label>
        <!-- ‏‎type="text" readonly‎ لا ‎type="date"‎: القيمةُ تبقى ‎ISO‎ كما كانت
             (‎.value‎ يُقرأ ويُكتب في المواضع نفسِها بلا تبديل)، والمنعُ لئلّا يفتح
             المتصفّحُ منتقيَه فوق منتقينا. و‎inputmode="none"‎ تكفّ لوحةَ الهاتف. -->
        <label class="dm-field">
          <span id="dm-start-label">تاريخ البداية</span>
          <input type="text" id="dm-start" class="dm-date" readonly inputmode="none" placeholder="—">
        </label>
        <label class="dm-field">
          <span id="dm-end-label">تاريخ النهاية</span>
          <input type="text" id="dm-end" class="dm-date" readonly inputmode="none" placeholder="—">
        </label>
        <!-- مواد الترم: تُعرض هنا ويمكن حذفها -->
        <div class="dm-courses">
          <p class="dm-courses__t"><span id="dm-courses-label">مواد الترم</span><b id="dm-courses-n">0</b></p>
          <div class="dm-courses__list" id="dm-courses"></div>
        </div>
      </div>
      <!-- ولا زرَّ حفظ: كلُّ ما في النافذة يقع فورَ وقوعه، كما كانت
           المادّةُ تُحذف من قائمتها ههنا من قبل -->
      <div class="dm-actions">
        <button class="dm-del" id="dm-delete" type="button">حذف الترم</button>
      </div>
    </div>
  </div>

  <!-- شريط التحديد في محرّر «البطائق» (ROADMAP-SELBAR — اتّجاه أ «الحبّة»):
       يظهر حين تُحدَّد بطائقُ أو مجلدات، ويملؤه cxBarPaint. ابنُ الجسم لا ابنُ اللوح
       ليبقى وأنت تمرّر، وخارجُ #cm-ui كي لا يمحوه إعادةُ رسم الواجهة -->
  <div class="cx-selbar" id="cx-selbar" hidden></div>

  <!-- منتقي ملف الصورة (مخفي، يُستدعى من مربّع صورة المادة) -->
  <input type="file" id="imgpick" accept="image/*" hidden>

  <script>
    // تبديل التابات الأربعة — والمستمعُ على الشريط لا على مجموعةٍ منه:
    // ‏querySelector('.tabs') يمسك الأولى وحدَها، فلا تصل ضغطةُ المجموعة الثانية.
    document.getElementById('sidebar').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]'); if (!b) return;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('is-active', x === b));
      document.getElementById('side-profile').classList.remove('on');   // مغادرة لوحة الحساب
      document.getElementById('panel-account').hidden = true;
      // الركنُ للأعضاء: الزائرُ يُصرف إلى لوحٍ يقول له ما فيه ولا يبني ما لا يبقى له.
      // والحارسُ ههنا لا في app.js لأنّ هذا هو المستمعُ الذي يفتح الألواح.
      const guestNook = b.dataset.tab === 'library' && window.acIsGuest && window.acIsGuest();
      document.getElementById('panel-nook-lock').hidden = !guestNook;
      if (guestNook && window.acNookLock) window.acNookLock();
      document.getElementById('panel-market').hidden  = b.dataset.tab !== 'market';
      document.getElementById('panel-library').hidden = b.dataset.tab !== 'library' || guestNook;
      document.getElementById('panel-past').hidden    = b.dataset.tab !== 'past';
      document.getElementById('panel-stats').hidden   = b.dataset.tab !== 'stats';
      // واللوحان يُبنيان عند فتحهما لا في كل إقلاع: حسابٌ يمشي في بياناتك كلها ولا يُنظر كل مرة
      if (b.dataset.tab === 'past'  && window.acPastPaint)  window.acPastPaint();
      if (b.dataset.tab === 'stats' && window.acStatsPaint) window.acStatsPaint();
    });
  </script>
  <!-- ===== حمولةُ نقلة أنكي — ملفُّ عُدّةٍ مؤقّت =====
       يُحمَّل مرّةً واحدةً لتنزل البطائق، ثمّ يُرفع هذا الوسمُ والملفُّ والدالّةُ معه.
       ما نفعله **استيرادٌ لا ربط**: البطائقُ تصير بيانًا في الموقع كأنّك كتبتَها بيدك،
       ولا يبقى في المشروع اسمُ برنامجٍ آخر ولا ملفٌّ يُقرأ في كلّ إقلاع -->
  <!-- ‏‎seed-cards.js‎ لا يُحمَّل ههنا: ٦٣٥ك تُقرأ مرّةً في عمر المتصفّح
       ثمّ لا تُقرأ أبدًا. فيجلبها المحرّكُ عند الحاجة وحدَها (م٥). -->
  <!-- عبّئ المادة من سيلبوسها — ROADMAP-SYLLABUS.md -->
  <div class="mmodal syl-modal" id="syl-modal" hidden>
    <div class="mmodal__card syl-card">
      <div class="mmodal__head">
        <h3 class="mmodal__title" id="syl-title"></h3>
        <button class="mmodal__close" id="syl-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="syl-body">
        <section class="syl-half syl-half--p">
          <p class="syl-step"><b>1</b><span id="syl-s1"></span></p>
          <textarea class="syl-prompt" id="syl-prompt" readonly spellcheck="false"></textarea>
          <button class="syl-btn syl-btn--copy" id="syl-copy" type="button"></button>
        </section>
        <section class="syl-half syl-half--d">
          <p class="syl-step"><b>2</b><span id="syl-s2"></span></p>
          <div class="syl-drop" id="syl-drop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
            </svg>
            <b id="syl-drop-t"></b>
            <button class="syl-btn" id="syl-pick" type="button"></button>
            <input type="file" id="syl-file" accept=".json,.txt,application/json,text/plain" hidden>
          </div>
          <div class="syl-out" id="syl-out" hidden></div>
          <button class="syl-btn syl-btn--go" id="syl-done" type="button" hidden></button>
        </section>
      </div>
    </div>
  </div>

  <!-- جسرُ الخادم: يسبق المحرّك ليُستبدَل fetch قبل أوّل نداء -->
  <script>
    /* ===== حالتان لا ثلاث: سكّةٌ ⇄ واسع =====
       النظامُ في ‎shared/glass.css‎ يَعرف السكّةَ بصنف ‎body.side-rail‎،
       ومن يضعه هو هذا. وهو نسخةُ الجذر نفسُها وبالخطوات الثلاث:
         ١· يُنظَّف ما حفظه المحرّكُ من «مطويّ» **قبل أن يقرأه** —
            هذا الوسمُ يسبق ‎app.js‎ — فلا تومض الصفحةُ بشريطٍ غائب.
         ٢· وتُعترض الضغطةُ في طور الالتقاط أبدًا، فلا تبلغه قطّ.
         ٣· ويُنزع الصنفُ عند الإقلاع احتياطًا. */
    (function () {
      try {
        var SK = 'academia2:v1', st = JSON.parse(localStorage.getItem(SK) || 'null');
        if (st && st.sideCollapsed) { st.sideCollapsed = false; localStorage.setItem(SK, JSON.stringify(st)); }
      } catch (e) {}

      var RAIL_K = 'academia2:rail:maslakh:v1';
      function setRail(on) {
        document.body.classList.toggle('side-rail', !!on);
        try { localStorage.setItem(RAIL_K, on ? '1' : ''); } catch (e) {}
        var h = document.getElementById('side-handle');
        if (h) h.title = h.ariaLabel = on ? 'توسيع الشريط' : 'تضييق الشريط';
      }
      document.getElementById('side-handle').addEventListener('click', function (e) {
        e.stopImmediatePropagation(); e.preventDefault();
        setRail(!document.body.classList.contains('side-rail'));
      }, true);
      try { if (localStorage.getItem(RAIL_K)) document.body.classList.add('side-rail'); } catch (e) {}

      /* وأيقونةُ «شريط جانبيّ» مكانَ السهم: المحرّكُ يبنيها وهو مشترك،
         فتُبدَّل من ههنا كما صُنع في الجذر. */
      document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.remove('side-closed');
        setRail(document.body.classList.contains('side-rail'));
        var h = document.getElementById('side-handle');
        if (h) h.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
          + ' stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
          + '<rect x="3" y="4.5" width="18" height="15" rx="3.2"/><path d="M15.2 4.5v15"/></svg>';
      });
    })();
  </script>

  <script src="../platform/api-base.js"></script>
  <script src="../shared/courses.js"></script>
  <script src="../shared/covers.js"></script>
  <!-- فهرس وجوه المجلدات: أسماء ملفات emoji/ — يُقرأ في منتقي وجه المجلد -->
  <script src="../platform/emoji.js"></script>
  <script src="../platform/app.js"></script>
  <!-- فتحُ مبدِّل المجتمع وإغلاقُه. والخياراتُ بلا أثرٍ بعدُ: وسمٌ ينتظر وصلَه -->
  <script>
    (function () {
      var b = document.getElementById('sc-now'),
          m = document.getElementById('sc-menu'),
          w = document.getElementById('side-com');
      if (!b || !m || !w) return;
      function put(open) {
        m.hidden = !open;
        b.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      b.addEventListener('click', function (e) { e.stopPropagation(); put(m.hidden); });
      document.addEventListener('click', function (e) {
        if (!m.hidden && !w.contains(e.target)) put(false);
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') put(false); });
    })();
  </script>
</body>
</html>
