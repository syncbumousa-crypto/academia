<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>حارسُ شريط مجلدات المساهمة</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  body{margin:0;background:#20323a;font-family:system-ui,sans-serif}
  #card-modal{display:block;position:static;background:none;padding:18px}
  .mmodal__card.is-sheet{height:420px;width:820px;margin:0 auto;border-radius:12px;display:flex;flex-direction:column}
  .cd-meta{background:#17262c;color:#dfeaec;padding:8px 12px;font-size:13px}
  .cd-dw{height:40px;background:#111}
  .sh-body{flex:1;min-height:0}
  #rep{max-width:820px;margin:14px auto;padding:10px 14px;border-radius:10px;
       background:#17262c;color:#dfeaec;font:13px/1.9 system-ui,sans-serif;direction:rtl;white-space:pre-wrap}
  #rep b.ok{color:#6ec39a}#rep b.no{color:#ff8f87}
</style></head><body>
<div id="card-modal" class="is-pageonly">
  <div class="cd-dw" id="drawer"></div>
  <div class="mmodal__card is-sheet" id="card">
    <div class="cd-meta">ورقة الملخّص</div>
    <div class="pg-folds" id="strip"></div>
    <div class="cd-body sh-body" id="body"><div class="sh-roll"></div></div>
    <div class="cd-foot sh-foot"></div>
  </div>
</div>
<div class="pg-folds" id="empty" hidden></div>
<pre id="rep">PENDING</pre>
<script>
/* بيانٌ بأرقام الواقع: ثلاثةُ مجلداتٍ أحدُها الجذر، وواحدٌ منها مُطفأٌ عمدًا */
var FOLDS = [ {key:'',name:'الجذر',n:1}, {key:'f1',name:'المخاطرة',n:12}, {key:'f2',name:'التقييم',n:5} ];
var ON = { '':1, 'f1':1 };
var ES = function(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; };
document.getElementById('strip').innerHTML =
  FOLDS.map(function(f){ return '<button type="button" class="pg-fold'+(ON[f.key]?' on':'')
    +'" data-pgf="'+ES(f.key)+'"><span class="pg-fold-nm">'+ES(f.name)+'</span>'
    +'<span class="pg-fold-n">'+f.n+'</span></button>'; }).join('')
  +'<button type="button" class="pg-fold pg-fold-all">الكلّ</button>';

var out=[], bad=0;
function L(h){ var s=h(); out.push('<b class="'+(s[0]?'ok':'no')+'">'+(s[0]?'PASS':'FAIL')+'</b> '+s[1]); if(!s[0])bad++; }
var CS=function(el){ return getComputedStyle(el); };

L(function(){ var d=CS(document.getElementById('drawer')).display;
  return [d==='none','صفُّ الدُّرج مخفيٌّ بـdisplay:'+d]; });
L(function(){ var n=document.querySelectorAll('#strip .pg-fold').length;
  return [n===4,'أربعُ حبّاتٍ: ثلاثةُ مجلداتٍ وزرُّ الكلّ ('+n+')']; });
L(function(){ var ns=[].map.call(document.querySelectorAll('#strip .pg-fold-n'),function(e){return e.textContent;}).join('·');
  return [ns==='1·12·5','العددُ على كلّ حبّة: '+ns]; });
L(function(){ var on=CS(document.querySelector('#strip .pg-fold.on')).backgroundColor,
      off=CS(document.querySelector('#strip .pg-fold:not(.on)')).backgroundColor;
  return [on!==off,'المشتعلةُ تفترق بالأرضيّة ('+on+' ≠ '+off+')']; });
/* الشريطُ فوق الورقة — بالإحداثيّات لا بترتيب الوسم */
L(function(){ var s=document.getElementById('strip').getBoundingClientRect(),
      b=document.getElementById('body').getBoundingClientRect();
  return [s.bottom<=b.top+1,'الشريطُ فوق مسرح الورق ('+Math.round(s.bottom)+' ≤ '+Math.round(b.top)+')']; });
/* ===== وهو أخو الورقة لا ابنُها =====
   هذا هو الفحصُ الذي يَحرس العلّة: لو صار داخلَ .sh-body لَأكل من ارتفاعٍ قِيست
   عليه المُلاءمةُ قبله، ففاضت الورقة. والشكلُ لا يكشفه — البنيةُ وحدَها تكشفه */
L(function(){ var inBody=document.getElementById('body').contains(document.getElementById('strip'));
  return [!inBody,'الشريطُ خارجَ ‎.sh-body‎ فلا يَفسد قياسُ المُلاءمة']; });
/* وشريطٌ خاوٍ لا يحجز ارتفاعًا */
L(function(){ var h=document.getElementById('empty').offsetHeight;
  return [h===0,'الشريطُ الخاوي بارتفاع '+h+'px']; });
/* ويتبع جِلدَ الورقة: الداكنُ يرفع --shp-pet فتبقى الحبّةُ مرئيّةً بلا قاعدةٍ ثانية */
L(function(){ var c=document.getElementById('card'), on=document.querySelector('#strip .pg-fold.on');
  var lite=CS(on).borderTopColor;
  c.setAttribute('data-sh','dark');
  var dark=CS(on).borderTopColor;
  c.removeAttribute('data-sh');
  return [lite!==dark,'الحبّةُ تتبع جِلدَ الورقة ('+lite+' ⟵ نهارًا · '+dark+' ⟵ ليلًا)']; });

document.getElementById('rep').innerHTML =
  (bad? '<b class="no">'+bad+' إخفاق</b>' : '<b class="ok">ALL PASS</b>') + '\n' + out.join('\n');
</script></body></html>
