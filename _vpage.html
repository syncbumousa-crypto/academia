<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>حارسُ مربّعات المجلدات</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
 body{margin:0;background:#20323a;font-family:system-ui,sans-serif}
 #card-modal{display:block;position:static;background:none;padding:18px}
 .mmodal__card.is-sheet{height:470px;width:780px;margin:0 auto;border-radius:12px;display:flex;flex-direction:column}
 .cd-meta{background:#17262c;color:#dfeaec;padding:8px 12px;font-size:13px}
 .cd-dw{height:40px;background:#111}.sh-body{flex:1;min-height:0}
 #rep{max-width:780px;margin:14px auto;padding:10px 14px;border-radius:10px;background:#17262c;
      color:#dfeaec;font:13px/1.9 system-ui,sans-serif;direction:rtl;white-space:pre-wrap}
 #rep b.ok{color:#6ec39a}#rep b.no{color:#ff8f87}
 .off{position:absolute;left:0;top:-3000px}
</style></head><body>
<div id="card-modal" class="is-pageonly">
  <div class="cd-dw" id="drawer"></div>
  <div class="mmodal__card is-sheet" id="card">
    <div class="cd-meta">ورقة الملخّص</div>
    <div class="pg-folds" id="acc"></div>
    <div class="cd-body sh-body" id="body"><span class="cd-zbar sh-zbar">− 100% +</span></div>
    <div class="cd-foot sh-foot"></div>
  </div>
</div>
<!-- بطاقةٌ بجِلدٍ داكنٍ ثابت: يُقاس اتّباعُ الجِلد بالمقارنة لا بقلب سمةٍ ثمّ قراءةِ
     نمطٍ محسوبٍ في التِّكّة نفسِها — تلك تردُّ القيمةَ القديمة -->
<div class="off"><div class="mmodal__card is-sheet" id="dCard" data-sh="dark" style="height:300px;width:780px;display:flex;flex-direction:column">
  <div class="pg-folds" id="dark"></div></div></div>
<!-- اثنا عشرَ مربّعًا: أيَنضغط أصغرُها دون حدّه أم يُمرَّر الصفّ؟ -->
<div class="off"><div class="mmodal__card is-sheet" id="mCard" style="height:300px;width:780px;display:flex;flex-direction:column">
  <div class="pg-folds" id="many"></div></div></div>
<!-- ثلاثُ طبقاتٍ مفتوحةٍ في نافذةٍ بقدر الحقيقيّة: أيبقى للورقة نصيب؟ -->
<div class="off"><div class="mmodal__card is-sheet" id="sCard" style="height:460px;width:780px;display:flex;flex-direction:column">
  <div class="cd-meta">س</div><div class="pg-folds" id="deep"></div>
  <div class="cd-body sh-body" id="sBody" style="flex:1;min-height:0"></div></div></div>
<div class="pg-folds" id="empty" hidden></div>
<!-- شاهدٌ بلا أنماطنا: شريطُ التمرير الافتراضيّ، يُقاس ليُعرف كم نَحُف شريطُنا عنه -->
<div class="off"><div id="ctl" style="width:120px;overflow-x:scroll"><div style="width:600px;height:10px"></div></div></div>
<pre id="rep">PENDING</pre>
<script>
var ES=function(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;};
var TOP='#';
/* نسخةٌ من البانِي كما في app.js. وهذا يَحرس النمطَ والهندسة؛ أمّا أنّ الموقعَ
   يَبني هذا الشكلَ فعلًا فيَحرسه _vflow.html بالضغط على الموقع نفسِه */
function box(nodes,open,pk){
 if(!nodes||!nodes.length) return '';
 var openId=open.get(pk);
 return '<div class="pg-row" data-pgp="'+ES(pk)+'">'+nodes.map(function(k){
  var has=k.kids&&k.kids.length, wide=has&&k.id===openId;
  var face='<span class="pg-nm">'+ES(k.name)+'</span>';
  return '<div class="pg-box'+(wide?' is-wide':'')+(has?'':' pg-box--leaf')+'">'
   +(has?'<button type="button" class="pg-face" data-pgx="'+ES(k.id)+'" data-pgp="'+ES(pk)+'" aria-expanded="'+wide+'">'+face+'</button>'
        :'<div class="pg-face pg-face--leaf">'+face+'</div>')
   +(has?'<div class="pg-in">'+box(k.kids,open,k.id)+'</div>':'')+'</div>';
 }).join('')+'</div>';
}
/* بيانٌ بأرقام الواقع: جذرٌ ساكن، و«المخاطرة» متوسِّعةٌ وفي جوفها «بيتا» متوسِّعةٌ أيضًا */
var N=[
 {id:'',  name:'الجذر',    n:3,  kids:[]},
 {id:'f1',name:'المخاطرة', n:12, kids:[
   {id:'f1a',name:'بيتا',   n:5, kids:[{id:'f1a1',name:'التغاير',n:2,kids:[]},{id:'f1a2',name:'بيتا الرافعة',n:3,kids:[]}]},
   {id:'f1b',name:'التشتّت',n:7, kids:[]},
   {id:'f1c',name:'الذيل',  n:3, kids:[]}]},
 {id:'f2',name:'التقييم',  n:5,  kids:[{id:'f2a',name:'الخصم',n:5,kids:[]}]},
 {id:'f3',name:'السيولة',  n:8,  kids:[]}
];
document.getElementById('acc').innerHTML  = box(N,new Map([[TOP,'f1'],['f1','f1a']]),TOP);
document.getElementById('dark').innerHTML = box(N,new Map([[TOP,'f1']]),TOP);
document.getElementById('deep').innerHTML = box(N,new Map([[TOP,'f1'],['f1','f1a']]),TOP);
var many=[]; for(var i=1;i<=12;i++) many.push({id:'m'+i,name:'مجلد طويل الاسم '+i,n:4,kids:[]});
document.getElementById('many').innerHTML = box(many,new Map(),TOP);

var out=[],bad=0;
function L(h){var s=h();out.push('<b class="'+(s[0]?'ok':'no')+'">'+(s[0]?'PASS':'FAIL')+'</b> '+s[1]);if(!s[0])bad++;}
var CS=function(e){return getComputedStyle(e);}, Q=function(s){return document.querySelector(s);};
var R=function(e){return e.getBoundingClientRect();};

L(function(){return [CS(document.getElementById('drawer')).display==='none','صفُّ الدُّرج مخفيّ'];});

/* ح١ · أفقيّ: المتجاوران على خطٍّ واحدٍ وأحدُهما إلى جنب الآخر لا تحته */
L(function(){var b=document.querySelectorAll('#acc > .pg-row > .pg-box');
  if(b.length<2) return [false,'مربّعات: '+b.length];
  var a=R(b[0]), c=R(b[1]);
  return [b.length===4 && Math.abs(a.top-c.top)<2 && Math.abs(a.left-c.left)>20,
   'الطبقةُ الأولى '+b.length+' مربّعاتٍ أفقيّة (فرقُ الأعلى '+Math.round(Math.abs(a.top-c.top))+'px)'];});

/* ح٢ · الجوفُ داخلَ أبيه — بالبنية **وبالإحداثيّات** */
L(function(){var w=Q('#acc > .pg-row > .pg-box.is-wide'), inn=w&&w.querySelector('.pg-in');
  if(!w||!inn) return [false,'لا متوسِّع'];
  var rw=R(w), ri=R(inn);
  return [w.contains(inn) && ri.top>=rw.top-1 && ri.bottom<=rw.bottom+1 && ri.left>=rw.left-1 && ri.right<=rw.right+1,
   'صفُّ الأبناء داخلَ حدود أبيه بالإحداثيّات'];});

L(function(){var k=document.querySelectorAll('#acc > .pg-row > .pg-box.is-wide > .pg-in > .pg-row > .pg-box');
  if(k.length<2) return [false,'بنو المتوسِّع '+k.length];
  var a=R(k[0]), c=R(k[1]);
  return [k.length===3 && Math.abs(a.top-c.top)<2,'بنوه '+k.length+' أفقيّون في جوفه'];});

/* ح٣ · واحدٌ متوسِّعٌ في الصفّ الواحد */
L(function(){var rows=document.querySelectorAll('#acc .pg-row'), worst=0;
  rows.forEach(function(r){var c=r.querySelectorAll(':scope > .pg-box.is-wide').length; if(c>worst)worst=c;});
  return [worst<=1,'أكثرُ متوسِّعٍ في صفٍّ واحد: '+worst];});

/* ح٤ · المتوسِّعُ يأخذ ما بقي */
L(function(){var w=R(Q('#acc > .pg-row > .pg-box.is-wide')).width, sib=[];
  document.querySelectorAll('#acc > .pg-row > .pg-box:not(.is-wide)').forEach(function(e){sib.push(R(e).width);});
  var avg=sib.reduce(function(a,b){return a+b;},0)/sib.length;
  return [w>avg*2,'المتوسِّع '+Math.round(w)+'px ومتوسّطُ إخوته '+Math.round(avg)+'px'];});

/* ولا حُبيبةَ عددٍ في وجهٍ: رُفعت بطلبه، فيُحرَس غيابُها كيلا تعود سهوًا */
L(function(){var c=document.querySelectorAll('.pg-ct').length;
  return [c===0,'لا حُبيبةَ عددٍ في المربّعات ('+c+')'];});
/* ===== والمربّعُ الضيّقُ مَضغَطٌ واحد =====
   إخوةُ المتوسِّعِ يطولون بطوله؛ فإن لم يملأ الوجهُ المربّعَ صار نصفُه ميّتًا تحت
   الإصبع. ويُقاس بنسبة ارتفاع الوجه إلى ارتفاع المربّع، لا بوجود صنف */
L(function(){var b=Q('#acc > .pg-row > .pg-box:not(.is-wide):not(.pg-box--leaf)');
  var fa=b.querySelector('.pg-face'); var rb=R(b), rf=R(fa);
  return [rf.height>=rb.height-2 && rb.height>40,
   'وجهُ الضيّقِ يملأ مربّعَه ('+Math.round(rf.height)+'px من '+Math.round(rb.height)+'px)'];});
/* ===== وألواحُ الجوف أخفتُ وأغمقُ وأنحفُ — ثلاثتُها تُقاس لا تُوصَف =====
   الطبقةُ تُعرف بثِقَلها: لو ساوت أباها لَقُرئت أربعةُ مستوياتٍ في مستوًى واحد */
/* ===== ولا يُقارَن سُلَّمٌ بسُلَّم =====
   النمطُ المحسوبُ يردُّ ‎rgb(223,234,236)‎ مرّةً و‎color(srgb .61 .70 .72 / .82)‎ مرّةً —
   سُلَّمٌ من ٢٥٥ وسُلَّمٌ من واحد، ومقارنتُهما تُمرِّر الفحصَ بالمصادفة (وقع ذلك).
   وألوانُ ‎color-mix‎ شفّافةٌ أيضًا، فالشفافيّةُ جزءٌ ممّا تَراه العين.
   فتُطلى على لوحٍ فوق أرضيّةٍ سوداءَ معلومةٍ وتُقرأ بكسلًا: مقياسٌ واحدٌ للجميع،
   وفيه أثرُ الشفافيّة كما يقع على الشاشة */
function LUM(c){
  var cv=document.createElement('canvas'); cv.width=cv.height=1;
  var g=cv.getContext('d2'.split('').reverse().join(''));
  g.fillStyle='#000'; g.fillRect(0,0,1,1);
  g.fillStyle=c; g.fillRect(0,0,1,1);
  var d=g.getImageData(0,0,1,1).data;
  return (0.2126*d[0]+0.7152*d[1]+0.0722*d[2])/255;
}
L(function(){
  var top=Q('#acc > .pg-row > .pg-box.is-wide > .pg-face');
  var inn=Q('#acc .pg-in .pg-box:not(.is-wide) .pg-face');
  var ht=R(top).height, hi=R(inn).height;
  return [hi < ht*0.75, 'الجوفُ أنحف: قامةُ وجهه '+Math.round(hi)+'px من '+Math.round(ht)+'px'];});
L(function(){
  var top=Q('#acc > .pg-row > .pg-box:not(.is-wide):not(.pg-box--leaf)');
  var inn=Q('#acc .pg-in .pg-box:not(.is-wide)');
  var lt=LUM(CS(top).backgroundColor), li=LUM(CS(inn).backgroundColor);
  return [li < lt, 'الجوفُ أغمق (إضاءة '+li.toFixed(3)+' دون '+lt.toFixed(3)+')'];});
L(function(){
  var top=Q('#acc > .pg-row > .pg-box.is-wide > .pg-face');
  var inn=Q('#acc .pg-in .pg-box:not(.is-wide) .pg-face');
  var lt=LUM(CS(top).color), li=LUM(CS(inn).color);
  return [li < lt, 'الجوفُ أخفتُ حرفًا (إضاءة '+li.toFixed(3)+' دون '+lt.toFixed(3)+')'];});
/* ح٥ · اثنا عشرَ مربّعًا: لا يُسحق أصغرُها، ويُمرَّر الصفّ */
L(function(){var r=Q('#many > .pg-row'), min=1e9;
  r.querySelectorAll(':scope > .pg-box').forEach(function(e){var w=R(e).width; if(w<min)min=w;});
  var sc=r.scrollWidth>r.clientWidth+1;
  return [min>=95 && sc,'أصغرُ مربّعٍ من اثني عشرَ: '+Math.round(min)+'px، والصفُّ يُمرَّر ('+sc+')'];});

/* ===== وشريطُ التمرير أنحفُ من الافتراضيّ =====
   يُقاس بالفرق بين ارتفاع العنصر وجوفه — وهو قامةُ الشريط بعينها. ويُقارَن
   بشاهدٍ بلا أنماطنا، فيُقال «أنحفُ من» لا «أنحفُ» مجرّدةً */
L(function(){
  var r=Q('#many > .pg-row');
  var mine=r.offsetHeight-r.clientHeight;
  var c=document.getElementById('ctl');
  var deflt=c.offsetHeight-c.clientHeight;
  return [mine>0 && mine<=6 && mine<deflt,
   'قامةُ شريط التمرير '+mine+'px، والافتراضيُّ '+deflt+'px'];});
/* ح٦ · ثلاثُ طبقاتٍ مفتوحة: يبقى للورقة نصيبُها */
L(function(){var c=R(document.getElementById('sCard')).height, t=R(document.getElementById('deep')).height,
      b=R(document.getElementById('sBody')).height;
  return [t<c*0.45 && b>c*0.4,'بثلاث طبقاتٍ مفتوحة: الشريط '+Math.round(t)+'px من '+Math.round(c)+'px، وللورق '+Math.round(b)+'px'];});

L(function(){var s=Q('#acc .pg-box:not(.is-wide) > .pg-in');
  return [!!s && CS(s).display==='none','جَوفُ المطويِّ مُغلَق'];});
L(function(){var leaf=Q('#acc .pg-box--leaf');
  return [!!leaf && !leaf.querySelector('button') && CS(leaf.querySelector('.pg-face')).cursor==='default',
   'الساكنُ بلا زرٍّ وبمؤشّرٍ عاديّ'];});
L(function(){var a=CS(Q('#acc > .pg-row > .pg-box.is-wide')).backgroundColor,
      b=CS(Q('#acc > .pg-row > .pg-box:not(.is-wide):not(.pg-box--leaf)')).backgroundColor;
  return [a!==b,'المتوسِّعُ يفترق بأرضيّته'];});
L(function(){var t=R(document.getElementById('acc')), b=R(document.getElementById('body'));
  return [t.bottom<=b.top+1 && !document.getElementById('body').contains(document.getElementById('acc')),
   'الشريطُ فوق مسرح الورق وخارجَه'];});
L(function(){return [document.getElementById('empty').offsetHeight===0,'الخاوي بارتفاع صفر'];});
L(function(){var lite=CS(Q('#acc > .pg-row > .pg-box.is-wide')).borderTopColor,
      dark=CS(Q('#dark > .pg-row > .pg-box.is-wide')).borderTopColor;
  return [lite!==dark,'المربّعُ يتبع جِلدَ الورقة ('+lite+' ⟵ نهارًا · '+dark+' ⟵ ليلًا)'];});

document.getElementById('rep').innerHTML =
 (bad?'<b class="no">'+bad+' إخفاق</b>':'<b class="ok">ALL PASS</b>')+'\n'+out.join('\n');
</script></body></html>
