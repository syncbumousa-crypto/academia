<!doctype html>
<!-- ‎spellcheck="false"‎ على الجذر: المتصفّح يقرأ ما تكتب فيرسم تحته خطًّا أحمر للإملاء
     وأزرقَ مزدوجًا للنحو، ويُظلّل المنطقةَ بالأزرق عند المرور. وهو في نصٍّ عربيٍّ عِلمِيٍّ
     ضوضاءُ لا فائدةَ فيها. والسِّمةُ تُورَّث، فوضعُها هنا يُطفئه في كل حقلٍ في الموقع —
     القائمِ منها والذي يولد بعدُ -->
<html lang="ar" dir="rtl" data-skin="flat" data-theme="light" spellcheck="false" data-glass="liquid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديميا</title>

  <!-- ===== أيقونةُ اللسان =====
       ثلاثةُ مقاساتٍ مصرَّحة، ولكلٍّ قصُّه: ‎١٦‎ مقصوصةٌ إلى ‎٧٢٪‎ لأنّ هامشَ
       الأيقونة يأكل ثلثَ بكسلاتها في ذلك الحجم فتذوب العلامات، و‎٣٢‎ فما فوق
       كما رُسمت. والمتصفّحُ ينتقي الأقربَ إلى ما يطلب، فيُعطى مضبوطًا لا مُصغَّرًا.
       و‎favicon.ico‎ في الجذر لمن لا يقرأ الوسمَ ويطلبه بالعادة. -->
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">

  <link rel="stylesheet" href="../shared/styles.css?v=1">
  <!-- جلدُ الجذر: رماديٌّ مسطَّح. يُحمَّل بعد الأمّ فيغلب توكناتِها -->
  <link rel="stylesheet" href="../shared/skin-flat.css?v=6">

  <!-- ===== ما يخصّ الجذرَ وحدَه =====
       قُفلُ الشعار، ولوحُ «استكشاف»، ورأسُ المجتمع. وموضعُ هذي القواعد ههنا لا
       في ‎shared/styles.css‎ لأنّ تلك الورقةَ مشتركةٌ مع المسلخ، وهذا بابٌ لا
       يعنيه. وكان فيه مبدِّلُ المجتمع فرُفع: الجذرُ يُبدَّل منه بـ«استكشاف»،
       والمبدّلُ يبقى في المسلخ وحده. -->
  <style>
    .side-head { display: flex; flex-direction: column; gap: 5px; }

    /* الشعارُ والاسمُ قُفلٌ واحد: الرمزُ يتقدّم الاسمَ في القراءتين كلتيهما.
       والشريطُ يبقى في مجرى العربيّة ولو صارت الصفحةُ إنجليزيّة — قِيسَ فلم
       ينقلب الصفُّ من نفسه، فيُقلب صراحةً بقاعدةِ ‎data-lang‎ تحتُ.
       والرمزُ أخٌ لـ‎.side-logo‎ لا ابنٌ لها: المحرّكُ يكتب فيها بـ‎textContent‎
       عند تبديل اللغة، فما بداخلها يُمحى. */
    .side-brand { display: flex; align-items: center; justify-content: center; gap: 5px; }
    /* ولونُها حبرُ اللوح لا بترولُ المسلخ: الجذرُ ليس مجتمعًا من مجتمعاته،
       فلا يلبس لونَ أحدِها. أسودُ على الفاتح وأبيضُ على الداكن. */
    .side-mark  { width: 22px; height: auto; flex: none; display: block;
                  color: var(--glass-ink); }
    html[data-lang="en"]    .side-brand { flex-direction: row-reverse; }
    .side-mark-a { display: flex; flex: none; color: inherit; text-decoration: none;
                   border-radius: 8px; transition: opacity .15s; }
    .side-mark-a:hover { opacity: .7; }
    .side-mark-a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }


    /* ===== الجذرُ بلا مكتبة، وفيه «استكشاف» =====
       تابُ المكتبة يُخفى ولا يُحذف: المحرّكُ مشتركٌ مع المسلخ، وفيه سطرٌ
       يكتب نصَّ هذا التاب عند تبديل اللغة بلا حارس — فحذفُ الزرّ يُسقط
       الترجمةَ كلَّها على الموقعين. فالإخفاءُ ههنا، والمحرّكُ لا يُمَسّ. */
    .sidebar .tabs button[data-tab="market"] { display: none; }

    /* رأسُ المجتمع: غلافٌ عريضٌ عليه اسمُه وزرُّ رجوع، يعلو مكتبتَه.
       والمكتبةُ تحته هي هي: بحثُها وتصنيفاتُها وتاباتُ المادّة لم تُمَسّ. */
    .com-cover { position: relative; display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px;
                 min-height: clamp(112px, 16vw, 172px); padding: 16px 20px;
                 border-radius: 16px; overflow: hidden; color: #fff; }
    .com-cover h2 { margin: 0; font-size: clamp(21px, 3.1vw, 33px); font-weight: 700;
                    text-shadow: 0 1px 12px rgba(0,0,0,.32); }
    .com-cover .ex-cover-m { width: 29px; opacity: .45; inset-inline-end: 17px; bottom: 15px; }
    .com-back  { position: absolute; inset-inline-start: 13px; top: 13px; z-index: 2;
                 width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 0;
                 background: rgba(0,0,0,.34); color: #fff; display: grid; place-items: center;
                 transition: background .15s; }
    .com-back:hover { background: rgba(0,0,0,.54); }

    /* زرّا الغلاف: في طرف سطر الاسم، فيتوازن الرأسُ — الاسمُ في مبدأ
       القراءة وفعلاهُ في منتهاها. ويلتفّان تحته في الشاشة الضيّقة. */
    .com-acts { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
    .com-btn  { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
                border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.24);
                color: #fff; border-radius: 99px; padding: 7px 15px; text-decoration: none;
                font: inherit; font-size: 12.5px; font-weight: 700; white-space: nowrap;
                transition: background .15s, border-color .15s; }
    .com-btn:hover { background: rgba(0,0,0,.42); border-color: #fff; color: #fff; }
    .com-btn--go { background: rgba(255,255,255,.93); border-color: transparent; color: #1b1a18; }
    .com-btn--go:hover { background: #fff; color: #1b1a18; }
    .com-plus { font-size: 15px; line-height: 1; }
    .com-back svg { width: 17px; height: 17px; }
    /* سهمُ الرجوع يشير إلى حيث جئت: يمينًا في العربيّة ويسارًا في الإنجليزيّة */
    html[dir="ltr"] .com-back svg { transform: scaleX(-1); }

    /* صفوفٌ تُمرَّر أفقيًّا على طريقة نتفلكس وثمانية: عنوانٌ في مبدأ القراءة
       (يمينُ الصفحة في العربيّة) وتحته شريطُ أغلفةٍ ينزلق. ولا شيءَ ههنا
       مثبَّتٌ بالفيزياء: الاتّجاهُ منطقيّ، فينقلب الصفُّ كلُّه مع اللغة. */
    .ex-row   { position: relative; margin: 0 0 32px; }
    .ex-head  { display: flex; align-items: baseline; gap: 10px; margin: 0 0 11px; }
    .ex-h     { margin: 0; font-size: 19px; font-weight: 700; }
    .ex-sub   { margin: 0; color: var(--c-ink-soft); font-size: 12.5px; }

    .ex-wrap  { position: relative; }
    .ex-strip { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth;
                scroll-snap-type: x proximity; padding: 4px 2px 8px;
                scrollbar-width: none; }
    .ex-strip::-webkit-scrollbar { display: none; }

    .ex-card  { flex: 0 0 auto; scroll-snap-align: start; text-decoration: none; color: inherit; }
    .ex-cover { position: relative; display: grid; place-items: center; overflow: hidden;
                border: 1px solid var(--border); border-radius: 12px;
                transition: transform .18s ease, box-shadow .18s ease; }
    .ex-face  { display: block; text-decoration: none; color: inherit; }
    a.ex-face:hover .ex-cover, a.ex-face:focus-visible .ex-cover {
                transform: scale(1.035); box-shadow: 0 10px 26px rgba(0,0,0,.2); }
    .ex-cap   { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; }
    .ex-cap b { font-weight: 700; }
    .ex-cap s { text-decoration: none; color: var(--c-ink-soft); font-size: 11.5px; }

    /* المجتمعات: ‎١٦:٩‎ — مقاسُ مصغَّرة يوتيوب، وهو مقاسُ صفّ نتفلكس كذلك */
    .ex-strip--com .ex-card  { width: clamp(196px, 25vw, 300px); }
    .ex-strip--com .ex-cover { aspect-ratio: 16 / 9; border: 0; }
    /* ===== الغلافُ صورةٌ وحجاب =====
       الحجابُ الأسودُ ليس زينةً وحده: إضاءةُ الصورة تختلف من ركنٍ إلى ركن،
       والاسمُ الأبيضُ يضيع على فاتحها. فهو يُثبّت الأرضيّةَ تحت الاسم
       ويُعمّق الحافّتين — وذلك ما يصنع الفخامة. وأثقلُ طرفيه أسفلُ لأنّ
       الاسمَ يقف في الوسط والعينَ تنزل إليه. */
    .ex-shot  { position: absolute; inset: 0; width: 100%; height: 100%;
                object-fit: cover; display: block; transition: transform .45s ease; }
    a.ex-face:hover .ex-shot, a.ex-face:focus-visible .ex-shot { transform: scale(1.05); }
    /* والحجابُ طبقتان لا واحدة:
       ١· بِركةٌ بيضاويّةٌ وسط الغلاف تحت الاسم، لها هضبةٌ ثابتةٌ إلى ٣٦٪
          ثمّ تنحدر. ولولا الهضبةُ لانحسر السوادُ عن طرفَي الكلمة فسقط
          تباينُها على صورةٍ فاتحةٍ (ثوبٌ أبيضُ في قاعة).
       ٢· وعمودٌ يُغرق الأعلى قليلًا والأسفلَ كثيرًا، ويترك الوسطَ‑الأعلى
          صافيًا. فالصورةُ تبقى حيّةً ولا تُطمس تحت ستارٍ مستوٍ.
       وفي مركز البِركة ‎.60‎: أشدُّ ما يمكن أن يقع تحتها بياضٌ خالصٌ،
       فيصير ‎102‎ ونسبةُ الأبيض فوقه ‎5.7:1‎ — فوق البوّابة بلا صورةٍ بعينها. */
    .ex-veil  { position: absolute; inset: 0; pointer-events: none;
                background:
                  radial-gradient(60% 70% at 50% 50%, rgba(0,0,0,.60) 0%, rgba(0,0,0,.55) 36%,
                                                     rgba(0,0,0,0) 76%),
                  linear-gradient(180deg, rgba(0,0,0,.48) 0%, rgba(0,0,0,.04) 30%,
                                          rgba(0,0,0,.06) 50%, rgba(0,0,0,.88) 100%); }
    .ex-cover-t { position: relative; color: #fff; font-size: clamp(18px, 2.4vw, 26px);
                  font-weight: 700; letter-spacing: .005em;
                  text-shadow: 0 2px 16px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.45); }
    .ex-cover-m { position: absolute; inset-inline-end: 11px; bottom: 10px;
                  width: 21px; color: #fff; opacity: .45; }
    /* و«قريبًا» تُخفَت ولا تُقتَل: مع التدرّجات كان نزعُ اللون يكفي، ومع
       الصور يُفسدها. والكلمةُ تحتها كافيةٌ بيانًا، فيُكتفى بخفضٍ يسير. */
    .ex-card.is-soon .ex-cover { filter: saturate(.74) brightness(.82); }
    .ex-card.is-soon { cursor: default; }

    /* الكتب: غلافُ الكتاب قائمٌ لا مضطجع، فيُترك على نسبته */
    /* شارةُ المجتمع تحت الكتاب: دائرةٌ بلون غلافه واسمُه — فيُرى الارتباطُ
       من غير قراءة. وهي وصلةٌ تفتح المجتمعَ كبطاقته في الصفّ الأوّل. */
    .ex-own   { display: flex; align-items: center; gap: 6px; margin-top: 5px;
                font-size: 11.5px; color: var(--c-ink-soft); text-decoration: none; }
    a.ex-own:hover { color: var(--c-kfupm); }
    .ex-dot   { width: 15px; height: 15px; border-radius: 50%; flex: none; }

    /* رفٌّ موعودٌ لم يُملأ بعد: أغلفةٌ مرسومةٌ بالخطّ المتقطّع لا كتبٌ مخترَعة */
    .ex-chip  { font-size: 11px; font-weight: 700; color: var(--c-ink-soft);
                border: 1px solid var(--border); border-radius: 99px; padding: 1px 9px; }
    .ex-card.is-ph .ex-cover { border-style: dashed; background: transparent;
                               display: grid; place-items: center; }
    .ex-card.is-ph svg { width: 26px; opacity: .17; color: var(--c-ink-soft); }

    /* زرُّ الإضافة: في طرف السطر — يسارَه في العربيّة ويمينَه في الإنجليزيّة.
       ولا يفعل شيئًا بعدُ: وُضع ليُرى موضعُه، ويُوصَل يومَ يُقرَّر كيف تُضاف
       المادّةُ أو المجتمعُ إلى الحساب. */
    .ex-add   { margin-inline-start: auto; flex: none; width: 22px; height: 22px; padding: 0;
                border: 1px solid var(--border); border-radius: 50%; background: transparent;
                color: var(--c-ink-soft); font: inherit; font-size: 15px; line-height: 1;
                cursor: pointer; display: grid; place-items: center;
                transition: color .15s, border-color .15s; }
    .ex-add:hover { color: var(--c-kfupm); border-color: var(--c-kfupm); }
    .ex-add.is-in { color: var(--c-kfupm); border-color: var(--c-kfupm); font-size: 12px; }

    /* ===== مجتمعاتي: كتلةٌ تحت «الركن» =====
       الترويسةُ صفٌّ كامل كإخوته، والسهمُ علامةٌ في طرفه لا زرٌّ يجاوره:
       زرٌّ داخل زرٍّ ترميزٌ باطل، وزرٌّ يجاوره يَقضم نصفَ الصفّ فلا يُضغط
       إلّا نصفُه. ولا يَظهر السهمُ إلّا إذا كان تحته ما يُفتح. */
    .nook-block { display: flex; flex-direction: column; border-radius: var(--row-r, 14px);
                  transition: background .2s ease, box-shadow .2s ease; }
    .nook-caret { margin-inline-start: auto; flex: none; display: grid; place-items: center;
                  width: 18px; height: 18px; opacity: .55; }
    .nook-caret[hidden] { display: none !important; }
    .nook-caret svg { width: 13px; height: 13px; transition: transform .2s ease; }
    .nook-block.is-open .nook-caret svg { transform: rotate(180deg); }

    .nook-coms { display: flex; flex-direction: column; }
    .nook-coms[hidden] { display: none; }
    .nook-com  { display: flex; align-items: center; gap: 8px; width: 100%;
                 border: 0; background: transparent; cursor: pointer; text-align: start;
                 font: inherit; font-size: 13px; color: var(--c-ink-soft);
                 padding-block: 9px; padding-inline-start: 36px; padding-inline-end: 14px; }
    .nook-com:hover { color: var(--c-kfupm); background: var(--surface); }
    .nook-com i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
    .nook-com.is-on { color: var(--c-kfupm); background: var(--surface); font-weight: 700; }

    /* ============================================================
       الزجاج — م١ وم٢ من «خارطة الشريط الجانبيّ»
       ============================================================
       م١ · ليكن تحت الزجاج ما يُرى: صفوفُ الأغلفة تمتدّ تحت الشريط بدل
            أن تقف عنده. فأوّلُ بطاقةٍ تبقى بارزةً (الحَشْوُ يردّها)، وما
            بعدها ينزلق تحت الزجاج عند التمرير. وبلا هذا فالزجاجُ فوق
            لونٍ واحدٍ = لونٌ واحد.
       م٢ · السطح: ثلاثُ درجاتٍ لا قفزة —
              لا دعمَ        ⟵ مصمتٌ كما كان
              blur           ⟵ زجاجٌ مثلَّج (هذي المرحلة)
              blur + url()   ⟵ انكسارُ الحافّة (م٣، لم تأتِ بعد)
            ومن طلب تقليلَ الشفافيّة رجع إلى المصمت: قراءةُ الواجهة
            حقٌّ لا زينة. */

    :root {
      --pnl-pad: clamp(16px, 3vw, 32px);
      --glass:      #f1f0ee;
      --glass-mix:  54%;   /* أصفى، لأنّ الحبرَ اشتدّ — والبوّابةُ ما زالت 4.5 */
      --glass-ink:  #1b1a18;
      --glass-edge: rgba(255,255,255,.85);
      --glass-cast: rgba(0,0,0,.10);
    }
    html[data-theme="dark"] {
      --glass:      #252525;
      --glass-mix:  63%;
      --glass-ink:  #ffffff;
      --glass-edge: rgba(255,255,255,.09);
      --glass-cast: rgba(0,0,0,.30);
    }

    /* م١ · الصفوفُ تمرّ تحت الشريط */
    #panel-explore .ex-strip {
      margin-inline-start:  calc((var(--side-w) + var(--pnl-pad)) * -1);
      padding-inline-start: calc(var(--side-w) + var(--pnl-pad));
      /* والالتقاطُ يحترم الحَشْو: بدونه يَجذب البطاقةَ الأولى إلى حافّة
         الصندوق فتسكن تحت الزجاج — قِيس: ‎scrollLeft‎ ‎-147‎ عند الإقلاع. */
      scroll-padding-inline-start: calc(var(--side-w) + var(--pnl-pad));
    }






    /* ============================================================
       الزجاجُ يخرج من اللوح — بالنظام نفسِه لا بنسخةٍ ثانية
       ============================================================
       أوّلُ ما بعد الخارطة: أن يَعُمّ الزجاجُ ما يطفو فوق المحتوى. وشرطُه
       ألّا يُعاد اختراعُه: الصبغةُ والتعتيمُ والحرفُ هي هي، تُستدعى بصنفٍ
       واحدٍ ‎.ac-glass‎ فيَرِث كلَّ شيءٍ ويَرِث معه البديلَ والبوّابة.

       والمُرشَّحُ للزجاج ما **يطفو فوق محتوًى يتحرّك** — شريطُ الأدوات
       وأسهمُ الصفوف. أمّا ما هو سطحُ قراءةٍ ثابتٌ (بطاقةُ مادّة، نافذةُ
       حوار) فيبقى مصمتًا: الزجاجُ تحت نصٍّ طويلٍ إتعابٌ لا جمال. */
    .ac-glass {
      background: color-mix(in srgb, var(--glass) var(--glass-mix), transparent) !important;
      border-color: transparent !important;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--glass-ink) 11%, transparent);
    }
    @supports ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      .ac-glass { -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .ac-glass { background: var(--glass) !important;
                  -webkit-backdrop-filter: none; backdrop-filter: none; }
    }

    /* شريطُ أدوات المكتبة: بحثٌ وتصنيفاتٌ يطفوان فوق رفّ الكتب */
    #panel-market #m-search,
    #panel-market .btn-filter { background: color-mix(in srgb, var(--glass) var(--glass-mix), transparent);
      border-color: transparent;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--glass-ink) 11%, transparent); }
    @supports ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      #panel-market #m-search, #panel-market .btn-filter {
        -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
    }

    /* وأسهمُ الصفوف: أقراصٌ زجاجيّةٌ كقرص الطيّ، لا دوائرُ مصمتة */
    #panel-explore .ex-nav {
      background: color-mix(in srgb, var(--glass) var(--glass-mix), transparent);
      border-color: transparent;
      box-shadow: inset 0 0 0 1px var(--glass-edge), 0 6px 18px var(--glass-cast);
      color: var(--glass-ink);
    }
    @supports ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      #panel-explore .ex-nav { -webkit-backdrop-filter: blur(14px) saturate(160%);
                               backdrop-filter: blur(14px) saturate(160%); }
    }
    @media (prefers-reduced-transparency: reduce) {
      #panel-market #m-search, #panel-market .btn-filter, #panel-explore .ex-nav {
        background: var(--glass); -webkit-backdrop-filter: none; backdrop-filter: none; }
    }

    /* ============================================================
       م٦ · الحياة — الزجاجُ يتبدّل بما يمرّ تحته
       ============================================================
       ١· الكثافةُ تتبع التمرير: في رأس الصفحة لا شيءَ تحت اللوح فيكون
          أصفى ما يكون، وكلّما مرّت الأغلفةُ تحته ثَقُل ليبقى النصُّ مقروءًا.
          والحركةُ **صعودًا فقط** من قيمة الجلد المقيسة — فالبوّابةُ (4.5:1)
          محفوظةٌ في أدنى الحالتين، وما فوقها أأمن.
       ٢· ولمعةٌ تتبع المؤشّر على الصفّ المُحوَّم عليه، كانعكاسٍ على زجاج.
       وكلتاهما تُطفأ لمن طلب تقليلَ الحركة. */
    @property --glass-mix { syntax: '<percentage>'; inherits: true; initial-value: 54%; }

    @media (prefers-reduced-motion: no-preference) {
      @supports (animation-timeline: scroll()) {
        @keyframes ac-glass-dense { to { --glass-mix: 76%; } }
        /* المُمرِّرُ ههنا ‎body‎ لا الجذر — قِيس: ‎scroll(root)‎ لم يرتبط
           و‎scrollTop‎ يقع على الجسد. فيُسمَّى الجدولُ على المُمرِّر نفسِه،
           ويُطلب بالاسم من اللوح وهو ابنُه. */
        body { scroll-timeline-name: --ac-page; scroll-timeline-axis: block; }
        .sidebar {
          animation: ac-glass-dense linear both;
          animation-timeline: --ac-page;
          animation-range: 0 340px;
        }
      }
    }

    /* اللمعة: طبقةٌ لا تُمسك الضغط، وتتبع ‎--mx/--my‎ من حركة المؤشّر */
    .sidebar .tabs button, .nook-com { position: relative; overflow: hidden; }
    .sidebar .tabs button::after, .nook-com::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      transition: opacity .18s;
      background: radial-gradient(90px circle at var(--mx, 50%) var(--my, 50%),
                  color-mix(in srgb, var(--glass-ink) 13%, transparent), transparent 68%);
    }
    @media (prefers-reduced-motion: no-preference) {
      .sidebar .tabs button:hover::after, .nook-com:hover::after { opacity: 1; }
    }

    /* ============================================================
       م٥ · ثلاثُ حالاتٍ للوح: واسعٌ · سكّةٌ · مطويّ
       ============================================================
       مبدأُ أبل: «دع الناسَ يُخفونه» — ومعه درجةٌ وسطى تُبقي التنقّلَ قائمًا
       وتردّ المساحةَ للمحتوى. والحيلةُ أنّ كلّ شيءٍ ههنا محسوبٌ من ‎--side-w‎:
       حَشْوُ الجسد، وموضعُ الدائرة، وامتدادُ الصفوف تحت اللوح. فتبديلُ
       **متغيّرٍ واحد** يُزيح المنظومة كلَّها، ولا يُطارَد رقمٌ في عشرة مواضع. */
    :root { --side-w: 200px; }
    body.side-rail { --side-w: 64px; }

    body.side-rail .side-logo,
    body.side-rail .sidebar .tab-tx,
    body.side-rail .nook-com span,
    body.side-rail .side-logout .side-logout-tx,
    body.side-rail .side-auth-tx,
    body.side-rail .side-profile .sp-name { display: none; }

    body.side-rail .sidebar { padding: 14px 8px; }
    body.side-rail .sidebar .tabs button,
    body.side-rail .nook-com,
    body.side-rail .side-logout,
    body.side-rail .side-join,
    body.side-rail .side-login,
    body.side-rail .side-profile { justify-content: center; padding-inline: 0; }
    body.side-rail .nook-com { padding-inline-start: 0; }
    body.side-rail .side-ctl { align-items: center; }
    body.side-rail .sidebar .themebar, body.side-rail .sidebar .langbar { justify-content: center; }
    /* والسهمُ لا موضعَ له في سكّةٍ بلا أسماء، ولا الكتلةُ: الجوفُ صفٌّ
       من نقاطٍ تحت أيقونةٍ، ولوحةٌ حولَه تُضيّق السكّةَ بلا فائدة. */
    body.side-rail .nook-caret { display: none !important; }
    body.side-rail .nook-block.is-open { background: transparent; box-shadow: none; padding-bottom: 0; }
    body.side-rail .nook-block.is-open > #nook-head { box-shadow: none; }
    body.side-rail .nook-block.is-open > #nook-head.is-active {
      box-shadow: inset 0 0 0 1px var(--plate-edge); }
    body.side-rail .nook-block.is-open .nook-coms { padding-inline: 0; }

    /* ===== الحسابُ في السكّة: دائرةُ صورةٍ لا صندوق =====
       كان الاسمُ يُخفى بصنفٍ لا وجودَ له (‎.side-pname‎ والصحيح ‎.sp-name‎)،
       فيبقى شاغلًا سطرَه ويدفع الصورةَ إلى الحافّة. فصُحِّح الاسمُ، وصار
       الزرُّ نفسُه دائرةً بقدر الصورة: لا لوحةَ تحتها ولا حشوَ حولها. */
    body.side-rail .side-acct .side-profile {
      width: 38px; height: 38px; min-height: 0; padding: 0; margin-inline: auto;
      border-radius: 50%; overflow: hidden; background: transparent;
      box-shadow: inset 0 0 0 1px var(--plate-edge); }
    body.side-rail .side-acct .side-profile:hover { background: transparent; opacity: .85; }
    body.side-rail .side-profile .sp-av { width: 100%; height: 100%; border-radius: 50%; }
    body.side-rail .side-brand { gap: 0; }

    /* ============================================================
       داخلُ اللوح — نظامٌ واحدٌ لكلّ ما يُضغط
       ============================================================
       قِيس قبل أن يُعدَّل، فإذا في اللوح ثلاثةُ أنصافِ أقطار (١٢ و١٠ و٩)،
       وخمسةُ ارتفاعات (٥١ و٥٠ و٣٨ و٣٤ و٣٠)، وثلاثةُ مقاسات خطّ — **وسطحان
       مصمتان** (‎#252525‎ و‎#202020‎) داخل زجاج. والمصمتُ داخل الزجاج يَكسره:
       يقول للعين «هذا ليس شفّافًا» فيبطل ما تحته.

       فالنظام:
         · الصفُّ الكبير (تاب) ‎44px‎ · والصغير (مجتمع) ‎34px‎ · والقرص ‎32px‎.
         · لا لونَ مصمتًا البتّة: كلُّ سطحٍ **لوحةٌ** من حبر اللوح نفسِه
           بنسبةٍ قليلة، فتُظلم في الفاتح وتُضيء في الداكن من غير قاعدتين.
         · والحالةُ النشطةُ لوحةٌ أثقلُ وحدٌّ داخليٌّ لامع، لا مستطيلٌ مصمت. */
    .sidebar {
      --row-h: 44px;  --row-r: 14px;  --chip: 32px;
      --plate:      color-mix(in srgb, var(--glass-ink) 8%,  transparent);
      --plate-hi:   color-mix(in srgb, var(--glass-ink) 14%, transparent);
      --plate-edge: color-mix(in srgb, var(--glass-ink) 12%, transparent);
      gap: 10px;
    }

    /* الصفوفُ الكبرى: استكشاف · الركن · الاختبارات · إحصائياتي */
    .sidebar .tabs { margin-inline: 0; gap: 2px; }
    .sidebar .tabs button {
      min-height: var(--row-h); padding: 0 11px; gap: 10px;
      border-radius: var(--row-r); font-size: 14px; font-weight: 600;
      transition: background .15s, box-shadow .15s;
    }
    .sidebar .tabs button:hover { background: var(--plate); }
    .sidebar .tabs button.is-active {
      background: var(--plate-hi); color: var(--glass-ink);
      box-shadow: inset 0 0 0 1px var(--plate-edge);
    }
    .sidebar .tabs .tab-ic { width: 17px; height: 17px; }

    /* درجُ المجتمعات: صفٌّ أصغرُ وبنفس اللغة */
    /* وتخصيصُها بقدر ما يغلب ‎.sidebar .tabs button‎: الجوفُ ساكنُ ‎nav.tabs‎
       فكان يرث ارتفاعَ الصفّ الكبير ويقف ٤٤ في موضع ٣٤، فتستوي الترويسةُ
       وما تحتها ولا يُقرأ أيُّهما ابنُ الآخر. */
    .sidebar .tabs .nook-com { min-height: 34px; border-radius: 12px;
                               padding-inline-start: 26px; font-size: 12.5px; }
    .nook-com:hover { background: var(--plate); color: var(--glass-ink); }
    .nook-com.is-on { background: var(--plate-hi); color: var(--glass-ink);
                      box-shadow: inset 0 0 0 1px var(--plate-edge); }

    /* ===== الكتلةُ مفتوحة =====
       لوحةٌ واحدةٌ تضمّ الترويسةَ وجوفَها، وخطٌّ شعريٌّ تحت الترويسة يقول
       «هذا رأسُ الكتلة وهذا جوفُها». ولم أُثقّل الترويسةَ بلوحةٍ ثانية:
       كانت ستُقرأ «نشِطة» وهي ليست كذلك متى تُرك الركنُ إلى تابٍ آخر. */
    .nook-block.is-open { background: var(--plate);
                          box-shadow: inset 0 0 0 1px var(--plate-edge);
                          padding-bottom: 4px; }
    .nook-block.is-open > #nook-head { box-shadow: inset 0 -1px 0 var(--plate-edge); }
    .nook-block.is-open > #nook-head.is-active {
      box-shadow: inset 0 0 0 1px var(--plate-edge), inset 0 -1px 0 var(--plate-edge); }
    .nook-block.is-open .nook-coms { padding-inline: 4px; padding-top: 3px; }

    /* الأقراص: الجلد واللغة — دائرتان كدائرة المقبض */
    .sidebar .themebar button, .sidebar .langbar button {
      width: var(--chip); height: var(--chip); border-radius: 50%; padding: 0;
      background: var(--plate); border: 0;
      box-shadow: inset 0 0 0 1px var(--plate-edge);
      color: var(--glass-ink); transition: background .15s;
    }
    .sidebar .themebar button:hover, .sidebar .langbar button:hover { background: var(--plate-hi); }
    .side-ctl { gap: 10px; margin-top: auto; }
    /* المجموعتان صفٌّ واحدٌ متّصل: كانت الثانيةُ تُدفع إلى القاع
       بـ‎margin-top:auto‎، فصار بينهما فراغٌ لا معنى له. */
    .sidebar .tabs--me { margin-top: 0; }
    .sidebar .tabs--me + .side-ctl { margin-top: auto; }

    /* الحساب والخروج والدخول: لوحاتٌ لا صناديقُ مصمتة */
    .side-acct .side-profile, .side-logout, .side-join, .side-login {
      background: var(--plate); border: 0;
      box-shadow: inset 0 0 0 1px var(--plate-edge);
      border-radius: var(--row-r); color: var(--glass-ink);
      transition: background .15s;
    }
    .side-acct .side-profile { min-height: var(--row-h); }
    /* وكِسوةُ الصورة حين لا صورة: لوحةُ اللوح لا بترولٌ فاتح */
    .sidebar .sp-av { background: var(--plate-hi); color: var(--glass-ink); }
    .side-logout, .side-join, .side-login { min-height: 36px; font-size: 12.5px; }
    .side-acct .side-profile:hover, .side-logout:hover, .side-join:hover, .side-login:hover {
      background: var(--plate-hi); color: var(--glass-ink);
    }
    /* و«إنشاء حساب» وحدَه مصمتٌ عمدًا: هو الفعلُ المقصود في اللوح. ومصمتُه
       حبرُ اللوح مقلوبًا — أسودُ على الفاتح وأبيضُ على الداكن — فيبقى
       أعلى الأشياء نبرةً من غير لونٍ مستعار.
       وتخصيصُه بقدر ‎.sidebar .side-ctl button‎ الآتي بعدَه: قِيس فوجِد
       حبرًا على حبر — أسودُ على أسود لا يُرى. */
    .sidebar .side-acct .side-join { background: var(--glass-ink); color: var(--glass); box-shadow: none; }
    .sidebar .side-acct .side-join:hover { background: var(--glass-ink); color: var(--glass); opacity: .86; }

    /* ============================================================
       م٤ · الشريطُ لوحٌ عائمٌ لا جدارٌ ملتصق
       ============================================================
       كان يلصق بالحافّات الثلاث فلا حرفَ له يُرى. وزجاجٌ بلا حرفٍ لا يُرى
       أنّه زجاج. فصار **بطاقةً** تطفو بفجوةٍ من كلّ جانب، بحوافَّ ناعمةٍ
       كأمثلة ‎glassapp‎، فيَظهر سمكُها ولمعةُ حرفها وظلُّها على ما تحتها. */
    :root { --glass-gap: 14px; --glass-r: 26px; }

    .sidebar {
      top: var(--glass-gap); bottom: var(--glass-gap);
      right: var(--glass-gap); height: auto;
      border: 0; border-radius: var(--glass-r);
      overflow-x: hidden;
    }
    html[data-lang="en"] .sidebar { right: auto; left: var(--glass-gap); }
    /* والمحتوى يُفسح للوح وفجوته */
    body { padding-right: calc(var(--side-w) + var(--glass-gap) * 2); }
    html[data-lang="en"] body { padding-right: 0; padding-left: calc(var(--side-w) + var(--glass-gap) * 2); }
    /* والمطويُّ يخرج كلَّه ومعه فجوتُه */
    body.side-closed .sidebar { transform: translateX(calc(100% + var(--glass-gap) * 2)); }
    html[data-lang="en"] body.side-closed .sidebar { transform: translateX(calc(-100% - var(--glass-gap) * 2)); }
    body.side-closed { padding-right: 0; }
    html[data-lang="en"] body.side-closed { padding-left: 0; }

    /* الصفوفُ الداخليّة لا تَبلغ الحرفَ المدوَّر: تُسحب من حافّتَي اللوح */
    .sidebar .tabs { margin-inline: -4px; }
    .sidebar .tabs button { border-radius: var(--row-r); }
    .sidebar .tabs .nook-block > button { border-top: 0; }
    .sidebar .tabs button + button { border-top: 0; }
    .nook-com { border-radius: 10px; }

    /* ============================================================
       المقبض: دائرةٌ فيها أيقونةُ شريط، لا لسانٌ ملتصقٌ بسهم
       ============================================================ */
    .side-handle {
      /* أصغرُ وفي الأعلى: يحاذي رأسَ اللوح لا وسطَه — فالوسطُ موضعُ مرورٍ
         لا موضعُ أمر، والرأسُ حيث تبدأ العينُ في الشريط. */
      width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 0;
      top: calc(var(--glass-gap) + 8px); transform: none;
      /* مفتوحًا: في منتصف الممرّ بين حرف اللوح وأوّل عنوانٍ في المحتوى.
         والممرُّ محسوبٌ لا مقدَّر — حرفُ اللوح عند ‎side-w + gap‎، وطرفُ
         العنوان عند ‎side-w + 2gap + حشو اللوحة‎. فالمركزُ منتصفُهما،
         ناقصًا نصفَ قطر الدائرة. فتتبع أيَّ تغييرٍ في العرض أو الفجوة. */
      right: calc(var(--side-w) + var(--glass-gap) * 1.5 + var(--pnl-pad) / 2 - 15px);
      background: color-mix(in srgb, var(--glass) var(--glass-mix), transparent);
      color: var(--glass-ink);
      box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 22px var(--glass-cast);
      transition: right .25s ease, left .25s ease, color .15s, transform .15s;
    }
    html[data-lang="en"] .side-handle {
      right: auto; left: calc(var(--side-w) + var(--glass-gap) * 1.5 + var(--pnl-pad) / 2 - 15px);
      border: 0; border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 22px var(--glass-cast);
    }
    body.side-closed .side-handle { right: calc(var(--glass-gap) + 4px); }
    html[data-lang="en"] body.side-closed .side-handle { left: calc(var(--glass-gap) + 4px); }
    .side-handle:hover { background: color-mix(in srgb, var(--glass) 92%, transparent); transform: scale(1.09); }
    /* الأيقونةُ ثابتةٌ لا تدور: هي تقول «شريط» لا «اتّجاه» */
    .side-handle svg { width: 15px; height: 15px; transform: none !important; }
    @supports ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      .side-handle { -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%); }
    }

    /* ===== مقايضةٌ مقيسة =====
       الزجاجُ الأصفى يُسقط التباين، والتباينُ شرطٌ لا يُساوَم. فبدل أن
       أُثقّل اللوحَ أشدَدتُ الحبر: في الفاتح ‎#1b1a18‎ بدل ‎#37352f‎، وفي
       الداكن أبيضُ خالص. فنزل أقلُّ تعتيمٍ يَعبُر البوّابة من ٦٦ إلى ٥٤،
       ومن ٧٠ إلى ٦٣ — زجاجٌ أصفى بالقياس لا بالتنازل. */
    .sidebar, .sidebar .side-logo, .sidebar .tabs button,
    .sidebar .nook-com, .sidebar .side-ctl button { color: var(--glass-ink); }
    /* والنشِطُ حبرُ اللوح لا أبيضَ: لوحتُه رماديّةٌ شفّافةٌ لا مستطيلٌ
       بتروليّ، والأبيضُ عليها في الجلد الفاتح يكاد لا يُرى. */
    .sidebar .tabs button.is-active { color: var(--glass-ink); }
    .sidebar .nook-com span { color: inherit; opacity: .82; }

    /* م٢ · السطح الزجاجيّ */
    @supports ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      .sidebar {
        background: color-mix(in srgb, var(--glass) var(--glass-mix), transparent);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
                backdrop-filter: blur(20px) saturate(170%);
      }
      /* والظلُّ بتخصيصٍ أعلى: ‎html[data-skin="flat"] .sidebar‎ في جلد الجذر
         يُصفّر الظلَّ، وقِيس فغلب ‎.sidebar‎ وحدَها. فالحدُّ الفاتحُ على الوجه
         المواجه للمحتوى، وينقلب مع اللغة. */
      html[data-skin] .sidebar {
        box-shadow: inset 1px 0 0 var(--glass-edge), -14px 0 34px var(--glass-cast);
      }
      html[data-skin][data-lang="en"] .sidebar {
        box-shadow: inset -1px 0 0 var(--glass-edge), 14px 0 34px var(--glass-cast);
      }

      /* الدرجةُ الثالثة: الانكسار. تُضاف للسلسلة نفسِها ولا تَستبدلها، فمن
         لا يدعم ‎url()‎ في الخلفيّة (سفاري وفايرفوكس) يبقى على المثلَّج. */
      @supports (backdrop-filter: url(#lg-edge)) {
        html[data-glass="liquid"] .sidebar {
          -webkit-backdrop-filter: blur(16px) saturate(170%) url(#lg-edge);
                  backdrop-filter: blur(16px) saturate(170%) url(#lg-edge);
        }
      }
    }
    /* ولا شفافيّةَ لمن لا يريدها */
    @media (prefers-reduced-transparency: reduce) {
      .sidebar {
        background: var(--glass);
        -webkit-backdrop-filter: none; backdrop-filter: none;
        box-shadow: none;
      }
    }


    /* الرأسُ صار خارجَ الألواح، فيأخذ عرضَها وحشوَها بنفسه */
    .com-head { max-width: 1180px; margin: 0 auto 18px; padding: 23px clamp(16px,3vw,32px) 0; }
    .soon-area { min-height: 62vh; border-radius: 18px; background: var(--surface);
                 display: grid; place-items: center; }
    .soon-area span { color: var(--c-ink-soft); font-size: 14px; opacity: .4; }

    .ex-strip--books .ex-card  { width: clamp(112px, 12.5vw, 152px); }
    .ex-strip--books .ex-cover { aspect-ratio: 2 / 3; background: var(--surface); }
    .ex-strip--books img       { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* سهما التمرير: يظهران عند المرور، ويختفي الواصلُ إلى طرفه */
    .ex-nav   { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
                width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
                border: 1px solid var(--border); background: var(--surface); color: inherit;
                display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
    .ex-wrap:hover .ex-nav, .ex-nav:focus-visible { opacity: .96; }
    .ex-nav[hidden] { display: none; }
    .ex-nav svg { width: 16px; height: 16px; }
    .ex-nav--s { inset-inline-start: -8px; }
    .ex-nav--e { inset-inline-end: -8px; }

  </style>
</head>
<body>

<!-- ===== م٣ · انكسارُ الحافّة =====
     خريطةُ إزاحةٍ تُقرأ قناتاها: الحمراءُ تُزيح أفقيًّا، والخضراءُ رأسيًّا.
     فجعلتُ الخضراءَ ثابتةً (لا إزاحةَ رأسيّة)، والحمراءَ ١٢٨ في الوسط (أي
     صفرًا) وتندفع إلى طرفيها — فينحني ما خلفَ الزجاج عند حافّتيه ويستوي
     في وسطه، كشريحةِ زجاجٍ مشطوفةِ الحرفين. وهي مضمَّنةٌ هنا لا ملفًّا:
     مرشّحٌ ينتظر طلبَ شبكةٍ يُرى بعد أن تُرسم الصفحة. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="lg-edge" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='rgb(255,128,0)'/%3E%3Cstop offset='0.16' stop-color='rgb(128,128,0)'/%3E%3Cstop offset='0.84' stop-color='rgb(128,128,0)'/%3E%3Cstop offset='1' stop-color='rgb(0,128,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='8' fill='url(%23g)'/%3E%3C/svg%3E" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="26"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

  <!-- الشريط الجانبي: التابان (زرّان تحت بعض) فوق، والتحكم بالمظهر واللغة أسفله.
       يمين مع العربية · يسار مع الإنجليزية (عبر html[data-lang]) -->
  <aside class="sidebar" id="sidebar">
    <!-- شعار الموقع: أعلى الشريط الجانبي (يمين) بخط الهوية KFUPM Display -->
    <!-- ===== الشعارُ ومبدِّلُ المجتمع =====
         ‎.side-logo‎ يبقى كما هو ولا يُلَفّ المبدِّلُ داخله: المحرّكُ يكتب فيه
         اسمَ الموقع عند تبديل اللغة (‎lg.textContent = t.siteName‎)، و‎textContent‎
         يمحو ما تحته. فهما أخوان في ‎.side-head‎.
         والخياراتُ معروضةٌ ولا تَفعل شيئًا بعدُ — تُوصَل يومَ تُبنى المجتمعات. -->
    <div class="side-head">
      <div class="side-brand">
        <!-- «لُب» — قلبٌ بثلاثة رؤوس: ثلاثُ دوائرَ متداخلةٍ وإسفينٌ يمسُّها.
             الصندوقُ هو مدى الشكل نفسِه بلا حَشْو، فيُقاس بالاسم لا بالفراغ. -->
        <a class="side-mark-a" href="https://syncbumousa-crypto.github.io/lobe/"
           target="_blank" rel="noopener" title="لُب" aria-label="لُب">
          <svg class="side-mark" viewBox="-155 57.49 310 244.51" fill="currentColor"
               xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z"/>
          </svg>
        </a>
        <div class="side-logo">أكاديميا</div>
      </div>

    </div>

    <nav class="tabs">
      <!-- «استكشاف» هو مُستقَرُّ الجذر بعد رفع المكتبة، فيتصدّر الشريط -->
      <button type="button" data-tab="explore" class="is-active">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg>
        <span class="tab-tx" id="tab-explore-tx">استكشاف</span>
      </button>
      <button type="button" data-tab="market">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="tab-tx">المكتبة</span>
      </button>
      <!-- ===== كتلةُ الركن: ترويسةٌ وجوف =====
           كان السهمُ زرًّا مستقلًّا بجانب الصفّ، فكان صفُّ «الركن» يَنكمش
           إلى عرض كلمته (٨٢ من ١٨٤) — زرٌّ نصفُه لا يُضغط. فصار السهمُ
           **علامةً** داخل الترويسة، والترويسةُ تملأ سطرَها كإخوتها،
           وضغطتُها تفتح الركنَ وتفتح الكتلةَ معًا. -->
      <div class="nook-block" id="nook-block">
        <button type="button" data-tab="library" id="nook-head"
                aria-expanded="false" aria-controls="nook-coms">
          <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="tab-tx">الركن</span>
          <span class="nook-caret" id="nook-twist" hidden aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </button>
        <!-- مجتمعاتُ المستخدم — تُبنى من الجافا، وتسكن جوفَ الكتلة -->
        <div class="nook-coms" id="nook-coms" hidden></div>
      </div>
    </nav>

    <!-- ===== وما يخصُّك أنت: مجموعةٌ ثانيةٌ في قاع الشريط =====
         الأوليان أبوابُ **المحتوى** (مكتبةُ الموقع وركنُك فيه)، وهاتان سجلّاك أنت —
         لا تُتصفَّح بل يُرجع إليهما. فتُفصلان بفراغٍ يدفعهما إلى القاع فوق شريط
         التحكّم، فلا تُقرأ الأربعةُ صفًّا واحدًا وهي جنسان. -->
    <nav class="tabs tabs--me">
      <!-- الاختبارات الماضية: ورقةٌ عليها صحّ — «امتحانٌ فُرغ منه» لا ساعةٌ ولا رسمٌ
           بيانيّ، فالمقصودُ الأوراقُ التي مرّت لا الزمنُ ولا الأرقام -->
      <button type="button" data-tab="past">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14.5l2 2 4-4"/></svg>
        <span class="tab-tx">الاختبارات</span>
      </button>
      <!-- الإحصائيات: أعمدةٌ صاعدة — «ما جمعتَه» لا «ما فعلتَه»، فلا تلتبس بورقة صحّ -->
      <button type="button" data-tab="stats">
        <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span class="tab-tx">إحصائياتي</span>
      </button>
    </nav>

    <div class="side-ctl">
      <!-- تاريخ اليوم (فوق) ثم الوقت (تحته) بتوقيت السعودية — فوق زرّي المظهر -->
      <div class="sb-date"><span id="today-date"></span></div>
      <div class="sb-time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="today-time"></span>
      </div>

      <!-- المظهر: فاتح · داكن -->
      <nav class="themebar" id="themebar">
        <button type="button" data-theme="light" class="is-active" title="فاتح" aria-label="فاتح">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button type="button" data-theme="dark" title="داكن" aria-label="داكن">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>

      <!-- اللغة: عربي · English -->
      <nav class="langbar" id="langbar">
        <button type="button" data-lang="ar" class="is-active">عربي</button>
        <button type="button" data-lang="en">English</button>
      </nav>

      <!-- قاعُ الشريط: وجهان لحالٍ واحدة —
           العضوُ يرى بروفايلَه وبابَ الخروج، والزائرُ يرى بابَي الدخول.
           والاثنان في الوسم معًا ويُبدَّل بينهما بصنفٍ على ‎body‎ (‎is-guest‎)، لا
           بحقنِ وسمٍ: المستمعان معلَّقان على الأزرار نفسِها منذ الإقلاع، ولو أُعيد
           بناءُ الجوف لَذهبا معه -->
      <div class="side-acct">
        <!-- عضو: صورة + اسم · نقره يفتح صفحة الحساب -->
        <button type="button" class="side-profile" id="side-profile"></button>
        <button type="button" class="side-logout" id="side-logout" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg>
          <span class="side-logout-tx">تسجيل الخروج</span>
        </button>

        <!-- زائر: إنشاءُ حسابٍ (مصمَت — الفعلُ المقصود) ثمّ تسجيلُ دخولٍ (خفيفٌ تحته) -->
        <div class="side-auth" id="side-auth">
          <button type="button" class="side-join" id="side-join">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="8.5" cy="7" r="3.5"/><path d="M18 7v6M21 10h-6"/></svg>
            <span class="side-auth-tx">إنشاء حساب</span>
          </button>
          <button type="button" class="side-login" id="side-login">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg>
            <span class="side-auth-tx">تسجيل الدخول</span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- مقبض طيّ/فتح الشريط: تبويب عمودي ملتصق بحافة الشريط في المنتصف -->
  <button type="button" class="side-handle" id="side-handle" title="طيّ/فتح الشريط" aria-label="طيّ/فتح الشريط">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <!-- لوحة سوق المواد -->
  <!-- لوحُ الاستكشاف: المجتمعاتُ، ومنها المسلخ. ما لم يُفتح بعدُ يُعرض
       ساكنًا ومكتوبًا عليه «قريبًا» — فالوعدُ معلومٌ ولا يُضغط ما لا يَفتح -->
  <div class="com-head" id="com-head" hidden>
    <div class="com-cover" id="com-cover">
      <button class="com-back" id="com-back" type="button" aria-label="رجوع" title="رجوع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <h2 id="com-name"></h2>
      <div class="com-acts">
        <!-- الإضافةُ لا تفعل شيئًا بعدُ، كزرّ البطاقة في «استكشاف» سواءً -->
        <button class="com-btn" id="com-add" type="button">
          <span class="com-plus">+</span><span id="com-add-tx">أضِف المجتمع</span></button>
        <!-- وهذي تخرج من الجذر إلى موقع المجتمع نفسِه -->
        <a class="com-btn com-btn--go" id="com-open" href="../Almaslakh/"><span id="com-open-tx">صفحة المجتمع</span></a>
      </div>
    </div>
  </div>

  <section class="panel" id="panel-explore">
    <section class="ex-row">
      <div class="ex-head"><h2 class="ex-h" id="ex-h">مجتمعات</h2>
        <p class="ex-sub" id="ex-sub">لكلِّ مجتمعٍ أهلُه ومكتبتُه.</p></div>
      <div class="ex-wrap">
        <div class="ex-strip ex-strip--com" id="ex-coms"></div>
      </div>
    </section>

    <!-- رفوفُ الكتب: تُولَّد من جدولٍ واحد، فزيادةُ رفٍّ سطرٌ فيه -->
    <div id="ex-shelves"></div>
  </section>

  <section class="panel" id="panel-market" hidden>

    <!-- رأسُ المجتمع — يُكشف متى دخلتَ مجتمعًا من «استكشاف» -->
    <!-- مستطيل السوق: أعلاه البحث والتصنيفات، وتحته سطر كتب واحد يُمرَّر أفقيًا -->
    <div class="market-box">
      <div class="market-tools">
        <input class="search" id="m-search" type="text" placeholder="ابحث عن مادة…">
        <div class="filterwrap">
          <button class="btn-filter" id="m-btn-filter" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 6h16M7 12h10M10 18h4"/>
            </svg>
            <span id="m-f-label">تصنيفات</span>
            <span class="fbadge" id="m-fbadge" hidden></span>
          </button>
          <div class="fpanel" id="m-fpanel" hidden>
            <div class="fgroup">
              <p class="fgroup__t" id="m-fg-hours">عدد الساعات</p>
              <div class="fchips" id="m-f-hours"></div>
            </div>
            <div class="fgroup">
              <p class="fgroup__t" id="m-fg-col">الكلية المقدمة للمادة</p>
              <div class="fchips" id="m-f-col"></div>
            </div>
            <div class="fgroup">
              <p class="fgroup__t" id="m-fg-stat">حالة المادة</p>
              <div class="fchips" id="m-f-stat"></div>
            </div>
            <div class="fgroup">
              <p class="fgroup__t" id="m-fg-act">النشاط</p>
              <div class="fchips" id="m-f-act"></div>
            </div>
          </div>
        </div>
        <!-- الفلاتر المفعّلة: تظهر بعد زر التصنيفات، والنقر على أي منها يحذفه -->
        <div class="factive" id="m-factive"></div>
      </div>

      <!-- بِكرة الكتب (Cover Flow): دائمًا كتاب متمركز، والتمرير يمين/يسار ينقل البؤرة -->
      <div id="m-grid"></div>
    </div>

    <!-- عرض مساهمات المادة المختارة: خط فاصل تحت مستطيل السوق ثم واجهة #cm-ui مدمجة -->
    <div class="market-course" id="market-course" hidden></div>
  </section>

  <!-- لوحة المكتبة: شريط الأترام (يبدأ فاضيًا) + زر إضافة ترم
       (شريط اليوم انتقل إلى الشريط الجانبي فوق زرّي المظهر) -->
  <section class="panel" id="panel-library" hidden>

    <div class="termbar">
      <span class="term-list" id="term-list"></span>
      <input class="term-input" id="term-input" type="text" hidden>
      <button class="btn-addterm" id="btn-addterm" type="button">+ إضافة ترم</button>
      <!-- الصندوق المنسدل تحت مربع الترم المضغوط (داخل الشريط):
           ⚙ إعدادات الترم يمينًا، خط فاصل خفيف، ثم زر + لإضافة المواد -->
      <div class="term-drop" id="term-drop" hidden>
        <button class="drop-gear" id="drop-gear" type="button" title="إعدادات الترم" aria-label="إعدادات الترم">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <span class="drop-sep"></span>
        <button class="drop-add" id="drop-add" type="button" title="إضافة مادة">+</button>
      </div>
    </div>

    <!-- الإطار المرقّط: مواد الترم المحدد -->
    <div class="term-frame" id="term-frame" hidden>
      <!-- ===== وإطارٌ خالٍ يقول ما يُفعل به =====
           كان مستطيلًا مرقّطًا فارغًا لا يقول شيئًا، فمن أنشأ ترمَه وقف أمامه
           لا يدري من أين يبدأ. والدليلُ يشير إلى الزرّ الذي يفتح البابَ نفسَه. -->
      <p class="term-frame__hint" id="term-hint">أضف مواد إلى ترمك من + بالأعلى.</p>
      <!-- بِكرة كتب مواد الترم (مثل المكتبة) — يبنيها makeReel -->
      <div id="lib-grid" hidden></div>
    </div>

    <!-- عرض المادة داخل الصفحة: خط فاصل تحت مواد الترم، وتحته شريط المادة بأقسامه
         (تُنقل إليه واجهة #cm-ui عند نقر مادة من المكتبة) -->
    <div class="lib-course" id="lib-course" hidden></div>
  </section>

  <!-- لوحة الاختبارات الماضية: كل اختبار دخله المستخدم وبدأ فيه — يُملأ من الجافا -->
  <!-- الركنُ العامّ: كلُّ مجتمعاتك وكتبك. شكلُه لم يُقرَّر بعد، فمكانُه
       محجوزٌ بمساحةٍ رماديّةٍ لا بوعدٍ مكتوب -->
  <section class="panel" id="panel-nook-soon" hidden>
    <div class="soon-area"><span id="soon-tx">الركن العامّ</span></div>
  </section>

  <section class="panel" id="panel-past" hidden></section>

  <!-- لوحة الإحصائيات: ما صنعه المستخدم وما جلسه ومتى — يُملأ من الجافا -->
  <section class="panel" id="panel-stats" hidden></section>

  <!-- لوحة الحساب: تحل محل السوق/المكتبة في منطقة المحتوى عند نقر البروفايل -->
  <section class="panel" id="panel-account" hidden></section>

        <!-- الموازن: فراغٌ خاوٍ في ذيل الصفّ عرضُه (عرض «+» + الفُرجة). الصفُّ يقتسم وسطَه

    <div class="cd-layer">

       ليبقى وأنت تمرّر، وخارجُ #cm-ui كي لا يمحوه إعادةُ رسم الواجهة -->

  <!-- منتقي ملف الصورة (مخفي، يُستدعى من مربّع صورة المادة) -->
  <input type="file" id="imgpick" accept="image/*" hidden>

  <script>
    // تبديل التابات الأربعة — والمستمعُ على الشريط لا على مجموعةٍ منه:
    // ‏querySelector('.tabs') يمسك الأولى وحدَها، فلا تصل ضغطةُ المجموعة الثانية.
    document.getElementById('sidebar').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]'); if (!b) return;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('is-active', x === b));
      document.getElementById('side-profile').classList.remove('on');   // مغادرة لوحة الحساب
      document.getElementById('panel-account').hidden = true;
      // الركنُ للأعضاء: الزائرُ يُصرف إلى لوحٍ يقول له ما فيه ولا يبني ما لا يبقى له.
      // والحارسُ ههنا لا في app.js لأنّ هذا هو المستمعُ الذي يفتح الألواح.
      /* ===== «الركن» في الجذر غيرُه في المسلخ =====
         ههنا هو **الركنُ العامّ**: كلُّ مجتمعاتك وكتبك معًا. وشكلُه لم
         يُقرَّر، فيُحجز مكانُه بمساحةٍ رماديّة. وركنُك في مجتمعٍ بعينه
         يُفتح من اسمه في الدرج تحته، وذاك هو ‎panel-library‎ الحقيقيّ. */
      const toSoon = b.dataset.tab === 'library';
      document.getElementById('panel-nook-soon').hidden = !toSoon;
      document.getElementById('panel-nook-lock').hidden = true;
      document.getElementById('panel-explore').hidden = b.dataset.tab !== 'explore';
      document.getElementById('panel-market').hidden  = b.dataset.tab !== 'market';
      document.getElementById('panel-library').hidden = true;
      document.getElementById('panel-past').hidden    = b.dataset.tab !== 'past';
      document.getElementById('panel-stats').hidden   = b.dataset.tab !== 'stats';
      // واللوحان يُبنيان عند فتحهما لا في كل إقلاع: حسابٌ يمشي في بياناتك كلها ولا يُنظر كل مرة
      if (b.dataset.tab === 'past'  && window.acPastPaint)  window.acPastPaint();
      if (b.dataset.tab === 'stats' && window.acStatsPaint) window.acStatsPaint();
    });

    /* ===== مُستقَرُّ الجذر =====
       المحرّكُ مشتركٌ، وفيه «العودةُ إلى المكتبة» بعد الخروج من الحساب أو
       حذفه. فلا يُعدَّل من أجل موقعٍ واحد: يُرصد كشفُ لوحِ المكتبة، فإن
       كُشف رُدّ القصدُ إلى «استكشاف». رقابةٌ على الأثر لا جراحةٌ في المصدر. */
    (function () {
      var mk = document.getElementById('panel-market');
      var ex = document.getElementById('panel-explore');
      function toExplore() {
        ['panel-market', 'panel-library', 'panel-past', 'panel-stats',
         'panel-nook-lock', 'panel-account'].forEach(function (id) {
          var p = document.getElementById(id); if (p) p.hidden = true;
        });
        ex.hidden = false;
        var ch = document.getElementById('com-head'); if (ch) ch.hidden = true;
        document.querySelectorAll('.tabs button').forEach(function (x) {
          x.classList.toggle('is-active', x.dataset.tab === 'explore');
        });
      }
      new MutationObserver(function () { if (!mk.hidden && !inCom) toExplore(); })
        .observe(mk, { attributes: true, attributeFilter: ['hidden'] });

      /* والمحرّكُ لا يعرف هذا التابَ فلا يترجمه: يتبع لغةَ الصفحة من ههنا */
      var T = { tab:['استكشاف','Explore'], h1:['مجتمعات','Communities'],
                s1:['لكلِّ مجتمعٍ أهلُه ومكتبتُه.','Each community has its own people and library.'],
                soon:['قريبًا','Soon'], empty:['لم يُفتح هذا الرفُّ بعد.','This shelf is not open yet.'],
                add:['أضِف المجتمع','Add community'], added:['مضاف','Added'],
                page:['صفحة المجتمع','Community page'], soonN:['الركن العامّ','Your nook'] };
      function lang() { return document.documentElement.getAttribute('data-lang') === 'en' ? 1 : 0; }

      /* الرفوف: جدولٌ واحدٌ يُقرأ، فزيادةُ رفٍّ سطرٌ فيه لا قسمٌ في الصفحة.
         و«كتب أكاديميّة» وحدَه مملوء — كتبُه من المسلخ، ولذلك تحت كلِّ كتابٍ
         دائرتُه واسمُه. وما سواه رفٌّ موعودٌ يُعرض خاويًا ولا يُخترع له كتب. */
      var SHELVES = [
        { ar:'كتب أكاديمية', en:'Academic books', com:0 },
        { ar:'كتب ثقافية',   en:'Culture books' },
        { ar:'روايات',       en:'Novels' },
        { ar:'كتب إسلامية',  en:'Islamic books' }
      ];
      function label() {
        var i = lang();
        document.getElementById('tab-explore-tx').textContent = T.tab[i];
        document.getElementById('ex-h').textContent   = T.h1[i];
        document.getElementById('ex-sub').textContent = T.s1[i];
        document.getElementById('soon-tx').textContent     = T.soonN[i];
        document.getElementById('com-add-tx').textContent  = T.add[i];
        document.getElementById('com-open-tx').textContent = T.page[i];
        /* ومن كان داخل مجتمعٍ يتبدّل اسمُه معه ولا ينتظر خروجَه */
        if (curCom) document.getElementById('com-name').textContent = i ? curCom.en : curCom.ar;
      }

      /* ===== دُرجُ «مجتمعاتي» في الشريط =====
         ما يُضيفه المستخدمُ يسكن تحت «الركن». والسهمُ لا يُعرض إلّا إذا كان
         تحته شيء: سهمٌ يَفتح فراغًا وعدٌ كاذب. */
      function paintMine() {
        var list = mine().map(comById).filter(Boolean);
        var i = lang();
        var box = document.getElementById('nook-coms');
        var tw  = document.getElementById('nook-twist');
        box.innerHTML = list.map(function (c) {
          return '<button class="nook-com" type="button" data-open="' + c.id + '">' +
                 '<i style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')"></i>' +
                 '<span>' + esc(i ? c.en : c.ar) + '</span></button>';
        }).join('');
        tw.hidden = !list.length;
        if (!list.length) setNook(false);
        else if (!box.hidden) setNook(true);   /* والكتلةُ تبقى مطبوعةً بعد إعادة البناء */
        /* وأزرارُ «استكشاف» تُرى حالتُها: ‎+‎ صار ‎✓‎ لِما أُضيف */
        document.querySelectorAll('#ex-coms .ex-add[data-mine]').forEach(function (b) {
          var on = isMine(b.dataset.mine);
          b.classList.toggle('is-in', on);
          b.textContent = on ? '✓' : '+';
          b.title = on ? 'مضاف — اضغط للإزالة' : 'أضِف المجتمع';
        });
        var ca = document.getElementById('com-add');
        if (ca && curCom) {
          var on2 = isMine(curCom.id);
          ca.querySelector('.com-plus').textContent = on2 ? '✓' : '+';
          document.getElementById('com-add-tx').textContent = on2 ? T.added[lang()] : T.add[lang()];
        }
      }

      /* فتحُ الكتلة وطيُّها — من الترويسة وحدَها.
         وقاعدتُها: إن لم يكن الركنُ هو النشِط فالضغطةُ قصدُ دخولٍ، فتُفتح
         دائمًا؛ وإن كان نشطًا فالضغطةُ قصدُ تبديلٍ، فتُقلب. و‎is-active‎
         ههنا هي حالُ ما قبل الضغطة: مستمعُ الألواح معلَّقٌ على ‎#sidebar‎
         فيأتي بعد هذا في مسار الفقاعة. */
      function setNook(open) {
        document.getElementById('nook-coms').hidden = !open;
        document.getElementById('nook-block').classList.toggle('is-open', open);
        document.getElementById('nook-head').setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      document.getElementById('nook-head').addEventListener('click', function () {
        if (document.getElementById('nook-twist').hidden) return;   /* لا جوفَ يُفتح */
        var shut   = document.getElementById('nook-coms').hidden;
        /* وأنت في ركن مجتمعٍ بعينه، «الركن» خروجٌ منه إلى ركنك العامّ —
           قصدُ انتقالٍ لا قصدُ طيّ. فلا تُطوى الكتلةُ تحتك وأنت تغادرها. */
        var inside = !!document.querySelector('.nook-com.is-on');
        setNook((this.classList.contains('is-active') && !inside) ? shut : true);
      });
      /* ودخولُ مجتمعٍ من الدرج كدخوله من بطاقته سواءً */
      document.getElementById('nook-coms').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-open]'); if (!b) return;
        var c = comById(b.dataset.open); if (c) openCom(c, 'nook');
      });
      /* وزرُّ الإضافة — في البطاقة وفي الغلاف — يُبدّل العضويّة */
      document.getElementById('panel-explore').addEventListener('click', function (e) {
        var b = e.target.closest('.ex-add[data-mine]'); if (!b) return;
        e.preventDefault(); e.stopPropagation();
        toggleMine(b.dataset.mine);
      });
      document.getElementById('com-add').addEventListener('click', function () {
        if (curCom) toggleMine(curCom.id);
      });

      function paint() {
        label(); buildComs(); buildShelves(); paintMine();
        /* الأسهمُ تُعلَّق على ما لم يُعلَّق عليه بعد: الرفوفُ تُبنى من جديدٍ
           عند تبديل اللغة، فلولا العلامةُ لتضاعفت أزرارُها */
        document.querySelectorAll('#panel-explore .ex-wrap').forEach(function (w) {
          if (w.dataset.nav) return; w.dataset.nav = '1'; wireNav(w);
        });
      }
      new MutationObserver(paint).observe(document.documentElement,
        { attributes: true, attributeFilter: ['data-lang'] });


      /* ===== الصفّان =====
         أغلفةُ المجتمعات صورٌ في ‎assets/communities‎، وفوق كلٍّ منها حجابٌ
         أسودُ متدرّج. والتدرّجُ القديم (‎a‎ و‎b‎) باقٍ لا لغوًا: هو أرضيّةُ
         الغلاف قبل أن تصل صورتُه، وهو لونُ النقطة تحت الكتاب ونقطةِ الدرج
         — وصورةٌ في خمسةَ عشرَ بكسلًا طينٌ لا صورة. والكتبُ أغلفتُها موجودةٌ
         أصلًا في ‎shared/covers.js‎ — تُقرأ منه فلا تُكتب القائمةُ مرّتين. */
      var COMS = [
        { id:'maslakh',  ar:'المسلخ',  en:'Almaslakh',  href:'../Almaslakh/', img:'maslakh.jpg',  a:'#0e3b41', b:'#1f7a85' },
        { id:'mudarraj', ar:'المدرج',  en:'Almudarraj', soon:1, img:'mudarraj.jpg', a:'#3a2d18', b:'#8a6d2f' },
        { id:'qudurat',  ar:'القدرات', en:'Qudurat',    soon:1, img:'qudurat.webp', a:'#2a2142', b:'#5d4a95' },
        { id:'tahsili',  ar:'التحصيلي', en:'Tahsili',   soon:1, img:'tahsili.jpg',  a:'#1e3326', b:'#3f7a55' },
        { id:'ielts',    ar:'الآيلتس', en:'IELTS',      soon:1, img:'ielts.jpg',    a:'#3b1f26', b:'#8d4654' }
      ];

      /* ===== مجتمعاتي =====
         قائمةُ معرّفاتٍ لا أكثر — بضعةُ بايتاتٍ في درجٍ خاصٍّ بها، فلا تزاحم
         درجَ الموقع الثقيل. وهي اليومَ في المتصفّح وحده: لا نقطةَ في الخادم
         تحفظها بعد، فمتى صارت نُقلت إلى الحساب فتتبعك بين أجهزتك. */
      var MINE_K = 'academia2:coms:v1';
      function mine() {
        try { var a = JSON.parse(localStorage.getItem(MINE_K) || '[]'); return Array.isArray(a) ? a : []; }
        catch (e) { return []; }
      }
      function mineSet(a) { try { localStorage.setItem(MINE_K, JSON.stringify(a)); } catch (e) {} }
      function isMine(id) { return mine().indexOf(id) >= 0; }
      function toggleMine(id) {
        var a = mine(), i = a.indexOf(id);
        if (i >= 0) a.splice(i, 1); else a.push(id);
        mineSet(a); paintMine();
      }
      function comById(id) {
        for (var i = 0; i < COMS.length; i++) if (COMS[i].id === id) return COMS[i];
        return null;
      }
      /* زرُّ الكتاب بلا معرّف: لم يُقرَّر بعدُ ما يفعله، فيبقى ساكنًا */
      var PLUS = '<button class="ex-add" type="button" title="أضِف">+</button>';
      function plusFor(id) {
        var on = isMine(id);
        return '<button class="ex-add' + (on ? ' is-in' : '') + '" type="button" data-mine="' + id +
               '" title="' + (on ? 'مضاف — اضغط للإزالة' : 'أضِف المجتمع') + '">' + (on ? '✓' : '+') + '</button>';
      }

      function esc(t) { return String(t).replace(/[&<>"]/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

      function buildComs() {
        var i = lang();
        document.getElementById('ex-coms').innerHTML = COMS.map(function (c) {
          /* الصورةُ عنصرٌ لا خلفيّة: ‎loading="lazy"‎ لا يعمل على الخلفيّات،
             وصفٌّ من خمسةِ أغلفةٍ يُحمَّل كلُّه قبل أن يُرى منه اثنان. والتدرّجُ
             تحتها يبقى: هو ما يُرى في الومضة الأولى وإن تعذّرت الصورة. */
          var cover = '<div class="ex-cover" style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')">' +
                      (c.img ? '<img class="ex-shot" loading="lazy" decoding="async" alt="" src="../assets/communities/' + c.img + '">' : '') +
                      '<span class="ex-veil"></span>' +
                      '<span class="ex-cover-t">' + esc(i ? c.en : c.ar) + '</span></div>';
          /* والزرُّ خارجَ الوصلة لا بداخلها: لو سكن فيها لفتح المجتمعَ من ضغطه */
          var cap = '<div class="ex-cap"><b>' +
                    (c.soon ? T.soon[i] : esc(i ? c.en : c.ar)) + '</b>' + plusFor(c.id) + '</div>';
          var face = c.soon
            ? '<div class="ex-face">' + cover + '</div>'
            /* الرابطُ يبقى في ‎href‎ وإن كان الفتحُ في مكانه: من فتحه في لسانٍ
               جديدٍ أو عطبت جافاسكربتُه وجد موقعَ المجتمع لا زرًّا ميّتًا */
            : '<a class="ex-face" href="' + c.href + '" data-com="' + COMS.indexOf(c) + '">' + cover + '</a>';
          return '<div class="ex-card' + (c.soon ? ' is-soon' : '') + '">' + face + cap + '</div>';
        }).join('');
      }

      /* شارةُ المجتمع: دائرتُه بلون غلافه، واسمُه، ووصلةٌ تفتحه */
      function ownOf(ci) {
        var c = COMS[ci], i = lang();
        return '<a class="ex-own" href="' + c.href + '" data-com="' + ci + '">' +
               '<i class="ex-dot" style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')"></i>' +
               '<span>' + esc(i ? c.en : c.ar) + '</span></a>';
      }
      /* ===== اسمُ المادّة يتبع لغةَ الموقع =====
         بالعربيّة: القسمُ مختصرًا ثمّ الرقم — «محاسبة 300».
         وبالإنجليزيّة: الكودُ اللاتينيُّ كما هو — «ACCT 300».
         والقاعدةُ ليست من عندي: هي ‎arShort‎ في المحرّك بعينها، وجدولُها
         ‎DEPT_AR‎ في ‎shared/courses.js‎ — فيُسمّى الكتابُ ههنا كما يُسمّى في
         المكتبة سواءً، ولا ينشقّ اسمٌ عن اسم. */
      function codeLabel(code, i) {
        if (i) return code;                       /* الإنجليزيّةُ هي الكود */
        var sp = code.indexOf(' ');
        if (sp < 1 || typeof DEPT_AR === 'undefined') return code;
        var d = DEPT_AR[code.slice(0, sp)];
        return d ? d + ' ' + code.slice(sp + 1) : code;
      }
      /* والاسمُ الكاملُ تلميحًا عند المرور، من جدول المواد إن كان فيه */
      var FULL = null;
      function fullName(code) {
        if (FULL === null) {
          FULL = {};
          if (typeof COURSES !== 'undefined') {
            COURSES.forEach(function (c) { FULL[c.code] = c.ar || ''; });
          }
        }
        return FULL[code] || '';
      }

      function bookCards(sh) {
        if (sh.com === undefined || typeof COVERS === 'undefined') {
          var ph = '<div class="ex-card is-ph"><div class="ex-cover">' +
                   '<svg viewBox="-155 57.49 310 244.51" fill="currentColor" aria-hidden="true">' +
                   '<path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 ' +
                   'A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z"/></svg></div></div>';
          return new Array(7).join('|').split('|').map(function () { return ph; }).join('');
        }
        var own = ownOf(sh.com), i = lang();
        return Object.keys(COVERS).map(function (code) {
          var nm = codeLabel(code, i), full = fullName(code);
          return '<div class="ex-card"' + (full ? ' title="' + esc(full) + '"' : '') + '>' +
                 '<div class="ex-cover">' +
                 '<img loading="lazy" alt="' + esc(nm) + '" src="../' + COVERS[code] + '">' +
                 '</div><div class="ex-cap"><b>' + esc(nm) + '</b>' + PLUS + '</div>' + own + '</div>';
        }).join('');
      }
      function buildShelves() {
        var i = lang();
        document.getElementById('ex-shelves').innerHTML = SHELVES.map(function (sh) {
          var open = sh.com !== undefined;
          return '<section class="ex-row"><div class="ex-head">' +
                   '<h2 class="ex-h">' + esc(i ? sh.en : sh.ar) + '</h2>' +
                   (open ? '' : '<span class="ex-chip">' + T.soon[i] + '</span>' +
                                '<p class="ex-sub">' + T.empty[i] + '</p>') +
                 '</div><div class="ex-wrap"><div class="ex-strip ex-strip--books">' +
                 bookCards(sh) + '</div></div></section>';
        }).join('');
      }

      /* سهما التمرير: الاتّجاهُ يُؤخذ من الصفحة لا يُفترض — ‎scrollLeft‎ يسير
         بالسالب في العربيّة، فالحسابُ بالقيمة المطلقة والإشارةُ من الجهة. */
      function wireNav(wrap) {
        var strip = wrap.querySelector('.ex-strip');
        var mk = function (cls, d) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'ex-nav ' + cls;
          b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
                        'stroke-linecap="round" stroke-linejoin="round"><path d="M' +
                        (d < 0 ? '15 5l-7 7 7 7' : '9 5l7 7-7 7') + '"/></svg>';
          b.addEventListener('click', function () {
            var rtl = getComputedStyle(strip).direction === 'rtl';
            strip.scrollBy({ left: d * strip.clientWidth * 0.85 * (rtl ? -1 : 1), behavior: 'smooth' });
          });
          wrap.appendChild(b); return b;
        };
        var prev = mk('ex-nav--s', -1), next = mk('ex-nav--e', 1);
        function upd() {
          var x = Math.abs(strip.scrollLeft);
          var max = strip.scrollWidth - strip.clientWidth - 2;
          prev.hidden = x <= 12;
          next.hidden = x >= max - 12 || max <= 0;
        }
        strip.addEventListener('scroll', upd);
        window.addEventListener('resize', upd);
        setTimeout(upd, 60);
      }

      /* ===== الدخولُ إلى مجتمع =====
         الجذرُ بلا مكتبةٍ خاصّةٍ به، ومكتبةُ المجتمع تُفتح داخلَه لا بالانتقال
         إلى موقعٍ آخر: يُكشف رأسُ المجتمع ثمّ لوحُ المكتبة كما هو — بحثُه
         وتصنيفاتُه وتاباتُ المادّة من «المادّة» إلى «البطاقات والملخّصات».
         ولا يُبنى شيءٌ من جديد، فما بُني مرّةً لا يُكتب مرّتين. */
      var inCom = false, curCom = null;
      /* المُمَرَّرُ في هذه الصفحة هو ‎body‎ لا النافذة — قِيس فوُجد. فتُمسح
         الثلاثةُ معًا، إذ تختلف بين المتصفّحات وبين أوضاع الصفحة. */
      function top() {
        try { window.scrollTo(0, 0); } catch (e) {}
        document.body.scrollTop = 0;
        if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      }
      /* ‎mode‎: ‎'market'‎ مكتبةُ المجتمع (من بطاقته) · ‎'nook'‎ ركنُك فيه
         (من اسمه في الدرج). والرأسُ واحدٌ فوقهما، فيُعلم أين أنت. */
      function openCom(c, mode) {
        inCom = true; curCom = c;
        var nook = mode === 'nook';
        document.getElementById('com-open').href = c.href;
        /* ورأسُ المجتمع يلبس صورتَه. والترتيبُ في ‎background‎ من فوقُ إلى
           تحت: الحجابُ أوّلًا، ثمّ الصورةُ، ثمّ التدرّجُ أرضيّةً لها. */
        document.getElementById('com-cover').style.background =
          (c.img ? 'linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.18) 38%, rgba(0,0,0,.76) 100%),'
                 + ' url("../assets/communities/' + c.img + '") center/cover no-repeat,'
                 : '') +
          'linear-gradient(135deg,' + c.a + ',' + c.b + ')';
        document.getElementById('com-name').textContent = lang() ? c.en : c.ar;
        /* ولا غلافَ فوق الركن: الأترامُ أوّلَ ما تقع عليه العين. والغلافُ
           لمكتبة المجتمع وحدها، وموضعُك معلومٌ من الدرج المضيء. */
        document.getElementById('com-head').hidden = nook;
        paintMine();
        ex.hidden = true;
        document.getElementById('panel-nook-soon').hidden = true;
        document.getElementById('panel-account').hidden = true;
        mk.hidden = nook;
        /* والركنُ للأعضاء: الزائرُ يُصرف إلى لوحه كما يصنع تابُ الركن */
        var guest = window.acIsGuest && window.acIsGuest();
        document.getElementById('panel-library').hidden   = !nook || guest;
        document.getElementById('panel-nook-lock').hidden = !nook || !guest;
        if (nook && guest && window.acNookLock) window.acNookLock();
        /* والتابُ المضيء: الدرجُ ساكنٌ تحت «الركن»، فهو المضيءُ معه */
        document.querySelectorAll('.tabs button').forEach(function (x) {
          x.classList.toggle('is-active', nook && x.dataset.tab === 'library');
        });
        document.querySelectorAll('.nook-com').forEach(function (x) {
          x.classList.toggle('is-on', nook && x.dataset.open === c.id);
        });
        top();
        try { history.pushState({ ac: 'com' }, '', '#' + (c.en || 'community')); } catch (e) {}
      }
      /* الرجوعُ واحدٌ سواءٌ جاء من الزرّ أو من زرّ المتصفّح */
      function closeCom(fromPop) {
        if (!inCom) return;
        inCom = false; curCom = null;
        document.getElementById('com-head').hidden = true;
        mk.hidden = true;
        document.getElementById('panel-library').hidden   = true;
        document.getElementById('panel-nook-lock').hidden = true;
        document.querySelectorAll('.nook-com').forEach(function (x) { x.classList.remove('is-on'); });
        ex.hidden = false;
        top();
        if (!fromPop) { try { history.back(); } catch (e) {} }
      }
      document.getElementById('panel-explore').addEventListener('click', function (e) {
        var a = e.target.closest('a[data-com]');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        openCom(COMS[+a.dataset.com]);
      });
      document.getElementById('com-back').addEventListener('click', function () { closeCom(false); });
      window.addEventListener('popstate', function () { closeCom(true); });
      /* ومغادرةُ المجتمع بتابٍ آخر مغادرةٌ أيضًا، وإلّا بقي الحارسُ معطَّلًا */
      document.getElementById('sidebar').addEventListener('click', function (e) {
        if (e.target.closest('button[data-tab]')) {
          inCom = false;
          document.getElementById('com-head').hidden = true;
        }
      });

      /* أيقونةُ «شريط جانبيّ»: مستطيلٌ وقسمةٌ على جهة الشريط — تُبدَّل ههنا
         لأنّ المحرّكَ الذي يبنيها مشتركٌ مع المسلخ، وهذا تغييرُ الجذر وحده. */
      function sideIcon() {
        var h = document.getElementById('side-handle'); if (!h) return;
        h.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"' +
          ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<rect x="3" y="4.5" width="18" height="15" rx="3.2"/><path d="M15.2 4.5v15"/></svg>';
      }
      /* ===== دورةُ الحالات الثلاث =====
         الإخفاءُ يبقى للمحرّك (هو يحفظه ويعرفه)، والسكّةُ لنا. فيُعترض
         الضغطُ في طور الالتقاط: إن كان واسعًا صار سكّةً ولا يبلغ المحرّكَ
         الخبر، وإن كان سكّةً مرّت الضغطةُ إليه فأخفاه، وإن كان مخفيًّا
         فتحه هو ونحن نُطفئ السكّة. فحالتان محفوظتان في موضعيهما. */
      var RAIL_K = 'academia2:rail:v1';
      function setRail(on) {
        document.body.classList.toggle('side-rail', !!on);
        try { localStorage.setItem(RAIL_K, on ? '1' : ''); } catch (e) {}
      }
      document.getElementById('side-handle').addEventListener('click', function (e) {
        var hidden = document.body.classList.contains('side-closed');
        var rail   = document.body.classList.contains('side-rail');
        if (!hidden && !rail) { setRail(true); e.stopImmediatePropagation(); e.preventDefault(); return; }
        setRail(false);          /* سكّةٌ ⟵ مطويّ · ومطويٌّ ⟵ واسع: كلاهما للمحرّك */
      }, true);
      try { if (localStorage.getItem(RAIL_K)) document.body.classList.add('side-rail'); } catch (e) {}

      /* موضعُ المؤشّر داخل الصفّ — نسبةً مئويّةً لا بكسلات، فلا يُعاد الحسابُ
         متى تغيّر العرض. ويُقرأ من حدث واحدٍ على اللوح لا من مستمعٍ لكلّ صفّ. */
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.getElementById('sidebar').addEventListener('pointermove', function (e) {
          var row = e.target.closest('.tabs button, .nook-com'); if (!row) return;
          var r = row.getBoundingClientRect();
          row.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100).toFixed(1) + '%');
          row.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100).toFixed(1) + '%');
        }, { passive: true });
      }

      document.addEventListener('DOMContentLoaded', function () { paint(); sideIcon(); });
    })();
  </script>

  <!-- ===== حمولةُ نقلة أنكي — ملفُّ عُدّةٍ مؤقّت =====
       يُحمَّل مرّةً واحدةً لتنزل البطائق، ثمّ يُرفع هذا الوسمُ والملفُّ والدالّةُ معه.
       ما نفعله **استيرادٌ لا ربط**: البطائقُ تصير بيانًا في الموقع كأنّك كتبتَها بيدك،
       ولا يبقى في المشروع اسمُ برنامجٍ آخر ولا ملفٌّ يُقرأ في كلّ إقلاع -->
  <!-- ‏‎seed-cards.js‎ لا يُحمَّل ههنا: ٦٣٥ك تُقرأ مرّةً في عمر المتصفّح
       ثمّ لا تُقرأ أبدًا. فيجلبها المحرّكُ عند الحاجة وحدَها (م٥). -->
  <!-- عبّئ المادة من سيلبوسها — ROADMAP-SYLLABUS.md -->
  <div class="mmodal syl-modal" id="syl-modal" hidden>
    <div class="mmodal__card syl-card">
      <div class="mmodal__head">
        <h3 class="mmodal__title" id="syl-title"></h3>
        <button class="mmodal__close" id="syl-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="syl-body">
        <section class="syl-half syl-half--p">
          <p class="syl-step"><b>1</b><span id="syl-s1"></span></p>
          <textarea class="syl-prompt" id="syl-prompt" readonly spellcheck="false"></textarea>
          <button class="syl-btn syl-btn--copy" id="syl-copy" type="button"></button>
        </section>
        <section class="syl-half syl-half--d">
          <p class="syl-step"><b>2</b><span id="syl-s2"></span></p>
          <div class="syl-drop" id="syl-drop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
            </svg>
            <b id="syl-drop-t"></b>
            <button class="syl-btn" id="syl-pick" type="button"></button>
            <input type="file" id="syl-file" accept=".json,.txt,application/json,text/plain" hidden>
          </div>
          <div class="syl-out" id="syl-out" hidden></div>
          <button class="syl-btn syl-btn--go" id="syl-done" type="button" hidden></button>
        </section>
      </div>
    </div>
  </div>

  <!-- جسرُ الخادم: يسبق المحرّك ليُستبدَل fetch قبل أوّل نداء -->
  <script src="api-base.js"></script>
  <script src="../shared/courses.js"></script>
  <script src="../shared/covers.js"></script>
  <!-- فهرس وجوه المجلدات: أسماء ملفات emoji/ — يُقرأ في منتقي وجه المجلد -->
  <script src="emoji.js"></script>
  <script src="app.js"></script>
</body>
