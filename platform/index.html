<!doctype html>
<!-- ‎spellcheck="false"‎ على الجذر: المتصفّح يقرأ ما تكتب فيرسم تحته خطًّا أحمر للإملاء
     وأزرقَ مزدوجًا للنحو، ويُظلّل المنطقةَ بالأزرق عند المرور. وهو في نصٍّ عربيٍّ عِلمِيٍّ
     ضوضاءُ لا فائدةَ فيها. والسِّمةُ تُورَّث، فوضعُها هنا يُطفئه في كل حقلٍ في الموقع —
     القائمِ منها والذي يولد بعدُ -->
<html lang="ar" dir="rtl" data-skin="flat" data-theme="light" spellcheck="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديميا</title>

  <!-- ===== أيقونةُ اللسان =====
       ثلاثةُ مقاساتٍ مصرَّحة، ولكلٍّ قصُّه: ‎١٦‎ مقصوصةٌ إلى ‎٧٢٪‎ لأنّ هامشَ
       الأيقونة يأكل ثلثَ بكسلاتها في ذلك الحجم فتذوب العلامات، و‎٣٢‎ فما فوق
       كما رُسمت. والمتصفّحُ ينتقي الأقربَ إلى ما يطلب، فيُعطى مضبوطًا لا مُصغَّرًا.
       و‎favicon.ico‎ في الجذر لمن لا يقرأ الوسمَ ويطلبه بالعادة. -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/mark/mark-white.svg?v=mark1">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/mark/mark-white-16.png?v=mark1">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/mark/mark-white-32.png?v=mark1">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/mark/mark-white-192.png?v=mark1">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/mark/mark-white-180.png?v=mark1">

  <!-- الورقةُ مضغوطةً في المنشور: ‎_ver.sh‎ يبنيها (‎styles.min.css‎) ويكتب رقمَ بنائها في ‎AC_MINV‎.
       ‎0‎ = لم تُبنَ فالأصل. ومحلّيًّا الأصلُ دائمًا: ما يُعدَّل يُرى بلا بناء -->
  <script>
    window.AC_MINV = 1617;
    window.AC_MIN = !!AC_MINV && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    document.write('<link rel="stylesheet" href="../shared/styles' + (AC_MIN ? '.min.css?v=' + AC_MINV : '.css?v=1') + '">');
  </script>
  <!-- جلدُ الجذر: رماديٌّ مسطَّح. يُحمَّل بعد الأمّ فيغلب توكناتِها -->
  <link rel="stylesheet" href="../shared/skin-flat.css?v=7">

  <!-- ===== ما يخصّ الجذرَ وحدَه =====
       قُفلُ الشعار، ولوحُ «استكشاف»، ورأسُ المجتمع. وموضعُ هذي القواعد ههنا لا
       في ‎shared/styles.css‎ لأنّ تلك الورقةَ مشتركةٌ مع المسلخ، وهذا بابٌ لا
       يعنيه. وكان فيه مبدِّلُ المجتمع فرُفع: الجذرُ يُبدَّل منه بـ«استكشاف»،
       والمبدّلُ يبقى في المسلخ وحده. -->
  <style>
    .side-head { display: flex; flex-direction: column; gap: 5px; }

    /* الشعارُ والاسمُ قُفلٌ واحد: الرمزُ يتقدّم الاسمَ في القراءتين كلتيهما.
       والشريطُ يبقى في مجرى العربيّة ولو صارت الصفحةُ إنجليزيّة — قِيسَ فلم
       ينقلب الصفُّ من نفسه، فيُقلب صراحةً بقاعدةِ ‎data-lang‎ تحتُ.
       والرمزُ أخٌ لـ‎.side-logo‎ لا ابنٌ لها: المحرّكُ يكتب فيها بـ‎textContent‎
       عند تبديل اللغة، فما بداخلها يُمحى. */
    .side-brand { display: flex; align-items: center; justify-content: center; gap: 5px; }
    /* ولونُها حبرُ اللوح لا بترولُ المسلخ: الجذرُ ليس مجتمعًا من مجتمعاته،
       فلا يلبس لونَ أحدِها. أسودُ على الفاتح وأبيضُ على الداكن. */
    .side-mark  { width: 26px; height: auto; flex: none; display: block;
                  color: var(--glass-ink); }
    html[data-lang="en"]    .side-brand { flex-direction: row-reverse; }
    .side-mark-a { display: flex; flex: none; color: inherit; text-decoration: none;
                   border-radius: 8px; transition: opacity .15s; }
    .side-mark-a:hover { opacity: .7; }
    .side-mark-a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }


    /* ===== الجذرُ بلا مكتبة، وفيه «استكشاف» =====
       تابُ المكتبة يُخفى ولا يُحذف: المحرّكُ مشتركٌ مع المسلخ، وفيه سطرٌ
       يكتب نصَّ هذا التاب عند تبديل اللغة بلا حارس — فحذفُ الزرّ يُسقط
       الترجمةَ كلَّها على الموقعين. فالإخفاءُ ههنا، والمحرّكُ لا يُمَسّ. */
    .sidebar .tabs button[data-tab="market"] { display: none; }

    /* رأسُ المجتمع: غلافٌ عريضٌ عليه اسمُه وزرُّ رجوع، يعلو مكتبتَه.
       والمكتبةُ تحته هي هي: بحثُها وتصنيفاتُها وتاباتُ المادّة لم تُمَسّ. */
    .com-cover { position: relative; display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px;
                 min-height: clamp(112px, 16vw, 172px); padding: 16px 20px;
                 border-radius: 16px; overflow: hidden; color: #fff; }
    .com-cover h2 { margin: 0; font-size: clamp(21px, 3.1vw, 33px); font-weight: 700;
                    text-shadow: 0 1px 12px rgba(0,0,0,.32); }
    .com-cover .ex-cover-m { width: 29px; opacity: .45; inset-inline-end: 17px; bottom: 15px; }
    .com-back  { position: absolute; inset-inline-start: 13px; top: 13px; z-index: 2;
                 width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 0;
                 background: rgba(0,0,0,.34); color: #fff; display: grid; place-items: center;
                 transition: background .15s; }
    .com-back:hover { background: rgba(0,0,0,.54); }

    /* زرّا الغلاف: في طرف سطر الاسم، فيتوازن الرأسُ — الاسمُ في مبدأ
       القراءة وفعلاهُ في منتهاها. ويلتفّان تحته في الشاشة الضيّقة. */
    .com-acts { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
    .com-btn  { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
                border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.24);
                color: #fff; border-radius: 99px; padding: 7px 15px; text-decoration: none;
                font: inherit; font-size: 12.5px; font-weight: 700; white-space: nowrap;
                transition: background .15s, border-color .15s; }
    .com-btn:hover { background: rgba(0,0,0,.42); border-color: #fff; color: #fff; }
    .com-btn--go { background: rgba(255,255,255,.93); border-color: transparent; color: #1b1a18; }
    .com-btn--go:hover { background: #fff; color: #1b1a18; }
    .com-plus { font-size: 15px; line-height: 1; }
    .com-back svg { width: 17px; height: 17px; }
    /* سهمُ الرجوع يشير إلى حيث جئت: يمينًا في العربيّة ويسارًا في الإنجليزيّة */
    html[dir="ltr"] .com-back svg { transform: scaleX(-1); }

    /* صفوفٌ تُمرَّر أفقيًّا على طريقة نتفلكس وثمانية: عنوانٌ في مبدأ القراءة
       (يمينُ الصفحة في العربيّة) وتحته شريطُ أغلفةٍ ينزلق. ولا شيءَ ههنا
       مثبَّتٌ بالفيزياء: الاتّجاهُ منطقيّ، فينقلب الصفُّ كلُّه مع اللغة. */
    .ex-row   { position: relative; margin: 0 0 32px; }
    .ex-head  { display: flex; align-items: baseline; gap: 10px; margin: 0 0 11px; }
    .ex-h     { margin: 0; font-size: 19px; font-weight: 700; }
    .ex-sub   { margin: 0; color: var(--c-ink-soft); font-size: 12.5px; }

    .ex-wrap  { position: relative; }
    .ex-strip { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth;
                scroll-snap-type: x proximity; padding: 4px 2px 8px;
                scrollbar-width: none; }
    .ex-strip::-webkit-scrollbar { display: none; }

    .ex-card  { flex: 0 0 auto; scroll-snap-align: start; text-decoration: none; color: inherit; }
    .ex-cover { position: relative; display: grid; place-items: center; overflow: hidden;
                border: 1px solid var(--border); border-radius: 12px;
                transition: transform .18s ease, box-shadow .18s ease; }
    .ex-face  { display: block; text-decoration: none; color: inherit; }
    a.ex-face:hover .ex-cover, a.ex-face:focus-visible .ex-cover {
                transform: scale(1.035); box-shadow: 0 10px 26px rgba(0,0,0,.2); }
    .ex-cap   { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; }
    .ex-cap b { font-weight: 700; }
    .ex-cap s { text-decoration: none; color: var(--c-ink-soft); font-size: 11.5px; }

    /* المجتمعات: ‎١٦:٩‎ — مقاسُ مصغَّرة يوتيوب، وهو مقاسُ صفّ نتفلكس كذلك */
    .ex-strip--com .ex-card  { width: clamp(196px, 25vw, 300px); }
    .ex-strip--com .ex-cover { aspect-ratio: 16 / 9; border: 0; }
    /* ===== الغلافُ تدرّجٌ لا صورة =====
       رُفعت الصورُ الفوتوغرافيّةُ عن الأغلفة (٢٠٢٦-١٠-٢٣)، وعاد الغلافُ
       تدرّجًا كما كان. ومعها رُفع الحجابُ الأسودُ: إنّما كان لأجلها —
       إضاءةُ الصورة تختلف من ركنٍ إلى ركن فيضيع عليها الاسمُ الأبيض.
       والتدرّجُ معلومُ اللون، فأسوأُ ما يقع تحت الاسم هو طرفُه الأفتح
       (‎b‎)، ويُحسب لا يُقدَّر: أضعفُها ‎#8a6d2f‎ بـ‎4.87:1‎ — فوق
       البوّابة. ويَقرأ ‎_vglass.html‎ الخمسةَ من هذا المصدر ويُعيد الحساب،
       فمتى فُتح لونٌ أفتحُ من ذلك سقط الفحصُ وصار الحجابُ لازمًا من جديد. */
    .ex-cover-t { color: #fff; font-size: clamp(18px, 2.4vw, 26px); font-weight: 700;
                  text-shadow: 0 1px 10px rgba(0,0,0,.28); }
    .ex-cover-m { position: absolute; inset-inline-end: 11px; bottom: 10px;
                  width: 21px; color: #fff; opacity: .45; }
    /* و«قريبًا» يُنزع لونُها: يَصلح للتدرّج، وهو ما عاد إليه الغلاف */
    .ex-card.is-soon .ex-cover { filter: saturate(.3) brightness(.85); }
    .ex-card.is-soon { cursor: default; }

    /* الكتب: غلافُ الكتاب قائمٌ لا مضطجع، فيُترك على نسبته */
    /* شارةُ المجتمع تحت الكتاب: دائرةٌ بلون غلافه واسمُه — فيُرى الارتباطُ
       من غير قراءة. وهي وصلةٌ تفتح المجتمعَ كبطاقته في الصفّ الأوّل. */
    /* كتابٌ بلا غلافٍ في الفهرس: بطاقةٌ باسمه لا فراغ */
    .ex-cover.is-noimg { display: grid; place-items: center; padding: 10px;
                         background: var(--plate, rgba(128,128,128,.10)); }
    .ex-noimg { font-size: 13px; font-weight: 700; text-align: center;
                color: var(--glass-ink, inherit); opacity: .75; }

    .ex-own   { display: flex; align-items: center; gap: 6px; margin-top: 5px;
                font-size: 11.5px; color: var(--c-ink-soft); text-decoration: none; }
    a.ex-own:hover { color: var(--c-kfupm); }
    .ex-dot   { width: 15px; height: 15px; border-radius: 50%; flex: none; }

    /* ===== الركنُ العامّ ===== */
    #panel-nook-soon .ex-head { margin-bottom: 14px; }
    #panel-nook-soon .ex-h    { font-size: 24px; }
    .gn-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
    .gn-chip  { font: inherit; font-size: 13px; border: 1px solid var(--border); background: transparent;
                color: inherit; padding: 5px 13px; border-radius: 99px; display: inline-flex;
                align-items: center; gap: 7px; cursor: pointer; }
    .gn-chip.is-on { background: var(--c-ink, #1d1d1f); color: var(--bg, #fff); border-color: transparent; }
    .gn-chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .gn-past  { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 18px; }
    .gn-row   { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 2px;
                border: 0; border-bottom: 1px solid var(--border); background: none; color: inherit;
                font: inherit; font-size: 14px; text-align: start; cursor: pointer; flex-wrap: wrap; }
    .gn-row:hover b { color: var(--c-kfupm); }
    .gn-row i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
    .gn-row b { min-width: 52px; }
    .gn-row span { color: var(--c-ink-soft); font-size: 12.5px; min-width: 0; direction: ltr; unicode-bidi: plaintext; }
    .gn-row em { margin-inline-start: auto; font-style: normal; color: var(--c-ink-soft); font-size: 12px; }
    .gn-msg   { color: var(--c-ink-soft); font-size: 14px; padding: 26px 2px; }
    .gn-msg a { color: var(--c-kfupm); }
    .gn-strip .ex-card { cursor: pointer; }

    /* ===== أوراقُ المجتمعات (‎ROADMAP-EXPLORE س٢‎) =====
       كلُّ ورقةٍ مطلقةُ الموضع، ويحسب ‎csRender()‎ بدايتَها (‎inset-inline-start‎) وعرضَها، فتنقلب
       مع اللغة بلا حسابٍ ثانٍ. والمقدّمةُ فوق الجميع، وكلُّ ما بعُد عنها أخفضُ وأعتم. */
    .cs-stack { position: relative; z-index: 0; height: 212px; margin: 4px 0 6px; outline: none; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .cs-stack img { -webkit-user-drag: none; }   /* ‎z-index‎ يحبس طبقاتِ الأوراق داخلها */
    .cs-card  { container-type: inline-size; position: absolute; top: 14px; bottom: 14px; overflow: hidden; border-radius: 22px; color: #fff;
                background: linear-gradient(160deg, var(--b), var(--a));
                box-shadow: 0 6px 16px -10px rgba(0,0,0,.45);
                transition: box-shadow .3s ease; }   /* الموضعُ والعرضُ يرسمهما ‎csRender‎ إطارًا إطارًا */
    .cs-card.is-on { box-shadow: 0 18px 40px -18px rgba(0,0,0,.55); }
    .cs-card.is-soon { filter: saturate(.35) brightness(.8); }
    /* العلامةُ المائيّة: رمزُ الجهة وحده (بلا نصوص) على اليسار في العربيّة (آخرَ السطر)، كبيرةٌ ومقصوصةٌ بالحافّة،
       في منتصف الارتفاع — والنصوصُ في النصف الآخر فلا يتقاطعان (‎.cs-open‎ يترك لها ٤٢٪) */
    .cs-wm    { position: absolute; inset-inline-end: -12%; top: 50%; transform: translateY(-50%); width: 52%; height: 140%;
                object-fit: contain; object-position: left center; opacity: .1; pointer-events: none; transition: opacity .4s; }
    html[dir="ltr"] .cs-wm { object-position: right center; }
    .cs-card.is-on .cs-wm { opacity: .15; }
    .cs-card[data-wmw] .cs-wm { inset-inline-end: 4%; width: 38%; height: 80%; }
    /* شعارٌ ملوّن على ورقةٍ داكنة: يرسم أبيض كله (‎mono‎ في السجل) */
    .cs-card[data-mono] .cs-open img, .cs-card[data-mono] .cs-peek img, .cs-card[data-mono] .cs-wm { filter: brightness(0) invert(1); }
    /* بلا شعار: الاختصارُ نفسُه علامةٌ مائيّة (‎STEP‎ · ‎CFA‎ · «ثانوي») */
    .cs-wmt   { position: absolute; inset-inline-end: 5%; top: 50%; transform: translateY(-50%); font-family: 'Space Grotesk', 'IBM Plex Sans Arabic', sans-serif;
                font-size: min(150px, calc(36cqw / (var(--n) * .78))); font-weight: 700; line-height: 1; letter-spacing: -4px; white-space: nowrap; opacity: .12;
                pointer-events: none; transition: opacity .4s; }
    .cs-card.is-on .cs-wmt { opacity: .18; }
    .cs-hit   { position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: none; cursor: pointer; border-radius: inherit; }
    .cs-hit:focus-visible { outline: 3px solid var(--acc, #fff); outline-offset: -5px; }
    /* المغلقة: رمزُها في الجزء الظاهر منها وحده — أوّلَ الورقة أو آخرَها بحسب جهتها */
    .cs-peek  { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 10px; pointer-events: none; }
    .cs-peek img { width: auto; max-width: 70%; height: 46px; }
    .cs-peek span { font-size: 12.5px; font-weight: 700; text-align: center; padding: 0 6px; line-height: 1.35; }
    /* المقدّمة: الشعارُ كاملًا والاسمُ والجهةُ وزرّا الدخول والإضافة */
    .cs-open  { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
                padding-block: 16px; padding-inline: 30px 44%; opacity: 0; pointer-events: none;
                inset-inline-end: auto; width: var(--ow, 100%); }   /* عرضٌ ثابت: النصُّ لا يُعاد لفُّه والورقةُ تتّسع */
    .cs-card:not(.is-on) .cs-act { visibility: hidden; }
    .cs-open img { height: 40px; width: auto; max-width: 60%; align-self: flex-start; margin-bottom: 6px; }
    .cs-name  { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .cs-tt    { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .cs-open b { padding-bottom: .3em; }
    .cs-badge { flex: none; position: relative; width: 60px; height: 60px; }
    .cs-badge.is-wide { width: 120px; height: 40px; }
    .cs-open .cs-badge img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; margin: 0; align-self: center; }
    .cs-open b { font-size: clamp(24px, 2.8vw, 34px); font-weight: 700; line-height: 1.15; }
    .cs-open b.is-long { font-size: clamp(19px, 2vw, 24px); } .cs-open > * { flex-shrink: 0; } .cs-open b.is-long + small { -webkit-line-clamp: 1; }
    .cs-open small { font-size: 12.5px; line-height: 1.5; opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cs-act   { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; margin-top: 8px; pointer-events: auto; }
    .cs-go    { font-size: 13px; font-weight: 700; color: var(--a); background: #fff; border-radius: 99px; padding: 5px 16px; text-decoration: none; }
    .cs-act .ex-add { margin: 0; color: #fff; border-color: rgba(255,255,255,.6); }
    .cs-soon  { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 99px; padding: 3px 12px; }
    .cs-card.is-on .cs-hit { display: var(--hit-on, block); }
    .cs-more  { position: absolute; top: 50%; z-index: 60; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
                border: 0; background: var(--surface, #fff); color: var(--c-ink); font: inherit; font-size: 12px; font-weight: 700;
                box-shadow: 0 4px 14px -6px rgba(0,0,0,.35); cursor: pointer; }
    .cs-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c-ink-soft); font-size: 14px; }
    .cs-tools { margin: 4px 0 8px; position: relative; z-index: 2; }   /* لوحةُ الفلاتر فوق الأوراق */
    .cs-meta  { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 22px; margin-bottom: 2px; }
    .cs-count { font-size: 12.5px; color: var(--c-ink-soft); }
    .cs-acts  { display: flex; flex-wrap: wrap; gap: 6px; }
    #cs-fp .fchips { display: flex; flex-wrap: wrap; gap: 6px; }
    #cs-fp .fchip:disabled { opacity: .4; cursor: default; }

       مقيستان: أقلُّ تعتيمٍ يَعبُر ‎4.5:1‎ بهذا الحبر. */
    :root {
      --pnl-pad: clamp(16px, 3vw, 32px);
      --glass:      #f1f0ee;
      --glass-mix:  54%;   /* أصفى، لأنّ الحبرَ اشتدّ — والبوّابةُ ما زالت 4.5 */
      --glass-ink:  #1b1a18;
      --glass-edge: rgba(255,255,255,.85);
      --glass-cast: rgba(0,0,0,.10);
    }
    html[data-theme="dark"] {
      --glass:      #252525;
      --glass-mix:  63%;
      --glass-ink:  #ffffff;
      --glass-edge: rgba(255,255,255,.09);
      --glass-cast: rgba(0,0,0,.30);
    }

    /* ===== شريطُ تمرير الصفحة: حبرٌ لا بترول =====
       ‎#xthumb‎ شريطٌ مبنيٌّ في ‎shared/styles.css‎ — بترولُ الهويّة فيه
       صريحٌ ومُعادٌ في جلدٍ داكن. والملفُّ مشتركٌ مع المسلخ فلا يُمَسّ:
       يُغطّى من ههنا وحدَه. والتخصيصُ ‎#xscroll #xthumb‎ ليغلب
       ‎html[data-theme="dark"] #xthumb‎، فالأخيرُ أعلى من معرّفٍ وحده.
       وحبرٌ شفّافٌ لا لونٌ جامد: يُظلم على الفاتح ويُضيء على الداكن
       بقاعدةٍ واحدةٍ لا بقاعدتين. */
    #xscroll #xthumb { background: color-mix(in srgb, var(--glass-ink) 40%, transparent); }
    #xscroll #xthumb:hover  { background: color-mix(in srgb, var(--glass-ink) 60%, transparent); }
    #xscroll #xthumb:active { background: color-mix(in srgb, var(--glass-ink) 76%, transparent); }
    /* وشريطُ صفّ التخصّصات في «تصنيفات» يتبع شريطَ الصفحة ههنا: حبرٌ لا بترول */
    html:root:root .fcol-bar i { background: color-mix(in srgb, var(--glass-ink) 40%, transparent); }
    html:root:root .fcol-bar i:hover { background: color-mix(in srgb, var(--glass-ink) 60%, transparent); }
    html:root:root .fcol-bar.is-drag i { background: color-mix(in srgb, var(--glass-ink) 76%, transparent); }
    #xscroll #xup, #xscroll #xdown { color: color-mix(in srgb, var(--glass-ink) 45%, transparent); }
    #xscroll #xup:hover, #xscroll #xdown:hover { color: var(--glass-ink); }
    /* وشريطُ اللوح نفسِه إن فاض محتواه — بتروليٌّ كذلك في المشترك */
    html .sidebar { scrollbar-color: color-mix(in srgb, var(--glass-ink) 34%, transparent) transparent; }
    html .sidebar::-webkit-scrollbar-thumb {

    html .sidebar::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--glass-ink) 54%, transparent); background-clip: padding-box; }
  </style>

  <div class="mmodal dpk" id="dpk-modal" hidden>

  <div class="mmodal" id="card-modal" hidden>
    <!-- دُرج البطائق: طبقةٌ علويّة تمتدّ على عرض الشاشة كلّه فوق الشريط الجانبيّ —
         ابنٌ للنافذة لا للمسرح، وإلّا تقيّد بعرضه. زرُّ سحبه أيقونةٌ وحدها متدلّيةٌ من حافّته -->
    <div class="cd-dw" id="cd-drawer">
      <div class="cd-dw__tray">
        <!-- النوع أوّل قرار: البطائق الأربع مفروشةً في الدُّرج -->
        <div class="cd-types" id="cd-types" role="group" aria-label="نوع البطاقة"></div>
      </div>
      <!-- ===== صفُّ الحافّة: المِقبضُ ثمّ ألسنةُ المطويّات إلى يساره =====
           الصفُّ متوسّطٌ في عرض الشاشة، فكلّما نزل لسانٌ **يسارَ** المِقبض انزاح المِقبضُ
           يمينًا وبقي الكلُّ متوسّطًا — لا يُدفع من مكانه بل يقتسم الوسطَ مع ما جاوره -->
      <div class="cd-dwrow">
        <button type="button" class="cd-dw__handle" id="cd-handle" aria-expanded="false"></button>
        <div class="cd-mins" id="cd-mins"></div>
        <!-- الموازن: فراغٌ خاوٍ في ذيل الصفّ عرضُه (عرض «+» + الفُرجة). الصفُّ يقتسم وسطَه
             معه فينزاح، فيستقرّ مركزُ **الألسنة** على مركز الشاشة ويقف «+» على طرفها —
             فلا ترقص الألسنةُ كلّما فُتحت نافذةٌ أو طُويت. وهو فراغٌ لا ‎transform‎:
             المتحوَّلُ يصير جذرَ خلفيّةٍ فيموت الضبابُ في أبنائه -->
        <i class="cd-bal"></i>
      </div>
    </div>

    <!-- لكلّ نافذةٍ طبقتُها: صفيحةٌ مطلقةٌ تملأ الشاشة وتتوسّط ما فيها. ولولاها لَاصطفّت
         النوافذُ جنبًا إلى جنبٍ في صفّ النافذة الأمّ المرن بدل أن تتراكب — فتوسيطُ
         الواحدة يستقيم في صفٍّ، وتوسيطُ اثنتين في **الموضع نفسِه** لا يستقيم إلّا بطبقتين.
         والصفيحةُ لا تلتقط المؤشّر (‎pointer-events:none‎) وإلّا حجبت العتمةَ التي تُغلق بها -->
    <div class="cd-layer">
    <!-- ثلاثة أسطحٍ مستقلّة على مسرحٍ واحد: منتقي النوع · البطاقة · الوجهة.
         لا شريطَ أدواتٍ ثابت — فقاعةُ التحديد تنوب عنه، فتبقى البطاقة بطاقةً -->
    <div class="cd-stage">
      <div class="mmodal__card mmodal__card--md" id="cd-card">
        <!-- الترويسة العليا: من صنعها · نسختها · من عندها الآن · زياراتها.
             وأزرارُ النافذة (✕ · تكبير · نافذة مستقلّة) بُنيت داخلها في ‎renderCardDlg‎
             لا هنا: لتقع على خطّ ما فيها من أيقونات بمحاذاةٍ واحدة مهما تبدّل ارتفاعُه -->
        <div class="cd-meta" id="cd-meta"></div>

        <!-- كل حقل ونتوؤه: الأيقونة لسانٌ بارز فوق مستطيل النصّ لا تسمية عائمة فوقه -->
        <div class="cd-body">
          <div class="cd-field">
            <p class="cd-flab" id="cd-front-lab"></p>
            <!-- مِسطرةُ التقريب: تقرأ ما تفعله أصابعُك وتُعدَّل منها. وترتيبُها في السطر
                 ترتيبُ الكتابة: «‎−‎» أوّلًا فتقع يمينَ الرقم، و«‎+‎» آخرًا فتقع يسارَه.
                 وهي أختُ الحقل لا ابنتُه، فلا يبلغها التقريبُ ولا تصغر معه -->
            <span class="cd-zbar">
              <button type="button" class="cd-zb" data-zs="-1">−</button>
              <b class="cd-zval">100%</b>
              <button type="button" class="cd-zb" data-zs="1">+</button>
            </span>
            <div class="cd-in" id="cd-front" contenteditable="true"></div>
          </div>
          <div class="cd-field">
            <p class="cd-flab" id="cd-back-lab"></p>
            <div class="cd-in" id="cd-back" contenteditable="true"></div>
          </div>
        </div>

        <!-- الترويسة السفليّة: وجهةُ البطاقة وزرُّ نشرها — الزرُّ يمينًا والمسارُ يسارًا،
             تصلهما شَرَطاتٌ تمرّ خلف مستطيل المسار. وكان الرصيفُ سطحًا مستقلًّا تحت النافذة
             يصله خيطٌ رأسيّ، فصار الكلُّ جسمًا واحدًا -->
        <div class="cd-foot" id="cd-foot"></div>
      </div>

      <!-- مقابضُ التوسيع الثمانية: أطرافٌ على حوافّ المسرح لا على البطاقة — المسرحُ هو
           الصندوقُ الذي يُقاس ويُوسَّع، والبطاقةُ تملؤه. و‎ex/ey‎ الطرفُ المشدود:
           ‎-1‎ يسارٌ أو أعلى · ‎+1‎ يمينٌ أو أسفل — بالجهات المرئيّة لا المنطقيّة،
           فمؤشّرُ التوسيع نفسُه مرئيٌّ لا ينقلب بانقلاب الكتابة -->
      <i class="cd-rz cd-rz--t" data-ey="-1"></i>
      <i class="cd-rz cd-rz--b" data-ey="1"></i>
      <i class="cd-rz cd-rz--l" data-ex="-1"></i>
      <i class="cd-rz cd-rz--r" data-ex="1"></i>
      <i class="cd-rz cd-rz--tl" data-ex="-1" data-ey="-1"></i>
      <i class="cd-rz cd-rz--tr" data-ex="1" data-ey="-1"></i>
      <i class="cd-rz cd-rz--bl" data-ex="-1" data-ey="1"></i>
      <i class="cd-rz cd-rz--br" data-ex="1" data-ey="1"></i>
    </div>
    </div>
    <!-- فقاعة التنسيق: تُلحق بالمسرح لا بالبطاقة كي لا يمحوها إعادةُ الرسم -->
    <div class="cd-bub" id="cd-bub" hidden></div>
  </div>

  <!-- ===== نافذة «الدورة» — مُشغّلُ رزمة الشروح =====
       ترويستُها غلافُ الدورة يمينًا واسمُها يساره. وجوفُها نصفان: المستطيلُ الكبير فيه
       الشرحُ الجاري، ويساره شجرةُ الدورة بمجلداتها كمسارٍ يُنتقل فيه. -->
  <div class="mmodal" id="vw-modal" hidden>
    <div class="mmodal__card mmodal__card--course vw-card">
      <div class="mmodal__head vw-head">
        <!-- والغلافُ حاملُ توكناتٍ كذلك: هو خارج ‎.vw-body‎ فلا يبلغه حاملُها،
             و‎.x3-art‎ تقرأ ‎--u-*‎ — فيلبس ‎vw-tok‎ ويذوب بها -->
        <span class="vw-art vw-tok" id="vw-art"></span>
        <h3 class="mmodal__title" id="vw-title"></h3>
        <button class="mmodal__close" id="vw-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <!-- حاملُ التوكنات: يذوب بـ‎display: contents‎ فلا يُغيّر تخطيطَ الشبكة -->
      <div class="vw-body"><span class="vw-tok">
        <div class="vw-main" id="vw-main"></div>
        <aside class="vw-side" id="vw-side"></aside>
      </span></div>
    </div>
  </div>

  <!-- ===== نافذة «استورد من المكتبة» =====
       بابان أوّلًا (الشروح · البطائق والملخصات)، ثمّ مساهماتُ القسم المختار **بواجهة
       المكتبة نفسِها**: ‎#cm-ui‎ يُنقل إلى جوفها كما يُنقل إلى رفّ الموارد، فلا يُبنى
       عارضٌ ثانٍ ولا تُنسخ دالّةُ عرضٍ واحدة. وبابُ الرجوع في ترويستها يردّك إلى البابين -->
  <div class="mmodal" id="jri-modal" hidden>
    <div class="mmodal__card mmodal__card--course jri-card">
      <div class="mmodal__head">
        <button class="jri-back" id="jri-back" type="button" hidden></button>
        <h3 class="mmodal__title" id="jri-title"></h3>
        <button class="mmodal__close" id="jri-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="jri-body" id="jri-body"></div>
      <!-- الرصيف: خبرُ ما حدَّدتَ، ثمّ وجهتُه في رحلتك، ثمّ فعلُ الاستيراد.
           وهو قائمٌ من أوّل فتحةٍ — قبل الدخول من أيّ باب — ليُعرف أنّ للنافذة مقصدًا -->
      <div class="jri-dock" id="jri-dock"></div>
    </div>
  </div>

  <!-- نافذة إعدادات الترم (الاسم + التواريخ + حذف) — نفس ثيم الجامعة -->
  <div class="mmodal" id="date-modal" hidden>
    <div class="mmodal__card mmodal__card--sm">
      <div class="mmodal__head">
        <h3 class="mmodal__title" id="dm-title">إعدادات الترم</h3>
        <button class="mmodal__close" id="dm-close" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="dm-body">
        <label class="dm-field">
          <span id="dm-name-label">اسم الترم</span>
          <input type="text" id="dm-name">
        </label>
        <!-- ‏‎type="text" readonly‎ لا ‎type="date"‎: القيمةُ تبقى ‎ISO‎ كما كانت
             (‎.value‎ يُقرأ ويُكتب في المواضع نفسِها بلا تبديل)، والمنعُ لئلّا يفتح
             المتصفّحُ منتقيَه فوق منتقينا. و‎inputmode="none"‎ تكفّ لوحةَ الهاتف. -->
        <label class="dm-field">
          <span id="dm-start-label">تاريخ البداية</span>
          <input type="text" id="dm-start" class="dm-date" readonly inputmode="none" placeholder="—">
        </label>
        <label class="dm-field">
          <span id="dm-end-label">تاريخ النهاية</span>
          <input type="text" id="dm-end" class="dm-date" readonly inputmode="none" placeholder="—">
        </label>
        <!-- مواد الترم: تُعرض هنا ويمكن حذفها -->
        <div class="dm-courses">
          <p class="dm-courses__t"><span id="dm-courses-label">مواد الترم</span><b id="dm-courses-n">0</b></p>
          <div class="dm-courses__list" id="dm-courses"></div>
        </div>
      </div>
      <!-- ولا زرَّ حفظ: كلُّ ما في النافذة يقع فورَ وقوعه، كما كانت
           المادّةُ تُحذف من قائمتها ههنا من قبل -->
      <div class="dm-actions">
        <button class="dm-del" id="dm-delete" type="button">حذف الترم</button>

  <!-- شريط التحديد في محرّر «البطائق» (ROADMAP-SELBAR — اتّجاه أ «الحبّة»):
       يظهر حين تُحدَّد بطائقُ أو مجلدات، ويملؤه cxBarPaint. ابنُ الجسم لا ابنُ اللوح
       ليبقى وأنت تمرّر، وخارجُ #cm-ui كي لا يمحوه إعادةُ رسم الواجهة -->
  <div class="cx-selbar" id="cx-selbar" hidden></div>

  <!-- منتقي ملف الصورة (مخفي، يُستدعى من مربّع صورة المادة) -->
  <input type="file" id="imgpick" accept="image/*" hidden>

  <script>
    // تبديل التابات الأربعة — والمستمعُ على الشريط لا على مجموعةٍ منه:
    // ‏querySelector('.tabs') يمسك الأولى وحدَها، فلا تصل ضغطةُ المجموعة الثانية.
    document.getElementById('sidebar').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]'); if (!b) return;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('is-active', x === b));
      document.getElementById('side-profile').classList.remove('on');   // مغادرة لوحة الحساب
      document.getElementById('panel-account').hidden = true;
      // الركنُ للأعضاء: الزائرُ يُصرف إلى لوحٍ يقول له ما فيه ولا يبني ما لا يبقى له.
      // والحارسُ ههنا لا في app.js لأنّ هذا هو المستمعُ الذي يفتح الألواح.
      /* ===== «الركن» في الجذر غيرُه في المسلخ =====
         ههنا هو **الركنُ العامّ**: كلُّ مجتمعاتك وكتبك معًا. وشكلُه لم
         يُقرَّر، فيُحجز مكانُه بمساحةٍ رماديّة. وركنُك في مجتمعٍ بعينه
         يُفتح من اسمه في الدرج تحته، وذاك هو ‎panel-library‎ الحقيقيّ. */
      const toSoon = b.dataset.tab === 'library';
      document.getElementById('panel-nook-soon').hidden = !toSoon;
      document.getElementById('panel-nook-lock').hidden = true;
      document.getElementById('panel-explore').hidden = b.dataset.tab !== 'explore';
      document.getElementById('panel-market').hidden  = b.dataset.tab !== 'market';
      document.getElementById('panel-library').hidden = true;
      document.getElementById('panel-past').hidden    = b.dataset.tab !== 'past';
      document.getElementById('panel-stats').hidden   = b.dataset.tab !== 'stats';
      // واللوحان يُبنيان عند فتحهما لا في كل إقلاع: حسابٌ يمشي في بياناتك كلها ولا يُنظر كل مرة
      if (b.dataset.tab === 'past'  && window.acPastPaint)  window.acPastPaint();
      if (b.dataset.tab === 'stats' && window.acStatsPaint) window.acStatsPaint();
    });

    /* ===== مُستقَرُّ الجذر =====
       المحرّكُ مشتركٌ، وفيه «العودةُ إلى المكتبة» بعد الخروج من الحساب أو
       حذفه. فلا يُعدَّل من أجل موقعٍ واحد: يُرصد كشفُ لوحِ المكتبة، فإن
       كُشف رُدّ القصدُ إلى «استكشاف». رقابةٌ على الأثر لا جراحةٌ في المصدر. */
    (function () {
      var mk = document.getElementById('panel-market');
      var ex = document.getElementById('panel-explore');
      function toExplore() {
        ['panel-market', 'panel-library', 'panel-past', 'panel-stats',
         'panel-nook-lock', 'panel-account'].forEach(function (id) {
          var p = document.getElementById(id); if (p) p.hidden = true;
        });
        ex.hidden = false;
        var ch = document.getElementById('com-head'); if (ch) ch.hidden = true;
        document.querySelectorAll('.tabs button').forEach(function (x) {
          x.classList.toggle('is-active', x.dataset.tab === 'explore');
        });
      }
      new MutationObserver(function () { if (!mk.hidden && !inCom) toExplore(); })
        .observe(mk, { attributes: true, attributeFilter: ['hidden'] });

      /* والمحرّكُ لا يعرف هذا التابَ فلا يترجمه: يتبع لغةَ الصفحة من ههنا */
      var T = { tab:['استكشاف','Explore'], h1:['مجتمعات','Communities'],
                s1:['لكل مجتمع أهله ومكتبته.','Each community has its own people and library.'],
                soon:['قريبا','Soon'], empty:['لم يفتح هذا الرف بعد.','This shelf is not open yet.'],
                add:['أضف المجتمع','Add community'], added:['مضاف','Added'],
                page:['صفحة المجتمع','Community page'], soonN:['ركني','My nook'] };
      function lang() { return document.documentElement.getAttribute('data-lang') === 'en' ? 1 : 0; }

      /* الرفوف: جدولٌ واحدٌ يُقرأ، فزيادةُ رفٍّ سطرٌ فيه لا قسمٌ في الصفحة.
         و«كتب أكاديميّة» وحدَه مملوء — كتبُه من المسلخ، ولذلك تحت كلِّ كتابٍ
         دائرتُه واسمُه. وما سواه رفٌّ موعودٌ يُعرض خاويًا ولا يُخترع له كتب. */
      var SHELVES = [
        { ar:'كتب أكاديمية', en:'Academic books', com:0 },
        { ar:'كتب ثقافية',   en:'Culture books' },
        { ar:'روايات',       en:'Novels' },
        { ar:'كتب إسلامية',  en:'Islamic books' }
      ];
      function label() {
        var i = lang();
        document.getElementById('tab-explore-tx').textContent = T.tab[i];
        document.getElementById('ex-h').textContent   = T.h1[i];
        document.getElementById('ex-sub').textContent = T.s1[i];
        document.getElementById('soon-tx').textContent     = T.soonN[i];
        document.getElementById('com-add-tx').textContent  = T.add[i];
        document.getElementById('com-open-tx').textContent = T.page[i];
        /* ومن كان داخل مجتمعٍ يتبدّل اسمُه معه ولا ينتظر خروجَه */
        if (curCom) document.getElementById('com-name').textContent = i ? curCom.en : curCom.ar;
      }

      /* ===== دُرجُ «مجتمعاتي» في الشريط =====
         ما يُضيفه المستخدمُ يسكن تحت «الركن». والسهمُ لا يُعرض إلّا إذا كان
         تحته شيء: سهمٌ يَفتح فراغًا وعدٌ كاذب. */
      function paintMine() {
        var list = mine().map(comById).filter(Boolean);
        var i = lang();
        var box = document.getElementById('nook-coms');
        var tw  = document.getElementById('nook-twist');
        box.innerHTML = list.map(function (c) {
          return '<button class="nook-com" type="button" data-open="' + c.id + '">' +
                 '<i style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')"></i>' +
                 '<span>' + esc(i ? c.en : c.ar) + '</span></button>';
        }).join('');
        tw.hidden = !list.length;
        if (!list.length) setNook(false);
        else if (!box.hidden) setNook(true);   /* والكتلةُ تبقى مطبوعةً بعد إعادة البناء */
        /* وأزرارُ «استكشاف» تُرى حالتُها: ‎+‎ صار ‎✓‎ لِما أُضيف */
        document.querySelectorAll('#ex-coms .ex-add[data-mine]').forEach(function (b) {
          var on = isMine(b.dataset.mine);
          b.classList.toggle('is-in', on);
          b.textContent = on ? '✓' : '+';
          b.title = on ? 'مضاف — اضغط للإزالة' : 'أضف المجتمع';
        });
        var ca = document.getElementById('com-add');
        if (ca && curCom) {
          var on2 = isMine(curCom.id);
          ca.querySelector('.com-plus').textContent = on2 ? '✓' : '+';
          document.getElementById('com-add-tx').textContent = on2 ? T.added[lang()] : T.add[lang()];
        }
      }

      /* فتحُ الكتلة وطيُّها — من الترويسة وحدَها.
         وقاعدتُها: إن لم يكن الركنُ هو النشِط فالضغطةُ قصدُ دخولٍ، فتُفتح
         دائمًا؛ وإن كان نشطًا فالضغطةُ قصدُ تبديلٍ، فتُقلب. و‎is-active‎
         ههنا هي حالُ ما قبل الضغطة: مستمعُ الألواح معلَّقٌ على ‎#sidebar‎
         فيأتي بعد هذا في مسار الفقاعة. */
      function setNook(open) {
        document.getElementById('nook-coms').hidden = !open;
        document.getElementById('nook-block').classList.toggle('is-open', open);
        document.getElementById('nook-head').setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      document.getElementById('nook-head').addEventListener('click', function () {
        if (document.getElementById('nook-twist').hidden) return;   /* لا جوفَ يُفتح */
        var shut   = document.getElementById('nook-coms').hidden;
        /* وأنت في ركن مجتمعٍ بعينه، «الركن» خروجٌ منه إلى ركنك العامّ —
           قصدُ انتقالٍ لا قصدُ طيّ. فلا تُطوى الكتلةُ تحتك وأنت تغادرها. */
        var inside = !!document.querySelector('.nook-com.is-on');
        setNook((this.classList.contains('is-active') && !inside) ? shut : true);
      });
      /* ودخولُ مجتمعٍ من الدرج كدخوله من بطاقته سواءً */
      document.getElementById('nook-coms').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-open]'); if (!b) return;
        var c = comById(b.dataset.open); if (c) openCom(c, 'nook');
      });
      /* وزرُّ الإضافة — في البطاقة وفي الغلاف — يُبدّل العضويّة */
      document.getElementById('panel-explore').addEventListener('click', function (e) {
        var b = e.target.closest('.ex-add[data-mine]'); if (!b) return;
        e.preventDefault(); e.stopPropagation();
        toggleMine(b.dataset.mine);
      });
      document.getElementById('com-add').addEventListener('click', function () {
        if (curCom) toggleMine(curCom.id);
      });

      function paint() {
        label(); cfApply(true); buildShelves(); paintMine();
        /* الأسهمُ تُعلَّق على ما لم يُعلَّق عليه بعد: الرفوفُ تُبنى من جديدٍ
           عند تبديل اللغة، فلولا العلامةُ لتضاعفت أزرارُها */
        document.querySelectorAll('#panel-explore .ex-wrap').forEach(function (w) {
          if (w.dataset.nav) return; w.dataset.nav = '1'; wireNav(w);
        });
      }
      new MutationObserver(paint).observe(document.documentElement,
        { attributes: true, attributeFilter: ['data-lang'] });


      /* ===== الصفّان =====
         أغلفةُ المجتمعات تدرّجٌ ولونٌ لكلّ واحد وعليه اسمُه — لا صورةً
         مرفوعة. والتدرّجُ هو كذلك لونُ النقطة تحت الكتاب ونقطةِ الدرج،
         فهو مذكورٌ مرّةً ويُقرأ في ثلاثة مواضع. والكتبُ أغلفتُها موجودةٌ
         أصلًا في ‎shared/covers.js‎ — تُقرأ منه فلا تُكتب القائمةُ مرّتين. */
      /* المصدرُ ‎shared/communities.js‎ (‎ROADMAP-EXPLORE س١‎). والقائمةُ ههنا احتياطٌ لو تعطّل
         تحميلُه — فلا تخلو «استكشاف» ولا يسقط ما يقرأ ‎COMS‎ (الدرجُ والركنُ العامّ) */
      var COMS = (Array.isArray(window.AC_COMS) && window.AC_COMS.length) ? window.AC_COMS : [
        { id:'maslakh',  ar:'المسلخ',  en:'Almaslakh',  href:'../Almaslakh/', a:'#0e3b41', b:'#1f7a85' },
        { id:'mudarraj', ar:'المدرج',  en:'Almudarraj', href:'../Almudarraj/', a:'#0a4a6c', b:'#1a8abe' },
        { id:'hive',     ar:'الخلية',  en:'The Hive',   href:'../TheHive/',    a:'#3d0a5c', b:'#660099' }
      ];

      /* ===== مجتمعاتي =====
         قائمةُ معرّفاتٍ لا أكثر — بضعةُ بايتاتٍ في درجٍ خاصٍّ بها، فلا تزاحم
         درجَ الموقع الثقيل. وهي اليومَ في المتصفّح وحده: لا نقطةَ في الخادم
         تحفظها بعد، فمتى صارت نُقلت إلى الحساب فتتبعك بين أجهزتك. */
      var MINE_K = 'academia2:coms:v1';
      function mine() {
        try { var a = JSON.parse(localStorage.getItem(MINE_K) || '[]'); return Array.isArray(a) ? a : []; }
        catch (e) { return []; }
      }
      function mineSet(a) { try { localStorage.setItem(MINE_K, JSON.stringify(a)); } catch (e) {} }
      function isMine(id) { return mine().indexOf(id) >= 0; }
      function toggleMine(id) {
        var a = mine(), i = a.indexOf(id);
        if (i >= 0) a.splice(i, 1); else a.push(id);
        mineSet(a); paintMine();
        if (CF.mine) cfApply(true);   /* فلترُ «مجتمعاتي» يتبع الإضافةَ والإزالة فورًا */
      }
      function comById(id) {
        for (var i = 0; i < COMS.length; i++) if (COMS[i].id === id) return COMS[i];
        return null;
      }
      /* زرُّ الكتاب بلا معرّف: لم يُقرَّر بعدُ ما يفعله، فيبقى ساكنًا */
      var PLUS = '<button class="ex-add" type="button" title="أضف">+</button>';
      function plusFor(id) {
        var on = isMine(id);
        return '<button class="ex-add' + (on ? ' is-in' : '') + '" type="button" data-mine="' + id +
               '" title="' + (on ? 'مضاف — اضغط للإزالة' : 'أضف المجتمع') + '">' + (on ? '✓' : '+') + '</button>';
      }

      function esc(t) { return String(t).replace(/[&<>"]/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

      /* ===== أوراقُ المجتمعات (‎ROADMAP-EXPLORE س٢‎) =====
         ‎CS.list‎ فهارسُ ما يُعرض (بعد البحث والفلاتر)، و‎CS.sel‎ موضعُ المقدّمة فيها.
         الضغطةُ الأولى على ورقةٍ تقدّمها، والثانيةُ تفتح مجتمعَها. */
      var LOGO = '../assets/brand/';
      var CS = { list: COMS.map(function (_, k) { return k; }), sel: 0 };
      function csNote(i) { return T.soon[i]; }
      function buildComs() {
        var i = lang(), box = document.getElementById('ex-coms');
        if (!CS.list.length) { box.innerHTML = '<div class="cs-empty">' + esc(i ? 'No community by that name.' : 'ما لقينا مجتمعا بهذا الاسم.') + '</div>'; return; }
        if (CS.sel >= CS.list.length) CS.sel = 0;
        box.innerHTML = CS.list.map(function (ci) {
          var c = COMS[ci], nm = i ? c.en : c.ar, org = c.org ? (i ? c.org.en : c.org.ar) : '';

         وبالإنجليزيّة: الكودُ اللاتينيُّ كما هو — «ACCT 300».
         والقاعدةُ ليست من عندي: هي ‎arShort‎ في المحرّك بعينها، وجدولُها
         ‎DEPT_AR‎ في ‎shared/courses.js‎ — فيُسمّى الكتابُ ههنا كما يُسمّى في
         المكتبة سواءً، ولا ينشقّ اسمٌ عن اسم. */
      function codeLabel(code, i) {
        if (i) return code;                       /* الإنجليزيّةُ هي الكود */
        var sp = code.indexOf(' ');
        if (sp < 1 || typeof DEPT_AR === 'undefined') return code;
        var d = DEPT_AR[code.slice(0, sp)];
        return d ? d + ' ' + code.slice(sp + 1) : code;
      }
      /* والاسمُ الكاملُ تلميحًا عند المرور، من جدول المواد إن كان فيه */
      var FULL = null;
      function fullName(code) {
        if (FULL === null) {
          FULL = {};
          if (typeof COURSES !== 'undefined') {
            COURSES.forEach(function (c) { FULL[c.code] = c.ar || ''; });
          }
        }
        return FULL[code] || '';
      }

      function bookCards(sh) {
        if (sh.com === undefined || typeof COVERS === 'undefined') {
          var ph = '<div class="ex-card is-ph"><div class="ex-cover">' +
                   '<svg viewBox="-155 57.49 310 244.51" fill="currentColor" aria-hidden="true">' +

                   'A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z"/></svg></div></div>';
          return new Array(7).join('|').split('|').map(function () { return ph; }).join('');

        var own = ownOf(sh.com), i = lang();
        /* والرفُّ يَتبع مِصفاةَ العرض نفسَها (‎shared/courses.js‎). وما سُمح

        var only = (Array.isArray(window.AC_ONLY) && window.AC_ONLY.length) ? window.AC_ONLY : null;
        var codes = only ? only.slice() : Object.keys(COVERS);

        }).join('');

      /* سهما التمرير: الاتّجاهُ يُؤخذ من الصفحة لا يُفترض — ‎scrollLeft‎ يسير
         بالسالب في العربيّة، فالحسابُ بالقيمة المطلقة والإشارةُ من الجهة. */
      function wireNav(wrap) {
        var strip = wrap.querySelector('.ex-strip');
        var mk = function (cls, d) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'ex-nav ' + cls;
          b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
                        'stroke-linecap="round" stroke-linejoin="round"><path d="M' +
                        (d < 0 ? '15 5l-7 7 7 7' : '9 5l7 7-7 7') + '"/></svg>';
          b.addEventListener('click', function () {
            var rtl = getComputedStyle(strip).direction === 'rtl';
            strip.scrollBy({ left: d * strip.clientWidth * 0.85 * (rtl ? -1 : 1), behavior: 'smooth' });
          });

        var prev = mk('ex-nav--s', -1), next = mk('ex-nav--e', 1);
        function upd() {
          var x = Math.abs(strip.scrollLeft);
          var max = strip.scrollWidth - strip.clientWidth - 2;
          prev.hidden = x <= 12;
          next.hidden = x >= max - 12 || max <= 0;
        }
        strip.addEventListener('scroll', upd);
        window.addEventListener('resize', upd);
        setTimeout(upd, 60);
      }

      /* ===== الدخولُ إلى مجتمع =====
         الجذرُ بلا مكتبةٍ خاصّةٍ به، ومكتبةُ المجتمع تُفتح داخلَه لا بالانتقال
         إلى موقعٍ آخر: يُكشف رأسُ المجتمع ثمّ لوحُ المكتبة كما هو — بحثُه
         وتصنيفاتُه وتاباتُ المادّة من «المادّة» إلى «البطاقات والملخّصات».
         ولا يُبنى شيءٌ من جديد، فما بُني مرّةً لا يُكتب مرّتين. */
      var inCom = false, curCom = null;
      /* المُمَرَّرُ في هذه الصفحة هو ‎body‎ لا النافذة — قِيس فوُجد. فتُمسح
         الثلاثةُ معًا، إذ تختلف بين المتصفّحات وبين أوضاع الصفحة. */

      function openCom(c, mode) {

           والمدرجُ موقعٌ منفصلٌ بجداوله ودرجه (‎platform/com.js‎)، فيُذهب إليه ولا
           يُفتح ههنا، وإلّا لبست موادُّ المسلخ اسمَ المدرج (ROADMAP-MUDARRAJ) */
        if (c.id !== 'maslakh') { if (c.href) location.href = c.href; return; }

        document.getElementById('com-open').href = c.href;
        /* ورأسُ المجتمع يلبس تدرّجَه — هو عينُ تدرّجِ بطاقته في الصفّ،

        document.getElementById('com-cover').style.background =

        document.getElementById('com-name').textContent = lang() ? c.en : c.ar;
        /* ولا غلافَ فوق الركن: الأترامُ أوّلَ ما تقع عليه العين. والغلافُ
           لمكتبة المجتمع وحدها، وموضعُك معلومٌ من الدرج المضيء. */
        document.getElementById('com-head').hidden = nook;
        paintMine();
        ex.hidden = true;
        document.getElementById('panel-nook-soon').hidden = true;
        document.getElementById('panel-account').hidden = true;
        mk.hidden = nook;
        /* والركنُ للأعضاء: الزائرُ يُصرف إلى لوحه كما يصنع تابُ الركن */
        var guest = window.acIsGuest && window.acIsGuest();

      /* الرجوعُ واحدٌ سواءٌ جاء من الزرّ أو من زرّ المتصفّح */
      function closeCom(fromPop) {

        document.getElementById('com-head').hidden = true;
        mk.hidden = true;
        document.getElementById('panel-library').hidden   = true;
        document.getElementById('panel-nook-lock').hidden = true;
        document.querySelectorAll('.nook-com').forEach(function (x) { x.classList.remove('is-on'); });

      document.getElementById('panel-explore').addEventListener('click', function (e) {
        var a = e.target.closest('a[data-com]');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        openCom(COMS[+a.dataset.com]);
      });
      document.getElementById('com-back').addEventListener('click', function () { closeCom(false); });
      window.addEventListener('popstate', function () { closeCom(true); });
      /* ومغادرةُ المجتمع بتابٍ آخر مغادرةٌ أيضًا، وإلّا بقي الحارسُ معطَّلًا */
      document.getElementById('sidebar').addEventListener('click', function (e) {
        if (e.target.closest('button[data-tab]')) {
          inCom = false;
          document.getElementById('com-head').hidden = true;
        }
      });

      /* ===== الركنُ العامّ (م٢ب · الشكل «أ» · ROADMAP-MUDARRAJ) =====
         ركنُك في كلّ مجتمعٍ يُقرأ من خادمه هو: ‎/api/udoc?kind=nook‎ للمسلخ، ومع
         ‎&com=mudarraj‎ لجداول المدرج. ولا يُكتب منه شيء — هو مرآة: ضغطةُ الكتاب
         تفتح ركنَه في موقعه، والتعديلُ هناك. فلا يختلط ركنٌ بركن.
         ويُتحقّق من ترويسة ‎x-com‎ في كلّ ردّ: ما لم يأتِ من جداول مجتمعه لا يُعرض. */
      /* والمجتمعاتُ المفتوحةُ وحدها (ما عليه «قريبًا» لا جداولَ له بعد) */
      var GN = { coms: COMS.filter(function (c) { return !c.soon && c.href; }).map(function (c) { return c.id; }), data: {}, at: 0, f: 'all' };
      var GN_T = { sub: ['ترماتك في كل المجتمعات. تضغط المادة فتنفتح في موقعها.', 'Your terms across communities. Tap a course to open it in its site.'],
                   all: ['الكل', 'All'], now: ['الترم الحالي', 'Current term'], past: ['الترمات السابقة', 'Past terms'],
                   none: ['ما عندك مواد بعد. افتح مجتمعا من «استكشاف» وأضف ترمك.', 'No courses yet. Open a community from Explore and add your term.'],
                   out: ['ركنك للأعضاء. سجل دخولك ويطلع لك ركنك من كل المجتمعات.', 'Sign in to see your nook from every community.'],
                   err: ['تعذر الوصول إلى ', 'Could not reach '], load: ['يحمل…', 'Loading…'] };
      function gnTok() { try { return localStorage.getItem('academia2:tok:user') || ''; } catch (e) { return ''; } }
      function gnFetch(id) {
        var u = '/api/udoc?kind=nook' + (id === 'maslakh' ? '' : '&com=' + id);
        return fetch(u, { cache: 'no-store' }).then(function (r) {
          if (r.status === 401) return { out: 1 };
          var xc = r.headers.get('x-com');
          if (!r.ok || xc !== id) return { err: 1 };
          return r.json().then(function (j) { return { nook: (j && j.data) || null }; });
        }).catch(function () { return { err: 1 }; });
      }
      /* أسماءُ الموادّ: لكلّ مجتمعٍ كتالوجُه في درجه (المدرجُ يكتبه في ‎academia2:mudarraj:‎) */
      function gnCat(id) {
        if (GN.cats && GN.cats[id]) return GN.cats[id];
        var k = id === 'maslakh' ? 'academia2:catalog:v1' : 'academia2:' + id + ':catalog:v1', m = {};
        try { var c = JSON.parse(localStorage.getItem(k) || 'null');
              (c && c.courses || []).forEach(function (x) { m[x.code] = x; }); } catch (e) {}
        return m;
      }
      function gnCurrent(nk) {
        var ts = (nk && nk.terms) || [], d = (nk && nk.termDates) || {}, today = new Date().toISOString().slice(0, 10);
        for (var i = ts.length - 1; i >= 0; i--) {
          var x = d[ts[i]];
          if (x && x.s && x.e && x.s <= today && today <= x.e) return ts[i];
        }
        for (var j = ts.length - 1; j >= 0; j--) if (((nk.libs || {})[ts[j]] || []).length) return ts[j];
        return ts[ts.length - 1] || '';
      }
      function gnBook(c, code, cat, i) {
        var mas = c.id === 'maslakh', x = cat[code] || {};
        var nm = i ? code : (mas ? codeLabel(code, 0) : (x.ar || code));
        var full = x.full || (mas ? fullName(code) : '');
        var cov = mas && typeof COVERS !== 'undefined' && COVERS[code];
        var face = cov ? '<img loading="lazy" alt="' + esc(nm) + '" src="../' + cov + '">'
                       : '<span class="ex-noimg">' + esc(nm) + '</span>';
        return '<div class="ex-card" data-gn="' + c.id + '"' + (full ? ' title="' + esc(full) + '"' : '') + '>' +
               '<div class="ex-cover' + (cov ? '' : ' is-noimg') + '">' + face + '</div>' +
               '<div class="ex-cap"><b>' + esc(nm) + '</b></div>' +
               '<span class="ex-own"><i class="ex-dot" style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')"></i>' +
               '<span>' + esc(i ? c.en : c.ar) + '</span></span></div>';
      }
      function gnCount(n, i) {
        if (i) return n + (n === 1 ? ' course' : ' courses');
        return n === 1 ? 'مادة واحدة' : n === 2 ? 'مادتان' : n <= 10 ? n + ' مواد' : n + ' مادة';
      }
      function gnRender() {
        var i = lang(), body = document.getElementById('gn-body');
        document.getElementById('soon-tx').textContent = i ? 'My nook' : 'ركني';
        document.getElementById('gn-sub').textContent = GN_T.sub[i];
        var chips = document.getElementById('gn-chips');
        if (!gnTok() || GN.out) { chips.innerHTML = ''; body.innerHTML = '<p class="gn-msg">' + GN_T.out[i] + '</p>'; return; }
        if (!GN.at) { chips.innerHTML = ''; body.innerHTML = '<p class="gn-msg">' + GN_T.load[i] + '</p>'; return; }
        var coms = GN.coms.map(comById).filter(Boolean);
        chips.innerHTML = '<button type="button" class="gn-chip' + (GN.f === 'all' ? ' is-on' : '') + '" data-f="all">' + GN_T.all[i] + '</button>' +
          coms.map(function (c) {
            return '<button type="button" class="gn-chip' + (GN.f === c.id ? ' is-on' : '') + '" data-f="' + c.id + '">' +
                   '<i style="background:linear-gradient(135deg,' + c.a + ',' + c.b + ')"></i>' + esc(i ? c.en : c.ar) + '</button>';
          }).join('');
        var now = [], nowLbl = [], past = [], errs = [];
        coms.forEach(function (c) {
          if (GN.f !== 'all' && GN.f !== c.id) return;
          var r = GN.data[c.id] || {};
          if (r.err) { errs.push(i ? c.en : c.ar); return; }
          var nk = r.nook; if (!nk) return;
          var cat = gnCat(c.id), cur = gnCurrent(nk), libs = nk.libs || {}, d = nk.termDates || {};
          (libs[cur] || []).forEach(function (x) { if (x && x.code) now.push(gnBook(c, x.code, cat, i)); });
          if ((libs[cur] || []).length) nowLbl.push((i ? c.en : c.ar) + ' ' + cur);
          (nk.terms || []).forEach(function (t) {
            if (t === cur) return;
            var cs = (libs[t] || []).map(function (x) { return x && x.code; }).filter(Boolean);
            if (!cs.length) return;
            past.push({ c: c, t: t, cs: cs, s: (d[t] && d[t].s) || t });
          });
        });
        past.sort(function (a, b) { return a.s < b.s ? 1 : a.s > b.s ? -1 : 0; });
        var h = '';
        if (now.length) {
          h += '<section class="ex-row"><div class="ex-head"><h2 class="ex-h">' + GN_T.now[i] + '</h2>' +
               '<p class="ex-sub">' + esc(nowLbl.join(' · ')) + '</p></div>' +
               '<div class="ex-wrap"><div class="ex-strip ex-strip--books gn-strip">' + now.join('') + '</div></div></section>';
        }
        if (past.length) {
          h += '<section class="gn-past"><div class="ex-head"><h2 class="ex-h">' + GN_T.past[i] + '</h2></div>' +
               past.map(function (p) {
                 return '<button type="button" class="gn-row" data-gn="' + p.c.id + '">' +
                        '<i style="background:linear-gradient(135deg,' + p.c.a + ',' + p.c.b + ')"></i>' +
                        '<b>' + esc(p.t) + '</b><span>' + esc(p.cs.join(' · ')) + '</span>' +
                        '<em dir="' + (i ? 'ltr' : 'rtl') + '">' + gnCount(p.cs.length, i) + '</em></button>';
               }).join('') + '</section>';
        }
        if (!now.length && !past.length) h += '<p class="gn-msg">' + GN_T.none[i] + '</p>';
        if (errs.length) h += '<p class="gn-msg">' + GN_T.err[i] + esc(errs.join(' · ')) + '</p>';
        body.innerHTML = h;
        body.querySelectorAll('.ex-wrap').forEach(wireNav);
      }
      function gnPaint() {
        gnRender();
        if (!gnTok()) return;
        var t = Date.now(); if (t - GN.at < 15000) return;      /* لا يُسأل الخادمُ مع كلّ ضغطة */
        Promise.all(GN.coms.map(gnFetch)).then(function (rs) {
          GN.out = rs.some(function (r) { return r.out; });
          GN.coms.forEach(function (id, k) { GN.data[id] = rs[k]; });
          GN.at = Date.now(); gnRender();
          /* ومن لم يزر المجتمعَ في هذا المتصفّح لم يُخبَّأ كتالوجُه، فتسقط أسماءُ موادّه إلى
             الرمز الإنجليزيّ. فيُطلب مرّةً ويبقى في الذاكرة — لا يُكتب في درج المجتمع */
          GN.coms.forEach(function (id) {
            var nk = (GN.data[id] || {}).nook; if (!nk || id === 'maslakh') return;
            var cat = gnCat(id), miss = Object.keys(nk.libs || {}).some(function (t) {
              return (nk.libs[t] || []).some(function (x) { return x && x.code && !cat[x.code]; });
            });
            if (!miss) return;
            fetch('/api/catalog?com=' + id).then(function (r) {
              return r.ok && r.headers.get('x-com') === id ? r.json() : null;
            }).then(function (j) {
              if (!j || !Array.isArray(j.courses)) return;
              var m = {}; j.courses.forEach(function (x) { m[x.code] = x; });
              GN.cats = GN.cats || {}; GN.cats[id] = m; gnRender();
            }).catch(function () {});
          });
        });
      }
      document.getElementById('panel-nook-soon').addEventListener('click', function (e) {
        var ch = e.target.closest('.gn-chip');
        if (ch) { GN.f = ch.dataset.f; gnRender(); return; }

        var c = comById(b.dataset.gn); if (c) openCom(c, 'nook');

        var b = e.target.closest('button[data-tab]');
        if (b && b.dataset.tab === 'library') gnPaint();
      });
      new MutationObserver(function () { if (!document.getElementById('panel-nook-soon').hidden) gnRender(); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-lang'] });

      /* أيقونةُ «شريط جانبيّ»: مستطيلٌ وقسمةٌ على جهة الشريط — تُبدَّل ههنا
         لأنّ المحرّكَ الذي يبنيها مشتركٌ مع المسلخ، وهذا تغييرُ الجذر وحده. */
      function sideIcon() {
        var h = document.getElementById('side-handle'); if (!h) return;
        h.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"' +
          ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<rect x="3" y="4.5" width="18" height="15" rx="3.2"/><path d="M15.2 4.5v15"/></svg>';
      }
      /* ===== حالتان: سكّةٌ ⇄ واسع =====
         كانت ثالثةٌ (مطويٌّ بالكامل) ونُزعت من المحرّك نفسِه. والضغطةُ على المقبض
         تُعترض هنا في طور الالتقاط، فهذي الصفحةُ وحدَها تملك الحالة. */

      var RAIL_K = 'academia2:rail:v1';
      /* الحالُ على اللوح والمقبض وشريط التحديد لا على الجسد: صنفٌ على الجسد يُعيد حسابَ أنماط
         الصفحة كلِّها (قِيس: ٦٧٧ عنصرًا مع مادّةٍ مفتوحة)، وعلى اللوح ما تحته وحدَه */
      function sideEls() { return [document.getElementById('sidebar'), document.getElementById('side-handle'), document.getElementById('cx-selbar')].filter(Boolean); }
      function sideCls(c, on) { sideEls().forEach(function (el) { el.classList.toggle(c, !!on); }); }
      function isRail() { var sb = document.getElementById('sidebar'); return !!sb && sb.classList.contains('side-rail'); }
      function setRail(on) {
        sideCls('side-rail', on);
        try { localStorage.setItem(RAIL_K, on ? '1' : ''); } catch (e) {}
        var h = document.getElementById('side-handle');
        if (h) h.title = h.ariaLabel = on ? 'توسيع الشريط' : 'تضييق الشريط';
      }
      document.getElementById('side-handle').addEventListener('click', function (e) {
        e.stopImmediatePropagation(); e.preventDefault();
        /* الحركةُ للضغطة وحدَها (‎side-anim‎): تُرفع بعد انتهائها فلا تتحرّك الصفحةُ عند فتحها */
        clearTimeout(setRail.t);
        sideCls('side-anim', true); setRail(!isRail());
        setRail.t = setTimeout(function () { sideCls('side-anim', false); }, 360);
      }, true);
      /* السكّةُ هي الافتراض (الواسعُ لوحٌ يطفو فوق المحتوى): من لم يختر شيئًا (‎null‎) فسكّة، ومن اختار الواسعَ (‎''‎) بقي عليه */ var rail0 = true; try { var rv = localStorage.getItem(RAIL_K); rail0 = rv === null || !!rv; } catch (e) {} sideCls('side-rail', rail0);

      document.addEventListener('DOMContentLoaded', function () {
        setRail(isRail());   /* والعنوانُ يتبع الحال */
        paint(); sideIcon();
      });
    })();
  </script>

       ما نفعله **استيرادٌ لا ربط**: البطائقُ تصير بيانًا في الموقع كأنّك كتبتَها بيدك،

  <script>document.write('<script src="app' + (AC_MIN ? '.min.js?v=' + AC_MINV : '.js') + '"><\/script>');</script>

    if (AC_MIN && (!window.AC_MINOK || getComputedStyle(document.documentElement).getPropertyValue('--ac-min').trim() !== String(window.AC_VER))) {
      var acL = document.querySelector('link[href*="styles.min.css"]'); if (acL) acL.href = '../shared/styles.css?v=1';

<!-- ===== رقمُ النسخة: أسفلَ اليسار، لا يُلتقط ولا يُطبَع =====
     غرضُه واحد: أن يَعرف الناظرُ **أيَّ بناءٍ** يَرى. فمن فتح نسخةً مخزَّنةً في
     متصفّحه أو خادمًا محلّيًّا قديمًا رأى رقمًا أقدمَ من المنشور فعَلِم.
     وهو مشتقٌّ من عدد الإيداعات (‎_ver.sh‎) لا مكتوبٌ بيدٍ تَسهو. -->
<div id="acver" aria-hidden="true"></div>
<script>
  (function(){ var e=document.getElementById('acver');
    if (e) e.textContent = 'ver ' + (window.AC_VER || '?'); })();
