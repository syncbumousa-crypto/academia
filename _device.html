<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديميا — معاينة الأجهزة</title>
<!--
  ===== معاينةُ الأجهزة — أداةُ تطوير لا تُنشر =====
  تعرض المنصّةَ داخل إطارِ iPhone وiPhone Duo والآيبادات بمقاساتها الحقيقيّة بالنقاط،
  مع المنطقة الآمنة (Dynamic Island وخطّ الرجوع). واسمُها يبدأ بشرطة في الجذر
  فيستثنيها ‎.vercelignore‎ ‏(‎/_*‎) ولا تُرفع إلى فيرسل.

  التشغيل — من جذر المشروع:
      python -m http.server 8000
  ثم افتح:  http://localhost:8000/_device.html
  (من ‎file://‎ تعمل المعاينة، لكن حقنَ المنطقة الآمنة في الصفحة يحتاج خادمًا محليًّا)

  روابط مباشرة:  _device.html?device=iphone15   ·   ?device=duoInner   ·   ?landscape=1
  تفتح المسلخ افتراضيًّا، وأيّ صفحة أخرى:  _device.html?src=platform/index.html
  والمنشورة:  https://syncbumousa-crypto.github.io/academia/_device.html

  المنطقة الآمنة تُحقن في الصفحة المعروضة كمتغيّرات CSS على ‎<html>‎:
      --safe-top  --safe-bottom  --safe-left  --safe-right
  ومعها السمة ‎data-device-preview‎ — فتُكتب قواعدُ الجوال هكذا:
      padding-top: var(--safe-top, env(safe-area-inset-top, 0px));
  فتعمل في المعاينة وعلى الآيفون الحقيقي معًا.
  الاختصارات:  R تدوير · F طيّ Duo · S المنطقة الآمنة · B كروم Safari
  ووضعُ Safari هو الأصل (‎?browser=0‎ يعرض الصفحة كتطبيقٍ ملءَ الشاشة)
-->
<style>
  :root {
    --bg: #1c1c1e; --panel: #2c2c2e; --text: #f2f2f7; --muted: #8e8e93;
    --accent: #0a84ff; --frame: #111; --bezel: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Tahoma, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid #3a3a3c;
    position: sticky; top: 0; z-index: 10;
  }
  header label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=text], button {
    font: inherit; font-size: 13px; color: var(--text); background: #3a3a3c;
    border: 1px solid #48484a; border-radius: 8px; padding: 6px 10px;
  }
  input[type=text] { width: 220px; direction: ltr; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); }
  #info { font-size: 12px; color: var(--muted); margin-inline-start: auto; direction: ltr; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 30px; overflow: auto; }
  #stage { transform-origin: center center; transition: transform .2s; }

  .device {
    position: relative; background: var(--frame); padding: var(--bezel);
    border-radius: calc(var(--radius) + var(--bezel));
    box-shadow: 0 0 0 2px #3a3a3c, 0 30px 60px rgba(0,0,0,.5);
  }
  .screen {
    position: relative; overflow: hidden; background: #fff;
    border-radius: var(--radius);
  }
  .screen iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .safe { position: absolute; background: rgba(255, 59, 48, .18); outline: 1px dashed rgba(255,59,48,.6); outline-offset: -1px; }
  .hidden { display: none !important; }
  .island {
    position: absolute; background: #000; border-radius: 20px; z-index: 3;
    left: 50%; transform: translateX(-50%);
  }
  .island.landscape { left: 11px; top: 50% !important; transform: translateY(-50%); }
  .homebar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.85); z-index: 3;
  }
  .hinge {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,.25), transparent); z-index: 2;
  }
  /* ===== وضع Safari: كروم المتصفح كما يراه من يفتح الرابط ===== */
  .screen.browser { display: flex; flex-direction: column; background: #f2f2f7; }
  .screen.browser iframe { flex: 1; min-height: 0; height: auto; }
  .sb { flex: none; display: flex; align-items: center; justify-content: space-between;
        direction: ltr; padding: 0 30px; color: #000; font: 600 17px/1 -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: -.2px; background: #f2f2f7; }
  .sb .icons { display: flex; align-items: center; gap: 6px; }
  .sb.ipad { font-size: 13px; padding: 0 20px; }
  .sb.ipad .date { font-weight: 500; margin-inline-start: 6px; }
  .addr { flex: none; display: flex; align-items: center; gap: 8px; direction: ltr;
          padding: 4px 12px 8px; background: #f2f2f7; border-bottom: .5px solid rgba(0,0,0,.15); }
  .field { flex: 1; height: 38px; border-radius: 12px; background: rgba(118,118,128,.14);
           display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
           color: #000; font: 400 17px -apple-system, "SF Pro Text", "Segoe UI", sans-serif; min-width: 0; }
  .field .aa { font-size: 15px; font-weight: 500; }
  .field .host { display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tb { flex: none; display: flex; align-items: flex-start; justify-content: space-around; direction: ltr;
        padding-top: 8px; background: #f2f2f7; border-top: .5px solid rgba(0,0,0,.15); }
  .tb svg, .addr > svg { flex: none; }
  .screen.browser .safe { display: none; }
  .note { font-size: 11px; color: #ff9f0a; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <label>الجهاز
    <select id="device"></select>
  </label>
  <label>الشاشة
    <input type="text" id="src" placeholder="Almaslakh/index.html — فارغ = عيّنة">
  </label>
  <button id="load">تحميل</button>
  <button id="browserBtn" class="on">Safari</button>
  <button id="rotate">↻ تدوير</button>
  <button id="fold" class="hidden">فتح / طي Duo</button>
  <button id="safeBtn" class="on">المنطقة الآمنة</button>
  <label>التكبير
    <select id="zoom">
      <option value="fit">ملاءمة</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
  </label>
  <span id="info"></span>
</header>

<main><div id="stage"></div></main>

<script>
/* كل القيم بالنقاط (pt).
   safe: [أعلى, أسفل] للوضع العمودي — safeL: [أعلى, أسفل, يسار/يمين] للوضع الأفقي
   island: [عرض, ارتفاع, المسافة من الأعلى] — est: مقاسات غير رسمية */
const DEVICES = {
  iphone15:   { name: 'iPhone 15 / 15 Pro',         w: 393,  h: 852,  r: 55, safe: [59, 34], safeL: [0, 21, 59], island: [126, 37, 11], home: true },
  iphone15pm: { name: 'iPhone 15 Plus / Pro Max',   w: 430,  h: 932,  r: 55, safe: [59, 34], safeL: [0, 21, 59], island: [126, 37, 11], home: true },
  iphonese:   { name: 'iPhone SE',                  w: 375,  h: 667,  r: 0,  safe: [20, 0],  safeL: [0, 0, 0] },
  duoOuter:   { name: 'iPhone Duo (مطوي)',          w: 466,  h: 678,  r: 48, safe: [59, 34], safeL: [0, 21, 59], island: [126, 37, 11], home: true, duo: 'duoInner', estSafe: true },
  duoInner:   { name: 'iPhone Duo (مفتوح)',         w: 669,  h: 951,  r: 40, safe: [59, 34], safeL: [0, 21, 59], island: [126, 37, 11], home: true, duo: 'duoOuter', est: true, hinge: true },
  ipadmini:   { name: 'iPad mini (A17 Pro)',        w: 744,  h: 1133, r: 22, safe: [24, 20], safeL: [24, 20, 0], home: true },
  ipadmini26: { name: 'iPad mini (A20 Pro، 2026)',  w: 756,  h: 1158, r: 22, safe: [24, 20], safeL: [24, 20, 0], home: true, est: true },
  ipad11:     { name: 'iPad / iPad Air 11',         w: 820,  h: 1180, r: 18, safe: [24, 20], safeL: [24, 20, 0], home: true },
  ipadpro11:  { name: 'iPad Pro 11 (M5)',           w: 834,  h: 1210, r: 18, safe: [24, 20], safeL: [24, 20, 0], home: true },
  ipadair13:  { name: 'iPad Air 13',                w: 1024, h: 1366, r: 18, safe: [24, 20], safeL: [24, 20, 0], home: true },
  ipadpro13:  { name: 'iPad Pro 13 (M5)',           w: 1032, h: 1376, r: 18, safe: [24, 20], safeL: [24, 20, 0], home: true },
};

const DEMO = `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
  body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f2f2f7;height:100vh;display:flex;flex-direction:column}
  .nav{padding:calc(var(--safe-top,0px) + 8px) 16px 8px;background:#f9f9f9;border-bottom:1px solid #d1d1d6}
  .nav h1{margin:6px 0 0;font-size:34px;font-weight:700}
  .list{flex:1;overflow:auto;padding:16px}
  .row{background:#fff;padding:14px 16px;border-bottom:1px solid #e5e5ea;font-size:17px}
  .row:first-child{border-radius:10px 10px 0 0}.row:last-child{border-radius:0 0 10px 10px;border:0}
  .tabs{display:flex;justify-content:space-around;padding:8px 0 calc(var(--safe-bottom,0px));background:#f9f9f9;border-top:1px solid #d1d1d6;font-size:11px;color:#8e8e93}
  .tabs b{color:#0a84ff}
</style><script>
  const p=new URLSearchParams(location.search);
  ['Top','Bottom','Left','Right'].forEach(s=>document.documentElement.style.setProperty('--safe-'+s.toLowerCase(),(p.get('safe'+s)||0)+'px'));
<\/script></head><body>
  <div class="nav"><h1>الرئيسية</h1></div>
  <div class="list"><div class="row">العنصر الأول</div><div class="row">العنصر الثاني</div><div class="row">العنصر الثالث</div></div>
  <div class="tabs"><b>الرئيسية</b><span>البحث</span><span>الحساب</span></div>
</body></html>`;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const state = {
  device: DEVICES[params.get('device')] ? params.get('device') : 'iphone15',
  src: params.has('src') ? params.get('src') : 'Almaslakh/index.html',
  landscape: params.get('landscape') === '1',
  safe: true,
  browser: params.get('browser') !== '0',
  zoom: 'fit',
};

for (const [key, d] of Object.entries(DEVICES)) {
  const o = document.createElement('option');
  o.value = key; o.textContent = d.name + (d.est ? ' *' : '');
  $('device').appendChild(o);
}

function safeArea(d, landscape) {
  if (!landscape) return { top: d.safe[0], bottom: d.safe[1], left: 0, right: 0 };
  return { top: d.safeL[0], bottom: d.safeL[1], left: d.safeL[2], right: d.safeL[2] };
}

function render() {
  const d = DEVICES[state.device];
  const w = state.landscape ? d.h : d.w;
  const h = state.landscape ? d.w : d.h;
  const sa = state.browser
    ? { top: 0, bottom: 0, left: state.landscape ? d.safeL[2] : 0, right: state.landscape ? d.safeL[2] : 0 }
    : safeArea(d, state.landscape);

  const q = `safeTop=${sa.top}&safeBottom=${sa.bottom}&safeLeft=${sa.left}&safeRight=${sa.right}&width=${w}&height=${h}`;
  const frame = document.createElement('iframe');
  if (state.src) {
    // الرابطُ لا يُمسّ: المحرّك يقرأ ‎location.search‎ ويعيد كتابته، فتُحقن القيمُ بعد التحميل
    frame.src = state.src;
    frame.addEventListener('load', () => injectSafeArea(frame, sa, d));
  } else {
    frame.srcdoc = DEMO.replace('location.search', JSON.stringify('?' + q));
  }

  const dev = document.createElement('div');
  dev.className = 'device';
  dev.style.setProperty('--radius', d.r + 'px');
  dev.style.setProperty('--bezel', d.r ? '14px' : '50px 14px');

  const screen = document.createElement('div');
  screen.className = 'screen' + (state.browser ? ' browser' : '');
  screen.style.width = w + 'px';
  screen.style.height = h + 'px';
  if (state.browser) buildSafari(screen, frame, d, w, h);
  else screen.appendChild(frame);

  const ov = document.createElement('div');
  ov.className = 'overlay';
  if (d.island) {
    const isl = document.createElement('div');
    isl.className = 'island' + (state.landscape ? ' landscape' : '');
    const [iw, ih, it] = d.island;
    isl.style.width = (state.landscape ? ih : iw) + 'px';
    isl.style.height = (state.landscape ? iw : ih) + 'px';
    isl.style.top = it + 'px';
    ov.appendChild(isl);
  }
  if (d.home) {
    const hb = document.createElement('div');
    hb.className = 'homebar';
    if (d.w >= 700) hb.style.width = '320px';
    ov.appendChild(hb);
  }
  if (d.hinge && !state.landscape) {
    const hg = document.createElement('div');
    hg.className = 'hinge';
    ov.appendChild(hg);
  }
  const areas = [
    { top: 0, left: 0, right: 0, height: sa.top },
    { bottom: 0, left: 0, right: 0, height: sa.bottom },
    { top: 0, bottom: 0, left: 0, width: sa.left },
    { top: 0, bottom: 0, right: 0, width: sa.right },
  ];
  for (const a of areas) {
    if (!(a.height || a.width)) continue;
    const s = document.createElement('div');
    s.className = 'safe' + (state.safe ? '' : ' hidden');
    for (const k in a) s.style[k] = a[k] + 'px';
    ov.appendChild(s);
  }
  screen.appendChild(ov);
  dev.appendChild(screen);

  const stage = $('stage');
  stage.innerHTML = '';
  stage.appendChild(dev);
  if (d.est || d.estSafe) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = d.est
      ? '* مقاس تقديري غير رسمي — تأكد منه في المحاكي'
      : '* المنطقة الآمنة تقديرية — تأكد منها في المحاكي';
    stage.appendChild(n);
  }

  $('device').value = state.device;
  $('src').value = state.src;
  $('fold').classList.toggle('hidden', !d.duo);
  $('safeBtn').classList.toggle('on', state.safe);
  $('rotate').classList.toggle('on', state.landscape);
  $('browserBtn').classList.toggle('on', state.browser);
  const vh = state.browser ? h - chromeHeight(d) : h;
  $('info').textContent = (state.browser ? `صفحة Safari ${w} × ${vh} pt  |  جهاز ${w} × ${h}` : `${w} × ${h} pt`)
    + `  |  safe ↑${sa.top} ↓${sa.bottom}` + (sa.left ? ` ↔${sa.left}` : '');

  applyZoom();
  saveToUrl();
}

/* ===== كروم Safari =====
   iPhone بتخطيط «الشريط في الأعلى»: شريط الحالة ← شريط العنوان ← الصفحة ← شريط الأدوات.
   iPad: شريط الحالة ← صفّ واحد فيه الأزرار والعنوان. والأفقي في iPhone: شريط العنوان وحده.
   الارتفاعات بالنقاط، قريبةٌ من Safari على iOS 26 لا مطابقة له بكسلًا بكسل. */
const SITE_HOST = 'syncbumousa-crypto.github.io';
const ICON = {
  signal: '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
  wifi: '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.8 10.8 0 0 0 8 .4C5.1.4 2.5 1.5.5 3.4l1.2 1.3A9 9 0 0 1 8 2.2Zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3A7.2 7.2 0 0 0 8 4a7.2 7.2 0 0 0-4.9 1.9l1.2 1.3A5.4 5.4 0 0 1 8 5.8Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.8c-.3-.3-.8-.5-1.3-.5Z"/></svg>',
  battery: '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".45"/></svg>',
  lock: '<svg width="10" height="13" viewBox="0 0 10 13" fill="#3c3c43"><path d="M2.5 5.5V3.8a2.5 2.5 0 0 1 5 0v1.7h.8c.7 0 1.2.5 1.2 1.2v4.6c0 .7-.5 1.2-1.2 1.2H1.7C1 12.5.5 12 .5 11.3V6.7c0-.7.5-1.2 1.2-1.2h.8Zm1.3 0h2.4V3.8a1.2 1.2 0 0 0-2.4 0v1.7Z"/></svg>',
  reload: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.1"/><path d="M12.2 1.2v3.2H9"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#007aff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5 6.5 11 14 18.5"/></svg>',
  fwd: '<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#c4c4c7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3.5 7.5 7.5L8 18.5"/></svg>',
  share: '<svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="#007aff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15V2M6.5 6.2 11 1.7l4.5 4.5"/><path d="M7.5 10H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V12a2 2 0 0 0-2-2h-2.5"/></svg>',
  book: '<svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#007aff" stroke-width="1.9" stroke-linejoin="round"><path d="M13 4.5C10.5 2.4 6.5 2 2 2.6v16c4.5-.6 8.5-.2 11 1.9 2.5-2.1 6.5-2.5 11-1.9v-16c-4.5-.6-8.5-.2-11 1.9Zm0 0v16"/></svg>',
  tabs: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="1.9" stroke-linejoin="round"><rect x="2" y="7" width="15" height="15" rx="3"/><path d="M7 4.5V4a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-.5"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round"><path d="M10 3v14M3 10h14"/></svg>',
};

function isIpad(d) { return d.w >= 700 && !d.duo; }

// ارتفاعُ الكروم كلّه — لحساب المساحة التي تبقى للصفحة
function chromeHeight(d) {
  if (state.landscape && !isIpad(d)) return 48;
  if (isIpad(d)) return 24 + 50;
  const status = d.island ? 54 : 20;
  const bottom = d.home ? 49 + 34 : 44;
  return status + 48 + bottom;
}

function statusBar(d) {
  const sb = document.createElement('div');
  sb.className = 'sb' + (isIpad(d) ? ' ipad' : '');
  sb.style.height = (isIpad(d) ? 24 : d.island ? 54 : 20) + 'px';
  if (d.island) sb.style.paddingTop = '6px';
  const icons = `<span class="icons">${ICON.signal}${ICON.wifi}${ICON.battery}</span>`;
  sb.innerHTML = isIpad(d)
    ? `<span>9:41<span class="date">Sat Nov 14</span></span>${icons}`
    : `<span style="width:54px;text-align:center">9:41</span>${icons}`;
  sb.querySelectorAll('svg').forEach(el => el.setAttribute('fill', 'currentColor'));
  if (!d.island && !isIpad(d)) { sb.style.fontSize = '12px'; sb.style.padding = '0 8px'; }
  return sb;
}

function addressField() {
  const f = document.createElement('div');
  f.className = 'field';
  f.innerHTML = `<span class="aa">ᴀA</span><span class="host">${ICON.lock}${SITE_HOST}</span>${ICON.reload}`;
  return f;
}

function buildSafari(screen, frame, d, w, h) {
  const ipad = isIpad(d);
  const land = state.landscape && !ipad;

  if (!land) screen.appendChild(statusBar(d));

  const addr = document.createElement('div');
  addr.className = 'addr';
  if (ipad) {
    addr.style.height = '50px';
    addr.style.gap = '18px';
    addr.style.padding = '6px 20px';
    addr.innerHTML = ICON.back + ICON.fwd + ICON.book;
    const fld = addressField();
    fld.style.maxWidth = '420px';
    fld.style.margin = '0 auto';
    addr.appendChild(fld);
    addr.insertAdjacentHTML('beforeend', ICON.share + ICON.plus + ICON.tabs);
  } else if (land) {
    addr.style.height = '48px';
    addr.style.padding = `5px ${d.safeL[2] + 6}px`;
    addr.style.gap = '16px';
    addr.innerHTML = ICON.back + ICON.fwd;
    addr.appendChild(addressField());
    addr.insertAdjacentHTML('beforeend', ICON.share + ICON.book + ICON.tabs);
  } else {
    addr.style.height = '48px';
    addr.appendChild(addressField());
  }
  screen.appendChild(addr);
  screen.appendChild(frame);

  if (!ipad && !land) {
    const tb = document.createElement('div');
    tb.className = 'tb';
    tb.style.height = (d.home ? 49 + 34 : 44) + 'px';
    tb.innerHTML = ICON.back + ICON.fwd + ICON.share + ICON.book + ICON.tabs;
    screen.appendChild(tb);
  }
}

// يكتب المنطقةَ الآمنة في الصفحة المعروضة — يصحّ على أصلٍ واحد فقط (خادمٌ محلّي)
function injectSafeArea(frame, sa, d) {
  let doc;
  try { doc = frame.contentDocument; } catch (e) { doc = null; }
  if (!doc || !doc.documentElement) {
    $('info').textContent += '  |  ⚠ شغّل خادمًا محليًّا لحقن المنطقة الآمنة';
    return;
  }
  const root = doc.documentElement;
  root.style.setProperty('--safe-top', sa.top + 'px');
  root.style.setProperty('--safe-bottom', sa.bottom + 'px');
  root.style.setProperty('--safe-left', sa.left + 'px');
  root.style.setProperty('--safe-right', sa.right + 'px');
  root.setAttribute('data-device-preview', state.device);
}

// يحفظ الجهاز والشاشة في الرابط — ويتجاهل البيئات اللي ما تسمح بتعديل الرابط (مثل المعاينة داخل iframe)
function saveToUrl() {
  if (location.protocol === 'about:') return;
  try {
    const url = new URL(location.href);
    url.searchParams.set('device', state.device);
    state.src === 'Almaslakh/index.html' ? url.searchParams.delete('src') : url.searchParams.set('src', state.src);
    state.landscape ? url.searchParams.set('landscape', '1') : url.searchParams.delete('landscape');
    state.browser ? url.searchParams.delete('browser') : url.searchParams.set('browser', '0');
    history.replaceState(null, '', url);
  } catch (e) { /* المتصفح منع تعديل الرابط — ما يأثر على العرض */ }
}

function applyZoom() {
  const stage = $('stage');
  stage.style.transform = 'none';
  let z = state.zoom === 'fit' ? null : parseFloat(state.zoom);
  if (z === null) {
    const main = document.querySelector('main');
    const r = stage.getBoundingClientRect();
    z = Math.min(1, (main.clientWidth - 60) / r.width, (main.clientHeight - 60) / r.height);
  }
  stage.style.transform = `scale(${z})`;
}

$('device').onchange = e => { state.device = e.target.value; render(); };
$('load').onclick = () => { state.src = $('src').value.trim(); render(); };
$('src').onkeydown = e => { if (e.key === 'Enter') $('load').click(); };
$('rotate').onclick = () => { state.landscape = !state.landscape; render(); };
$('browserBtn').onclick = () => { state.browser = !state.browser; render(); };
$('fold').onclick = () => { state.device = DEVICES[state.device].duo; render(); };
$('safeBtn').onclick = () => { state.safe = !state.safe; render(); };
$('zoom').onchange = e => { state.zoom = e.target.value; applyZoom(); };
window.onresize = applyZoom;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'r') $('rotate').click();
  if (e.key === 'f' && !$('fold').classList.contains('hidden')) $('fold').click();
  if (e.key === 's') $('safeBtn').click();
  if (e.key === 'b') $('browserBtn').click();
});

render();
</script>
</body>
</html>
